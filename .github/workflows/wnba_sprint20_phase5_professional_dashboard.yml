name: WNBA Sprint 20 Phase 5 Professional Dashboard

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Target date (YYYY-MM-DD), blank for active slate'
        required: false
        default: ''
  workflow_run:
    workflows: ['WNBA Sprint 20 Phase 4 Opportunity Finder']
    types: [completed]

concurrency:
  group: wnba-sprint20-phase5-professional-dashboard
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  build-professional-dashboard:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest repository
        run: git pull --rebase origin main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install -r requirements.txt
      - name: Resolve target date
        run: |
          set -euo pipefail
          TARGET=$(python active_slate_date.py --date "${{ github.event.inputs.date }}")
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
      - name: Validate Phase 5 code
        run: |
          set -euo pipefail
          python -m py_compile wnba_professional_dashboard.py qa_sprint20_phase5_professional_dashboard.py
          python qa_sprint20_phase5_professional_dashboard.py
      - name: Build professional dashboard
        run: |
          set -euo pipefail
          python wnba_professional_dashboard.py --date "$TARGET"
      - name: Verify dashboard artifacts
        run: |
          set -euo pipefail
          test -s data/warehouse/professional_dashboard.json
          test -s data/dashboard/professional_dashboard.json
          test -s docs/data/professional_dashboard.json
          test -s docs/index.html
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('data/warehouse/professional_dashboard.json').read_text())
          required={'scanned_opportunities','actionable_opportunities','arbitrage_opportunities','middle_opportunities','tracked_markets','line_shopping_markets','ranked_opportunities'}
          missing=required-set(report.get('executive_summary',{}))
          assert not missing,missing
          assert report.get('command_center') and report.get('source_health')
          print('Sprint 20 Phase 5 verification passed:',report['executive_summary'])
          PY
      - name: Commit Phase 5 artifacts
        run: |
          set -euo pipefail
          git config user.name 'WNBA Model Bot'
          git config user.email 'actions@github.com'
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git add data/warehouse/professional_dashboard.json data/dashboard/professional_dashboard.json docs/data/professional_dashboard.json
          git diff --cached --quiet && echo 'No professional dashboard changes' && exit 0
          git commit -m "Update WNBA professional dashboard - ${TARGET}"
          test -z "$(git status --porcelain)" || { git status --short; exit 1; }
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then echo "Pushed on attempt $attempt"; exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
