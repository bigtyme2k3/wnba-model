name: WNBA Daily Slate Rollover

on:
  workflow_dispatch:
  schedule:
    # 6:45 AM Eastern during daylight time. A second 11:45 UTC run covers standard time.
    - cron: '45 10 * * *'
    - cron: '45 11 * * *'

permissions:
  contents: write

concurrency:
  group: wnba-main-writer
  cancel-in-progress: false

jobs:
  rollover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest repository
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve Eastern slate date
        run: |
          TARGET=$(date +%F)
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "Morning rollover target: $TARGET"

      - name: Refresh schedule, results and sportsbook inputs
        run: |
          run_if_present() { [ -f "$1" ] && python "$@" || echo "Skipping unavailable $1"; }
          run_if_present wnba_live_results.py --date "$TARGET"
          run_if_present wnba_schedule_refresh.py --date "$TARGET"
          run_if_present wnba_current_slate.py --date "$TARGET"
          run_if_present wnba_odds_ingestion.py --date "$TARGET"
          run_if_present wnba_player_props_ingestion.py --date "$TARGET"
          run_if_present wnba_injury_refresh.py --date "$TARGET"

      - name: Rebuild current slate intelligence
        run: |
          run_if_present() { [ -f "$1" ] && python "$@" || echo "Skipping unavailable $1"; }
          run_if_present wnba_market_timeline.py
          run_if_present wnba_line_movement_engine.py
          run_if_present wnba_sportsbook_leader_normalization.py
          run_if_present wnba_opportunity_scanner.py
          run_if_present wnba_active_slate_scanner.py
          run_if_present wnba_minutes_projection.py --date "$TARGET"
          run_if_present wnba_unified_simulation.py --date "$TARGET"
          run_if_present wnba_best_bets.py --date "$TARGET"

      - name: Grade completed games and rebuild game performance
        run: |
          YESTERDAY=$(date -d yesterday +%F)
          if [ -f wnba_game_performance_tracker.py ]; then
            python wnba_game_performance_tracker.py --date "$YESTERDAY" --grade || true
            python wnba_game_performance_tracker.py --analyze
          fi
          if [ -f wnba_alt_performance_tracker.py ]; then
            python wnba_alt_performance_tracker.py --date "$YESTERDAY" --grade || true
            python wnba_alt_performance_tracker.py --date "$TARGET" --analyze
          fi

      - name: Build today's dashboard
        run: |
          python wnba_terminal_ui.py --date "$TARGET"
          python patch_terminal_ui.py
          [ -f patch_dashboard_v5_injury_intelligence.py ] && python patch_dashboard_v5_injury_intelligence.py || true
          [ -f patch_dashboard_v5_player_prop_injury_context.py ] && python patch_dashboard_v5_player_prop_injury_context.py || true
          python patch_terminal_ui.py
          python patch_dashboard_alt_grading_status.py
          python wnba_alt_pending_diagnostics.py
          [ -f data/dashboard/wnba_alt_recovery_progress.json ] && python patch_dashboard_alt_recovery_progress.py || true
          python patch_dashboard_game_performance.py
          python patch_dashboard_build_verification.py

      - name: Block stale prior-day dashboard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime
          target = Path('/tmp/target').read_text().strip() if Path('/tmp/target').exists() else None
          target = target or datetime.now().strftime('%Y-%m-%d')
          h = Path('docs/index.html').read_text(encoding='utf-8')
          if target not in h:
              raise SystemExit(f'Dashboard rollover blocked: target date {target} is not present in docs/index.html')
          if 'WNBA_GAME_PERFORMANCE_START' not in h:
              raise SystemExit('Dashboard rollover blocked: Game Performance panel missing')
          print('Morning slate rollover verified for', target)
          PY
        env:
          TARGET: ${{ env.TARGET }}

      - name: Publish morning slate
        run: |
          git config user.name 'WNBA Morning Rollover Bot'
          git config user.email 'actions@github.com'
          bash scripts/atomic_generated_push.sh \
            "Roll WNBA dashboard to ${TARGET} slate" \
            'data/dashboard' \
            'data/warehouse' \
            'data/market' \
            'data/forecast' \
            'docs/index.html'
