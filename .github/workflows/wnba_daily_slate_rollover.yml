name: WNBA Daily Slate Rollover

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/dashboard_refresh_request.txt'

permissions:
  contents: write
  actions: write

concurrency:
  group: wnba-main-writer
  cancel-in-progress: false

jobs:
  rollover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: America/New_York
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest repository
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve Eastern slate date
        run: |
          TARGET=$(date +%F)
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "Morning rollover target: $TARGET"

      - name: Refresh schedule, results and sportsbook inputs
        run: |
          run_if_present() { [ -f "$1" ] && python "$@" || echo "Skipping unavailable $1"; }
          run_if_present wnba_live_results.py --date "$TARGET"
          run_if_present wnba_schedule_refresh.py --date "$TARGET"
          run_if_present wnba_current_slate.py --date "$TARGET"
          run_if_present wnba_odds_ingestion.py --date "$TARGET"
          run_if_present wnba_player_props_ingestion.py --date "$TARGET"
          run_if_present wnba_injury_refresh.py --date "$TARGET"
          run_if_present wnba_remaining_season_intelligence.py

      - name: Rebuild current slate intelligence
        run: |
          run_if_present() { [ -f "$1" ] && python "$@" || echo "Skipping unavailable $1"; }
          run_if_present wnba_market_timeline.py
          run_if_present wnba_line_movement_engine.py
          run_if_present wnba_steam_sharp_engine.py
          run_if_present wnba_clv_intelligence.py
          run_if_present wnba_entry_window_intelligence.py
          run_if_present wnba_sportsbook_leader_normalization.py
          run_if_present wnba_opportunity_scanner.py
          run_if_present wnba_active_slate_scanner.py
          run_if_present wnba_minutes_projection.py --date "$TARGET"
          run_if_present wnba_unified_simulation.py --date "$TARGET"
          run_if_present wnba_best_bets.py --date "$TARGET"

      - name: Rebuild all dashboard tab data
        run: |
          run_if_present() { [ -f "$1" ] && python "$@" || echo "Skipping unavailable $1"; }
          run_if_present wnba_daily_edge_engine.py --date "$TARGET"
          run_if_present wnba_ensemble_intelligence_engine.py --date "$TARGET"
          run_if_present wnba_monte_carlo_scenario_engine.py --date "$TARGET"
          run_if_present wnba_portfolio_engine.py --date "$TARGET"
          run_if_present wnba_player_prop_intelligence.py --date "$TARGET"
          run_if_present wnba_game_prop_intelligence.py --date "$TARGET"
          run_if_present wnba_forward_validation_engine.py --mode freeze --date "$TARGET"
          run_if_present wnba_readiness_engine.py
          run_if_present wnba_production_readiness.py
          run_if_present wnba_alt_market_watch.py --date "$TARGET"
          run_if_present wnba_alt_streak_engine.py --date "$TARGET"
          run_if_present wnba_remaining_season_intelligence.py

      - name: Freeze canonical current ALT observations
        run: |
          if [ -f wnba_alt_market_warehouse.py ] && [ -f wnba_alt_streaks.py ] && [ -f wnba_alt_performance_tracker.py ]; then
            python wnba_alt_market_warehouse.py --date "$TARGET"
            python wnba_alt_streaks.py --date "$TARGET"
            python wnba_opponent_stat_rankings.py --date "$TARGET"
            python wnba_alt_streaks_opponent_context.py
            ALT_MARKETS=$(python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/dashboard/wnba_alt_market_warehouse.json')
          d=json.loads(p.read_text()) if p.exists() else {}
          print(int((d.get('summary') or {}).get('markets') or 0))
          PY
            )
            if [ "$ALT_MARKETS" -gt 0 ]; then
              python wnba_alt_performance_tracker.py --date "$TARGET" --snapshot
            else
              echo "Exact ALT markets are not available yet for ${TARGET}; skipping only the pregame ALT snapshot."
              echo 'Historical grading, the remaining tabs, and later authenticated ALT writer runs will continue.'
            fi
          fi

      - name: Grade full historical backlog and rebuild performance data
        run: |
          YESTERDAY=$(date -d yesterday +%F)
          DAY_BEFORE=$(date -d '2 days ago' +%F)
          # Recheck a rolling ten-day window so a transient provider failure
          # cannot leave a permanent hole in player history. Merge and snapshot
          # after every date because the daily builder intentionally emits only
          # one date at a time.
          python wnba_player_game_log_archive.py snapshot
          # Grade completed games from the active slate without waiting for the
          # next-day rollover. The ESPN fallback admits only final/post events,
          # so unfinished same-day games remain pending rather than receiving
          # partial box-score totals.
          python wnba_espn_boxscore_fallback.py --date "$TARGET" || true
          python wnba_player_game_log_warehouse.py --date "$TARGET" || true
          python wnba_player_game_log_archive.py merge
          python wnba_player_game_log_archive.py snapshot
          for OFFSET in $(seq 10 -1 1); do
            DAY=$(date -d "$OFFSET days ago" +%F)
            python scrape_scores.py --date "$DAY" --boxscores || true
            python wnba_espn_boxscore_fallback.py --date "$DAY" || true
            python wnba_player_game_log_warehouse.py --date "$DAY" || true
            python wnba_player_game_log_archive.py merge
            python wnba_player_game_log_archive.py snapshot
          done
          # Results grader is date-scoped, so resolve every archived date that can
          # now be matched to verified player-game actuals. This is intentionally
          # oldest-first and never fabricates missing actuals.
          if [ -f wnba_results_grader.py ] && [ -f data/history/wnba_model_history.jsonl ]; then
            python - <<'PY' > /tmp/wnba_grade_dates.txt
          import json
          dates=set()
          with open('data/history/wnba_model_history.jsonl',encoding='utf-8') as f:
              for line in f:
                  try:
                      row=json.loads(line); d=str(row.get('date') or '')[:10]
                      if d: dates.add(d)
                  except Exception: pass
          print('\n'.join(sorted(dates)))
          PY
            while IFS= read -r d; do
              [ -n "$d" ] && python wnba_results_grader.py --date "$d"
            done < /tmp/wnba_grade_dates.txt
          elif [ -f wnba_results_grader.py ]; then
            python wnba_results_grader.py --date "$YESTERDAY"
          fi
          # ALT grader already indexes the complete player-game warehouse and
          # grades every unresolved canonical observation across all dates.
          if [ -f wnba_alt_performance_tracker.py ]; then
            python wnba_alt_performance_tracker.py --date "$TARGET" --grade
            python wnba_alt_performance_tracker.py --date "$TARGET" --analyze
          fi
          if [ -f wnba_game_predictions_ledger.py ]; then
            python wnba_game_predictions_ledger.py grade --date "$TARGET"
            python wnba_game_predictions_ledger.py grade --date "$DAY_BEFORE"
            python wnba_game_predictions_ledger.py grade --date "$YESTERDAY"
          fi
          if [ -f wnba_game_performance.py ]; then python wnba_game_performance.py; fi
          if [ -f wnba_edge_database.py ]; then python wnba_edge_database.py --date "$YESTERDAY"; fi
          if [ -f wnba_forward_validation_engine.py ]; then python wnba_forward_validation_engine.py --mode grade --date "$YESTERDAY" || true; fi
          [ -f wnba_alt_pending_diagnostics.py ] && python wnba_alt_pending_diagnostics.py || true

      - name: Reassert authoritative current slate after all rebuilds
        run: |
          if [ ! -f wnba_current_slate.py ]; then echo 'Missing authoritative current-slate refresher.' >&2; exit 1; fi
          python wnba_current_slate.py --date "$TARGET"
          python - <<'PY'
          import json, os
          from pathlib import Path
          target=os.environ['TARGET']; data=json.loads(Path('data/dashboard/wnba_master.json').read_text(encoding='utf-8')); actual=str(data.get('target_date') or '')
          if actual!=target: raise SystemExit(f'Final current-slate reassertion failed: expected {target}, found {actual or "missing"}')
          refresh=data.get('current_slate_refresh') or {}
          print({'final_master_target':actual,'today_games':data.get('summary',{}).get('today_games'),'source':refresh.get('source'),'fallback_errors':refresh.get('fallback_errors')})
          PY

      - name: Build dashboard tab freshness manifest
        run: |
          python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          target=os.environ['TARGET']; root=Path('data/dashboard'); now=datetime.now(timezone.utc)
          mapping={'games':['wnba_master.json','wnba_current_slate.json','wnba_daily_report.json','wnba_games.json'],'game_props':['wnba_game_props.json','wnba_game_prop_intelligence.json'],'player_props':['wnba_player_props.json','wnba_player_prop_intelligence.json'],'alt_streaks':['wnba_alt_streaks.json','wnba_alt_market_watch.json'],'alt_performance':['wnba_alt_performance.json','wnba_alt_pending_diagnostics.json'],'daily_edges':['wnba_daily_edges.json','wnba_daily_edge_engine.json'],'ensemble':['wnba_ensemble_intelligence.json','wnba_ensemble.json'],'simulation':['wnba_unified_simulation.json','wnba_monte_carlo_scenarios.json'],'best_bets':['wnba_best_bets.json'],'portfolio':['wnba_portfolio.json','wnba_portfolio_intelligence.json'],'results':['wnba_results_grading.json','wnba_results.json','wnba_live_results.json'],'performance':['wnba_game_performance.json','wnba_model_performance.json'],'explainability':['wnba_explainability.json','wnba_reasoning_layer.json'],'remaining_season':['wnba_remaining_season_intelligence.json'],'market_intelligence':['wnba_market_timeline_summary.json','wnba_line_movement_summary.json'],'injuries':['wnba_injury_intelligence.json']}
          tabs={}
          for tab,candidates in mapping.items():
              found=next((root/name for name in candidates if (root/name).exists()),None)
              if not found: tabs[tab]={'status':'missing','target_date':target,'file':None,'generated_at':None,'age_minutes':None}; continue
              modified=datetime.fromtimestamp(found.stat().st_mtime,timezone.utc); age=round((now-modified).total_seconds()/60,1)
              tabs[tab]={'status':'fresh' if age<=180 else 'stale','target_date':target,'file':str(found),'generated_at':modified.isoformat(),'age_minutes':age}
          payload={'target_date':target,'generated_at':now.isoformat(),'tabs':tabs}; root.mkdir(parents=True,exist_ok=True); (root/'wnba_tab_freshness.json').write_text(json.dumps(payload,indent=2),encoding='utf-8'); print(json.dumps(payload,indent=2))
          PY

      - name: Verify generated current slate and required tab data
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          target=os.environ['TARGET']; master=Path('data/dashboard/wnba_master.json')
          if not master.exists(): raise SystemExit('Canonical current-slate file was not generated')
          data=json.loads(master.read_text(encoding='utf-8')); actual=str(data.get('target_date') or '')
          if actual!=target: raise SystemExit(f'Canonical current-slate target mismatch: expected {target}, found {actual or "missing"}')
          payload=json.loads(Path('data/dashboard/wnba_tab_freshness.json').read_text(encoding='utf-8'))
          if str(payload.get('target_date') or '')!=target: raise SystemExit('Freshness manifest target mismatch')
          critical=['games','daily_edges','ensemble','simulation','best_bets','results','performance','remaining_season']; missing=[name for name in critical if payload['tabs'].get(name,{}).get('status')=='missing']
          print({'target':target,'master_target_date':actual,'today_games':data.get('summary',{}).get('today_games'),'critical_missing':missing})
          if missing: print('WARNING: critical tabs missing data:',', '.join(missing))
          PY
          if git diff --quiet -- data/dashboard data/wnba data/warehouse data/market data/forecast data/history; then echo 'Rollover generated no publishable data changes; refusing false-success completion.' >&2; exit 1; fi
          echo 'Generated publishable changes:'
          git status --short -- data/dashboard data/wnba data/warehouse data/market data/forecast data/history

      - name: Publish refreshed tab and slate data
        run: |
          git config user.name 'WNBA Morning Rollover Bot'
          git config user.email 'actions@github.com'
          bash scripts/atomic_generated_push.sh \
            "Refresh all WNBA dashboard tabs for ${TARGET}" \
            'data/dashboard' \
            'data/wnba' \
            'data/warehouse' \
            'data/market' \
            'data/forecast' \
            'data/history' \
            'data/raw/scores_historical.csv' \
            'data/raw/scores_*.csv' \
            'data/raw/boxscores_*.csv' \
            'data/raw/wnba_boxscores_*.json'

      - name: Verify published main commit and dispatch deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          PUBLISHED_SHA=$(git rev-parse origin/main)
          echo "PUBLISHED_SHA=$PUBLISHED_SHA" >> "$GITHUB_ENV"
          echo "Published main commit: $PUBLISHED_SHA"
          git show "origin/main:data/dashboard/wnba_master.json" > /tmp/published_wnba_master.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          target=os.environ['TARGET']; data=json.loads(Path('/tmp/published_wnba_master.json').read_text(encoding='utf-8')); actual=str(data.get('target_date') or '')
          if actual!=target: raise SystemExit(f'Published main is stale: expected target_date {target}, found {actual or "missing"}')
          print({'published_target_date':actual,'today_games':data.get('summary',{}).get('today_games')})
          PY
          CHANGED=$(git diff-tree --no-commit-id --name-only -r "$PUBLISHED_SHA")
          echo "$CHANGED"
          if ! grep -q '^data/dashboard/' <<< "$CHANGED"; then echo 'Published commit did not contain dashboard data; refusing deployment dispatch.' >&2; exit 1; fi
          # Commits created with GITHUB_TOKEN do not trigger other push
          # workflows. Dispatch Pages explicitly after the verified publish.
          gh workflow run deploy_wnba_dashboard.yml --ref main
          echo 'Dashboard data is committed to main and deployment was explicitly dispatched.'
