name: WNBA Daily Slate Rollover

# Maintenance mode: scheduled rollover remains paused during the WNBA/FIBA
# break. Canonical slate, injury, prediction, ALT, grading, and forward-evidence
# artifacts are owned by their dedicated workflows. This workflow consumes
# those sources and refreshes only derived dashboard intelligence. Production
# execution is workflow_call from the V5 orchestrator or manual dispatch only.
on:
  workflow_call:
    inputs:
      target_date:
        description: Optional authoritative slate date (YYYY-MM-DD)
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      target_date:
        description: Optional authoritative slate date (YYYY-MM-DD)
        required: false
        type: string
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: wnba-main-writer
  cancel-in-progress: false

jobs:
  rollover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest repository
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve authoritative slate date
        run: |
          REQUESTED='${{ inputs.target_date }}'
          if [ -n "$REQUESTED" ]; then
            TARGET="$REQUESTED"
          else
            TARGET=$(python active_slate_date.py)
          fi
          test -n "$TARGET"
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "Derived rollover target: $TARGET"

      - name: Verify source-owned current slate stack
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          target=os.environ['TARGET']
          sources={
              'master':'data/dashboard/wnba_master.json',
              'standard_props':'data/dashboard/wnba_player_props.json',
              'manifest':'data/dashboard/wnba_daily_canonical_manifest.json',
              'base_predictions':'data/dashboard/wnba_sprint2_predictions.json',
              'injury':'data/dashboard/wnba_injury_intelligence.json',
              'phase2':'data/dashboard/wnba_sprint2_phase2.json',
              'm02':'data/dashboard/wnba_s19_m02_predictions.json',
              'm02_audit':'data/dashboard/wnba_s19_m02_prediction_audit.json',
          }
          loaded={}
          for name,path in sources.items():
              p=Path(path)
              if not p.exists():
                  raise SystemExit(f'Missing source-owned artifact: {path}')
              payload=json.loads(p.read_text(encoding='utf-8'))
              actual=str(payload.get('target_date') or '')[:10]
              if actual != target:
                  raise SystemExit(f'{name} source stale: {actual} != {target}')
              loaded[name]=payload

          assert loaded['manifest'].get('status') == 'PASS', loaded['manifest'].get('failures')
          assert loaded['base_predictions'].get('status') == 'PASS', loaded['base_predictions']
          assert loaded['injury'].get('source_only') is True, 'Injury context must be source-only'
          assert loaded['phase2'].get('status') == 'PASS', loaded['phase2']
          assert loaded['m02'].get('status') == 'READY', loaded['m02']
          assert loaded['m02_audit'].get('status') == 'READY', loaded['m02_audit']
          print({
              'status':'SOURCE_STACK_READY',
              'target':target,
              'games':len(loaded['phase2'].get('games') or []),
              'standard_props':int(loaded['standard_props'].get('row_count') or len(loaded['standard_props'].get('rows') or [])),
              'm02_player_props':int(loaded['m02_audit'].get('player_prop_predictions') or 0),
              'injury_source_verified':loaded['injury'].get('injury_source_verified'),
          })
          PY

      - name: Rebuild derived market and slate intelligence
        run: |
          run_if_present() { [ -f "$1" ] && python "$@" || echo "Skipping unavailable $1"; }
          run_if_present wnba_market_timeline.py
          run_if_present wnba_line_movement_engine.py
          run_if_present wnba_steam_sharp_engine.py
          run_if_present wnba_clv_intelligence.py
          run_if_present wnba_entry_window_intelligence.py
          run_if_present wnba_sportsbook_leader_normalization.py
          run_if_present wnba_opportunity_scanner.py
          run_if_present wnba_active_slate_scanner.py
          run_if_present wnba_minutes_projection.py --date "$TARGET"
          run_if_present wnba_unified_simulation.py --date "$TARGET"
          run_if_present wnba_best_bets.py --date "$TARGET"

      - name: Rebuild derived dashboard tab data
        run: |
          run_if_present() { [ -f "$1" ] && python "$@" || echo "Skipping unavailable $1"; }
          run_if_present wnba_daily_edge_engine.py --date "$TARGET"
          run_if_present wnba_ensemble_intelligence_engine.py --date "$TARGET"
          run_if_present wnba_monte_carlo_scenario_engine.py --date "$TARGET"
          run_if_present wnba_portfolio_engine.py --date "$TARGET"
          run_if_present wnba_player_prop_intelligence.py --date "$TARGET"
          run_if_present wnba_game_prop_intelligence.py --date "$TARGET"
          run_if_present wnba_readiness_engine.py
          run_if_present wnba_production_readiness.py
          run_if_present wnba_alt_market_watch.py --date "$TARGET"
          run_if_present wnba_alt_streak_engine.py --date "$TARGET"
          run_if_present wnba_remaining_season_intelligence.py
          run_if_present wnba_game_performance.py
          run_if_present wnba_alt_pending_diagnostics.py

      - name: Build dashboard tab freshness manifest
        run: |
          python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          target=os.environ['TARGET']; root=Path('data/dashboard'); now=datetime.now(timezone.utc)
          mapping={'games':['wnba_master.json','wnba_current_slate.json','wnba_daily_report.json','wnba_games.json'],'game_props':['wnba_game_props.json','wnba_game_prop_intelligence.json'],'player_props':['wnba_player_props.json','wnba_player_prop_intelligence.json'],'alt_streaks':['wnba_alt_streaks.json','wnba_alt_market_watch.json'],'alt_performance':['wnba_alt_performance.json','wnba_alt_pending_diagnostics.json'],'daily_edges':['wnba_daily_edges.json','wnba_daily_edge_engine.json'],'ensemble':['wnba_ensemble_intelligence.json','wnba_ensemble.json'],'simulation':['wnba_unified_simulation.json','wnba_monte_carlo_scenarios.json'],'best_bets':['wnba_best_bets.json'],'portfolio':['wnba_portfolio.json','wnba_portfolio_intelligence.json'],'results':['wnba_results_grading.json','wnba_results.json','wnba_live_results.json'],'performance':['wnba_game_performance.json','wnba_model_performance.json'],'explainability':['wnba_explainability.json','wnba_reasoning_layer.json'],'remaining_season':['wnba_remaining_season_intelligence.json'],'market_intelligence':['wnba_market_timeline_summary.json','wnba_line_movement_summary.json'],'injuries':['wnba_injury_intelligence.json']}
          tabs={}
          for tab,candidates in mapping.items():
              found=next((root/name for name in candidates if (root/name).exists()),None)
              if not found: tabs[tab]={'status':'missing','target_date':target,'file':None,'generated_at':None,'age_minutes':None}; continue
              modified=datetime.fromtimestamp(found.stat().st_mtime,timezone.utc); age=round((now-modified).total_seconds()/60,1)
              tabs[tab]={'status':'fresh' if age<=180 else 'stale','target_date':target,'file':str(found),'generated_at':modified.isoformat(),'age_minutes':age}
          payload={'target_date':target,'generated_at':now.isoformat(),'tabs':tabs}; root.mkdir(parents=True,exist_ok=True); (root/'wnba_tab_freshness.json').write_text(json.dumps(payload,indent=2),encoding='utf-8'); print(json.dumps(payload,indent=2))
          PY

      - name: Verify derived outputs and source immutability
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          target=os.environ['TARGET']; master=Path('data/dashboard/wnba_master.json')
          if not master.exists(): raise SystemExit('Canonical current-slate source is missing')
          data=json.loads(master.read_text(encoding='utf-8')); actual=str(data.get('target_date') or '')[:10]
          if actual!=target: raise SystemExit(f'Canonical source target mismatch: expected {target}, found {actual or "missing"}')
          payload=json.loads(Path('data/dashboard/wnba_tab_freshness.json').read_text(encoding='utf-8'))
          if str(payload.get('target_date') or '')[:10]!=target: raise SystemExit('Freshness manifest target mismatch')
          critical=['games','daily_edges','ensemble','simulation','best_bets','results','performance','remaining_season']; missing=[name for name in critical if payload['tabs'].get(name,{}).get('status')=='missing']
          print({'target':target,'master_target_date':actual,'today_games':data.get('summary',{}).get('today_games'),'critical_missing':missing})
          if missing: print('WARNING: critical tabs missing data:',', '.join(missing))
          PY

          PROTECTED=(
            data/dashboard/wnba_master.json
            data/dashboard/wnba_player_props.json
            data/dashboard/wnba_daily_canonical_manifest.json
            data/dashboard/wnba_team_ratings.json
            data/dashboard/wnba_sprint2_predictions.json
            data/dashboard/wnba_injury_intelligence.json
            data/warehouse/wnba_injury_intelligence.json
            data/dashboard/wnba_sprint2_phase2.json
            data/dashboard/wnba_s19_m02_predictions.json
            data/dashboard/wnba_s19_m02_prediction_audit.json
            data/history/wnba_game_predictions.jsonl
            data/history/wnba_v5_forward_predictions.jsonl
            data/history/wnba_model_history.jsonl
            data/dashboard/wnba_alt_market_warehouse.json
            data/warehouse/wnba_alt_market_warehouse.json
          )
          if ! git diff --quiet -- "${PROTECTED[@]}"; then
            echo 'Derived rollover mutated a source-owned artifact; refusing publish.' >&2
            git diff -- "${PROTECTED[@]}"
            exit 1
          fi

          ALLOWLIST=config/v5_rollover_derived_outputs.txt
          mapfile -t DERIVED_OUTPUTS < <(grep -Ev '^[[:space:]]*(#|$)' "$ALLOWLIST")
          if [ ${#DERIVED_OUTPUTS[@]} -eq 0 ]; then
            echo 'Derived rollover allowlist is empty; refusing publish.' >&2
            exit 1
          fi
          declare -A ALLOWED=()
          for file in "${DERIVED_OUTPUTS[@]}"; do ALLOWED["$file"]=1; done
          mapfile -t CHANGED < <(
            {
              git diff --name-only -- data/dashboard data/warehouse data/market data/forecast
              git ls-files --others --exclude-standard -- data/dashboard data/warehouse data/market data/forecast
            } | sort -u
          )
          if [ ${#CHANGED[@]} -eq 0 ]; then
            echo 'Derived rollover generated no publishable changes; refusing false-success completion.' >&2
            exit 1
          fi
          UNEXPECTED=()
          for file in "${CHANGED[@]}"; do
            if [ -z "${ALLOWED[$file]+x}" ]; then UNEXPECTED+=("$file"); fi
          done
          if [ ${#UNEXPECTED[@]} -gt 0 ]; then
            echo 'Derived rollover changed files outside its explicit publish allowlist:' >&2
            printf '  %s\n' "${UNEXPECTED[@]}" >&2
            exit 1
          fi
          echo "Derived allowlist validated: ${#CHANGED[@]} changed file(s)."
          printf '  %s\n' "${CHANGED[@]}"

      - name: Publish derived dashboard intelligence
        run: |
          git config user.name 'WNBA Derived Rollover Bot'
          git config user.email 'actions@github.com'
          mapfile -t DERIVED_OUTPUTS < <(grep -Ev '^[[:space:]]*(#|$)' config/v5_rollover_derived_outputs.txt)
          bash scripts/atomic_generated_push.sh \
            "Refresh derived WNBA dashboard intelligence for ${TARGET}" \
            "${DERIVED_OUTPUTS[@]}"

      - name: Verify published target and dispatch deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          PUBLISHED_SHA=$(git rev-parse origin/main)
          echo "PUBLISHED_SHA=$PUBLISHED_SHA" >> "$GITHUB_ENV"
          echo "Published main commit: $PUBLISHED_SHA"
          PUBLISHED_TARGET=$(git show "origin/main:data/dashboard/wnba_master.json" | python -c "import json,sys; print(str(json.load(sys.stdin).get('target_date') or '')[:10])")
          if [ "$PUBLISHED_TARGET" != "$TARGET" ]; then
            echo "Published canonical source is stale: expected ${TARGET}, found ${PUBLISHED_TARGET:-missing}" >&2
            exit 1
          fi
          CHANGED=$(git diff-tree --no-commit-id --name-only -r "$PUBLISHED_SHA")
          echo "$CHANGED"
          if ! grep -q '^data/dashboard/' <<< "$CHANGED"; then echo 'Published commit did not contain dashboard data; refusing deployment dispatch.' >&2; exit 1; fi
          gh workflow run deploy_wnba_dashboard.yml --ref main
          echo 'Derived dashboard data is committed to main and deployment was explicitly dispatched.'
