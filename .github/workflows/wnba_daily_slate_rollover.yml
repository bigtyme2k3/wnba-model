name: WNBA Daily Slate Rollover

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/dashboard_refresh_request.txt'
  schedule:
    - cron: '45 10 * * *'
    - cron: '45 11 * * *'

permissions:
  contents: write

concurrency:
  group: wnba-main-writer
  cancel-in-progress: false

jobs:
  rollover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest repository
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve Eastern slate date
        run: |
          TARGET=$(date +%F)
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "Morning rollover target: $TARGET"

      - name: Refresh schedule, results and sportsbook inputs
        run: |
          run_if_present() { [ -f "$1" ] && python "$@" || echo "Skipping unavailable $1"; }
          run_if_present wnba_live_results.py --date "$TARGET"
          run_if_present wnba_schedule_refresh.py --date "$TARGET"
          run_if_present wnba_current_slate.py --date "$TARGET"
          run_if_present wnba_odds_ingestion.py --date "$TARGET"
          run_if_present wnba_player_props_ingestion.py --date "$TARGET"
          run_if_present wnba_injury_refresh.py --date "$TARGET"
          run_if_present wnba_remaining_season_intelligence.py

      - name: Rebuild current slate intelligence
        run: |
          run_if_present() { [ -f "$1" ] && python "$@" || echo "Skipping unavailable $1"; }
          run_if_present wnba_market_timeline.py
          run_if_present wnba_line_movement_engine.py
          run_if_present wnba_steam_sharp_engine.py
          run_if_present wnba_clv_intelligence.py
          run_if_present wnba_entry_window_intelligence.py
          run_if_present wnba_sportsbook_leader_normalization.py
          run_if_present wnba_opportunity_scanner.py
          run_if_present wnba_active_slate_scanner.py
          run_if_present wnba_minutes_projection.py --date "$TARGET"
          run_if_present wnba_unified_simulation.py --date "$TARGET"
          run_if_present wnba_best_bets.py --date "$TARGET"

      - name: Rebuild all dashboard tab data
        run: |
          run_if_present() { [ -f "$1" ] && python "$@" || echo "Skipping unavailable $1"; }

          # Core betting tabs
          run_if_present wnba_daily_edge_engine.py --date "$TARGET"
          run_if_present wnba_ensemble_intelligence_engine.py --date "$TARGET"
          run_if_present wnba_monte_carlo_scenario_engine.py --date "$TARGET"
          run_if_present wnba_portfolio_engine.py --date "$TARGET"
          run_if_present wnba_player_prop_intelligence.py --date "$TARGET"
          run_if_present wnba_game_prop_intelligence.py --date "$TARGET"

          # Model governance and learning tabs
          run_if_present wnba_adaptive_confidence_engine.py
          run_if_present wnba_forward_validation_engine.py
          run_if_present wnba_readiness_engine.py
          run_if_present wnba_production_readiness.py
          run_if_present wnba_model_audit.py
          run_if_present wnba_data_lineage.py

          # ALT and remaining-season tabs
          run_if_present wnba_alt_market_watch.py --date "$TARGET"
          run_if_present wnba_alt_streak_engine.py --date "$TARGET"
          run_if_present wnba_remaining_season_intelligence.py

      - name: Grade completed games and rebuild performance data
        run: |
          YESTERDAY=$(date -d yesterday +%F)
          if [ -f wnba_game_performance_tracker.py ]; then
            python wnba_game_performance_tracker.py --date "$YESTERDAY" --grade || true
            python wnba_game_performance_tracker.py --analyze
          fi
          if [ -f wnba_alt_performance_tracker.py ]; then
            python wnba_alt_performance_tracker.py --date "$YESTERDAY" --grade || true
            python wnba_alt_performance_tracker.py --date "$TARGET" --analyze
          fi
          [ -f wnba_alt_pending_diagnostics.py ] && python wnba_alt_pending_diagnostics.py || true

      - name: Build dashboard tab freshness manifest
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          target = os.environ['TARGET']
          mapping = {
              'games': ['wnba_master.json','wnba_current_slate.json','wnba_daily_report.json','wnba_games.json'],
              'game_props': ['wnba_game_props.json','wnba_game_prop_intelligence.json'],
              'player_props': ['wnba_player_props.json','wnba_player_prop_intelligence.json'],
              'alt_streaks': ['wnba_alt_streaks.json','wnba_alt_market_watch.json'],
              'alt_performance': ['wnba_alt_performance.json','wnba_alt_pending_diagnostics.json'],
              'daily_edges': ['wnba_daily_edges.json','wnba_daily_edge_engine.json'],
              'ensemble': ['wnba_ensemble_intelligence.json','wnba_ensemble.json'],
              'simulation': ['wnba_unified_simulation.json','wnba_monte_carlo_scenarios.json'],
              'best_bets': ['wnba_best_bets.json'],
              'portfolio': ['wnba_portfolio.json','wnba_portfolio_intelligence.json'],
              'results': ['wnba_results.json','wnba_live_results.json'],
              'performance': ['wnba_game_performance.json','wnba_model_performance.json'],
              'explainability': ['wnba_explainability.json','wnba_model_audit.json'],
              'remaining_season': ['wnba_remaining_season_intelligence.json'],
              'market_intelligence': ['wnba_market_timeline_summary.json','wnba_line_movement_summary.json'],
              'injuries': ['wnba_injury_intelligence.json'],
          }
          root = Path('data/dashboard')
          now = datetime.now(timezone.utc)
          tabs = {}
          for tab, candidates in mapping.items():
              found = next((root / name for name in candidates if (root / name).exists()), None)
              if not found:
                  tabs[tab] = {'status':'missing','target_date':target,'file':None,'generated_at':None,'age_minutes':None}
                  continue
              modified = datetime.fromtimestamp(found.stat().st_mtime, timezone.utc)
              age = round((now-modified).total_seconds()/60, 1)
              tabs[tab] = {
                  'status':'fresh' if age <= 180 else 'stale',
                  'target_date':target,
                  'file':str(found),
                  'generated_at':modified.isoformat(),
                  'age_minutes':age,
              }
          payload = {'target_date':target,'generated_at':now.isoformat(),'tabs':tabs}
          root.mkdir(parents=True, exist_ok=True)
          (root/'wnba_tab_freshness.json').write_text(json.dumps(payload, indent=2), encoding='utf-8')
          print(json.dumps(payload, indent=2))
          PY

      - name: Verify current slate and required tab data
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          target=os.environ['TARGET']
          candidates=[
              Path('data/dashboard/wnba_master.json'),
              Path('data/dashboard/wnba_current_slate.json'),
              Path('data/dashboard/wnba_daily_report.json'),
              Path('data/dashboard/wnba_games.json'),
          ]
          existing=[p for p in candidates if p.exists()]
          if not existing:
              raise SystemExit('No current-slate dashboard data file was generated')
          manifest=Path('data/dashboard/wnba_tab_freshness.json')
          if not manifest.exists():
              raise SystemExit('Dashboard tab freshness manifest was not generated')
          payload=json.loads(manifest.read_text())
          critical=['games','daily_edges','ensemble','simulation','best_bets','results','performance','remaining_season']
          missing=[name for name in critical if payload['tabs'].get(name,{}).get('status')=='missing']
          print({'target':target,'generated_files':[str(p) for p in existing],'critical_missing':missing})
          if missing:
              print('WARNING: critical tabs missing data:', ', '.join(missing))
          PY

      - name: Publish refreshed tab data only
        run: |
          git config user.name 'WNBA Morning Rollover Bot'
          git config user.email 'actions@github.com'
          bash scripts/atomic_generated_push.sh \
            "Refresh all WNBA dashboard tabs for ${TARGET}" \
            'data/dashboard' \
            'data/warehouse' \
            'data/market' \
            'data/forecast'
