name: WNBA V5 S2 M07 Research Laboratory
on:
  workflow_dispatch:
  schedule:
    - cron: '35 7 * * 1'
  push:
    branches: [main]
    paths:
      - 'wnba_v5_ops_sprint2.py'
      - 'data/dashboard/wnba_v5_m05_report.json'
      - 'data/dashboard/wnba_v5_m08_report.json'
      - '.github/workflows/wnba-v5-s2-m07-research-lab.yml'
concurrency: {group: wnba-v5-s2, cancel-in-progress: false}
jobs:
  v5-s2-m07:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: git pull --rebase origin main
      - run: python -m py_compile wnba_v5_ops_sprint2.py
      - run: python wnba_v5_ops_sprint2.py --module M07
      - name: Verify S2 M07
        run: |
          python - <<'PY'
          import json
          p=json.load(open('data/dashboard/wnba_v5_s2_m07_research_lab.json'))
          print(p); assert p['module']=='S2-M07'; assert p['production_isolation'] is True
          PY
      - name: Publish
        run: |
          set -euo pipefail
          git config user.name "WNBA V5 S2 Bot"; git config user.email "actions@users.noreply.github.com"
          git add data/dashboard/wnba_v5_s2_m07_research_lab.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh V5 S2 M07 research lab"; git pull --rebase origin main; git push origin HEAD:main
