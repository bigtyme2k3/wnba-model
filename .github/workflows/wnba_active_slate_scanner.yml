name: WNBA Active Slate Scanner (Sprint 17 Commit 4.1)

on:
  workflow_dispatch:
  schedule:
    - cron: '25 */3 * * *'

concurrency:
  group: wnba-active-slate-scanner
  cancel-in-progress: false

jobs:
  build-active-slate-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate source code
        run: |
          python -m py_compile \
            wnba_market_timeline.py \
            wnba_line_movement_engine.py \
            wnba_steam_sharp_engine.py \
            wnba_clv_intelligence.py \
            wnba_entry_window_intelligence.py \
            wnba_automated_trend_discovery.py \
            wnba_trend_outcome_validation.py \
            wnba_closing_line_predictor.py \
            wnba_sportsbook_leader_normalization.py \
            wnba_opportunity_scanner.py \
            wnba_active_slate_scanner.py \
            qa_active_slate_scanner.py

      - name: Refresh prerequisite intelligence
        run: |
          python wnba_market_timeline.py
          python wnba_line_movement_engine.py
          python wnba_steam_sharp_engine.py
          python wnba_clv_intelligence.py
          python wnba_entry_window_intelligence.py
          python wnba_automated_trend_discovery.py
          python wnba_trend_outcome_validation.py
          python wnba_closing_line_predictor.py
          python wnba_sportsbook_leader_normalization.py
          python wnba_opportunity_scanner.py

      - name: Build active slate scanner
        run: python wnba_active_slate_scanner.py

      - name: Verify active slate scanner integrity
        run: python qa_active_slate_scanner.py

      - name: Show active slate summary
        run: cat data/dashboard/wnba_live_scanner_summary.json

      - name: Commit active slate artifacts
        run: |
          git config user.name 'WNBA Active Slate Bot'
          git config user.email 'actions@github.com'
          git add data/market data/forecast data/trends data/dashboard
          if git diff --cached --quiet; then
            echo 'No active slate changes to commit.'
            exit 0
          fi
          git commit -m 'Refresh WNBA active slate opportunity intelligence'
          git pull --rebase origin main
          git push origin HEAD:main
