name: WNBA V5 TeamRankings Chronological Challenger
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/dashboard/wnba_v5_teamrankings_history_join.json'
      - 'wnba_v5_teamrankings_challenger.py'
      - '.github/workflows/wnba-v5-teamrankings-challenger.yml'
permissions:
  contents: write
concurrency:
  group: wnba-v5-teamrankings-challenger
  cancel-in-progress: false
jobs:
  challenger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Sync latest repository
        run: git pull --rebase origin main
      - name: Compile challenger
        run: python -m py_compile wnba_v5_teamrankings_challenger.py
      - name: Run chronological challenger
        run: python wnba_v5_teamrankings_challenger.py
      - name: Verify research-only challenger
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/dashboard/wnba_v5_teamrankings_challenger.json').read_text())
          assert p['status']=='READY_RESEARCH_CHALLENGER'
          assert p['research_only'] is True and p['production_ready'] is False and p['lookahead_safe'] is True
          assert p['evaluated_rows']>0 and p['evaluated_dates']>0
          print({'evaluated_rows':p['evaluated_rows'],'evaluated_dates':p['evaluated_dates'],'overall':p['overall']})
          PY
      - name: Publish challenger evidence
        run: |
          set -euo pipefail
          git config user.name 'WNBA V5 TeamRankings Challenger Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/dashboard/wnba_v5_teamrankings_challenger.json data/warehouse/teamrankings/challenger
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Freeze V5 TeamRankings chronological challenger'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
