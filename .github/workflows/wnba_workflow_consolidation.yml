name: WNBA Workflow Consolidation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/consolidate_workflows.py'
      - '.github/workflows/wnba_workflow_consolidation.yml'
      - '.github/workflows/wnba_consolidated_hourly_intelligence.yml'
      - '.github/workflows/wnba_daily_slate_rollover.yml'
      - '.github/workflows/wnba_alt_game_log_recovery.yml'
      - '.github/workflows/wnba_v5_injury_dashboard.yml'

permissions:
  contents: write

concurrency:
  group: wnba-main-writer
  cancel-in-progress: false

jobs:
  inventory-consolidate-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest repository
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install audit dependency
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Phase 1 inventory and Phases 2-4 apply
        run: python scripts/consolidate_workflows.py --apply

      - name: Phase 5 verify final workflow state
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          active=sorted(Path('.github/workflows').glob('*.y*ml'))
          archive=sorted(Path('.github/workflows-archive').glob('*.y*ml'))
          docs=[]; fast=[]
          exempt={'deploy_wnba_dashboard.yml','wnba_workflow_consolidation.yml'}
          for p in active:
              t=p.read_text(encoding='utf-8')
              if p.name not in exempt:
                  direct_doc_write = bool(re.search(r"(?m)^\s*(?:python\s+(?:patch_dashboard|patch_terminal_ui|wnba_terminal_ui)|.*docs/index\.html.*(?:git add|atomic_generated_push|>|cp |mv ))", t))
                  if direct_doc_write:
                      docs.append(p.name)
              for cron in re.findall(r"cron:\s*['\"]([^'\"]+)",t):
                  m=cron.split()[0]
                  if m.startswith('*/') and int(m[2:]) < 60:
                      fast.append((p.name,cron))
          assert not docs, f'Non-owner dashboard writers remain: {docs}'
          assert not fast, f'Sub-hour schedules remain: {fast}'
          assert any(p.name=='deploy_wnba_dashboard.yml' for p in active)
          assert any(p.name=='wnba_consolidated_hourly_intelligence.yml' for p in active)
          print({'active_workflows':len(active),'archived_workflows':len(archive),'docs_owner':'deploy_wnba_dashboard.yml','sub_hour_schedules':0})
          PY

      - name: Publish consolidation result
        run: |
          git config user.name 'WNBA Workflow Consolidation Bot'
          git config user.email 'actions@github.com'
          git add .github/workflows .github/workflows-archive docs/WORKFLOW_CONSOLIDATION_AUDIT.md
          if git diff --cached --quiet; then
            echo 'No consolidation changes to publish.'
            exit 0
          fi
          git commit -m 'Consolidate and archive WNBA GitHub Actions workflows'
          bash scripts/atomic_generated_push.sh \
            'Consolidate and archive WNBA GitHub Actions workflows' \
            '.github/workflows' \
            '.github/workflows-archive' \
            'docs/WORKFLOW_CONSOLIDATION_AUDIT.md'
