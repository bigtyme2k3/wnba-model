name: WNBA New Day Prediction Sync

# Maintenance mode: scheduled retries remain paused during the FIBA break.
# This workflow consumes canonical base + injury context and owns only the
# downstream injury-aware Phase 2 and Sprint 19 M02 prediction artifacts.
on:
  workflow_call:
    inputs:
      date:
        description: Optional Eastern target date (YYYY-MM-DD)
        required: false
        type: string
        default: ''
      deploy_dashboard:
        description: Dispatch the dashboard after this stage
        required: false
        type: boolean
        default: true
    secrets:
      ODDS_API_KEY:
        required: false
  workflow_dispatch:
    inputs:
      date:
        description: Optional Eastern target date (YYYY-MM-DD)
        required: false
        default: ''
      deploy_dashboard:
        description: Dispatch dashboard after prediction publish
        required: false
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'data/new_day_prediction_sync_request.txt'
      - 'scripts/wnba_sprint2_phase2.py'
      - 'scripts/wnba_s19_m02_prop_source.py'
      - 'scripts/wnba_s19_m02_predictions.py'
      - 'wnba_game_predictions_ledger.py'

permissions:
  contents: write
  actions: write

concurrency:
  group: wnba-main-writer
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: America/New_York
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install downstream prediction dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Compile downstream prediction stack
        run: |
          python -m py_compile \
            active_slate_date.py \
            scripts/wnba_sprint2_phase2.py \
            scripts/wnba_s19_m02_prop_source.py \
            scripts/wnba_s19_m02_predictions.py \
            wnba_game_predictions_ledger.py

      - name: Resolve Eastern target date
        run: |
          REQUESTED='${{ inputs.date }}'
          if [ -n "$REQUESTED" ]; then
            TARGET="$REQUESTED"
          else
            TARGET=$(python active_slate_date.py)
          fi
          test -n "$TARGET"
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "Prediction sync target: $TARGET"

      - name: Verify canonical source dependencies
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          target=os.environ['TARGET']
          sources={
              'master':'data/dashboard/wnba_master.json',
              'props':'data/dashboard/wnba_player_props.json',
              'manifest':'data/dashboard/wnba_daily_canonical_manifest.json',
              'ratings':'data/dashboard/wnba_team_ratings.json',
              'base_predictions':'data/dashboard/wnba_sprint2_predictions.json',
              'injury':'data/dashboard/wnba_injury_intelligence.json',
          }
          payloads={}
          for name,path in sources.items():
              p=Path(path)
              if not p.exists():
                  raise SystemExit(f'Missing required source artifact: {path}')
              payload=json.loads(p.read_text(encoding='utf-8'))
              actual=str(payload.get('target_date') or '')[:10]
              if actual != target:
                  raise SystemExit(f'{name} source stale: {actual} != {target}')
              payloads[name]=payload

          manifest=payloads['manifest']
          props=payloads['props']
          predictions=payloads['base_predictions']
          injury=payloads['injury']
          assert manifest.get('status') == 'PASS', manifest.get('failures')
          assert predictions.get('status') == 'PASS', predictions
          assert injury.get('source_only') is True, 'Injury context must come from the source-only owner'
          assert injury.get('canonical_master_mutated') is False

          games=set(manifest.get('games') or [])
          predicted_games={g.get('game') for g in predictions.get('games') or []}
          assert predicted_games == games, {'canonical':sorted(games),'predicted':sorted(predicted_games)}
          assert int(props.get('row_count') or len(props.get('rows') or [])) > 0, 'Canonical standard props are empty'
          print({
              'status':'SOURCE_DEPENDENCIES_READY',
              'target':target,
              'games':len(games),
              'standard_props':int(props.get('row_count') or len(props.get('rows') or [])),
              'injury_source_verified':injury.get('injury_source_verified'),
              'injury_coverage':injury.get('source_coverage'),
          })
          PY

      - name: Build injury-aware Phase 2 projections
        run: python scripts/wnba_sprint2_phase2.py --date "$TARGET"

      - name: Verify Phase 2 and freeze versioned game predictions
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          target=os.environ['TARGET']
          injury=json.loads(Path('data/dashboard/wnba_injury_intelligence.json').read_text())
          phase2=json.loads(Path('data/dashboard/wnba_sprint2_phase2.json').read_text())
          assert phase2.get('target_date') == target and phase2.get('status') == 'PASS', phase2
          assert phase2.get('schema_version') == 'sprint19-m01-injury-aware-games-v1'
          rows=phase2.get('games') or []
          assert rows, 'No current-slate Phase 2 game cards generated'
          assert all((row.get('injury_context') or {}).get('fresh') is True for row in rows)
          assert all((row.get('injury_context') or {}).get('target_date') == target for row in rows)

          injury_stamp=injury.get('generated_at_utc') or injury.get('generated_at')
          phase2_stamp=phase2.get('generated_at_utc')
          assert injury_stamp and phase2_stamp
          assert datetime.fromisoformat(str(phase2_stamp).replace('Z','+00:00')) >= datetime.fromisoformat(str(injury_stamp).replace('Z','+00:00'))

          summary=phase2.get('summary') or {}
          audit={
              'generated_at_utc':datetime.now(timezone.utc).isoformat(),
              'target_date':target,
              'status':'READY',
              'module':'SPRINT19-M01',
              'games':len(rows),
              'injury_context_games':summary.get('injury_context_games',0),
              'injury_adjusted_games':summary.get('injury_adjusted_games',0),
              'listed_injuries_on_slate':summary.get('listed_injuries_on_slate',0),
              'injury_generated_at_utc':injury_stamp,
              'game_projection_generated_at_utc':phase2_stamp,
              'projection_after_injury_refresh':True,
              'source':'canonical_base_plus_source_only_injury_context',
          }
          Path('data/dashboard/wnba_s19_m01_game_injury_audit.json').write_text(json.dumps(audit,indent=2)+'\n')
          print({'status':'PHASE2_READY','target':target,'games':len(rows),'injury_adjusted_games':summary.get('injury_adjusted_games',0)})
          PY
          python wnba_game_predictions_ledger.py archive --date "$TARGET"

      - name: Prepare exact current sportsbook prop source
        run: python scripts/wnba_s19_m02_prop_source.py --date "$TARGET"

      - name: Build current Sprint 19 M02 predictions
        run: python scripts/wnba_s19_m02_predictions.py --date "$TARGET"

      - name: Verify downstream prediction chain and source immutability
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          target=os.environ['TARGET']
          injury=json.loads(Path('data/dashboard/wnba_injury_intelligence.json').read_text())
          phase2=json.loads(Path('data/dashboard/wnba_sprint2_phase2.json').read_text())
          source=json.loads(Path('data/dashboard/wnba_s19_m02_prop_source_audit.json').read_text())
          m02=json.loads(Path('data/dashboard/wnba_s19_m02_predictions.json').read_text())
          audit=json.loads(Path('data/dashboard/wnba_s19_m02_prediction_audit.json').read_text())

          assert phase2.get('status') == 'PASS' and str(phase2.get('target_date') or '')[:10] == target
          assert source.get('status') == 'READY' and str(source.get('target_date') or '')[:10] == target, source
          assert source.get('all_rows_exact_current_slate') is True and int(source.get('rows') or 0) > 0, source
          assert m02.get('status') == 'READY' and str(m02.get('target_date') or '')[:10] == target, m02
          assert audit.get('status') == 'READY' and str(audit.get('target_date') or '')[:10] == target, audit
          assert audit.get('game_projection_after_injury_refresh') is True, audit
          assert int(audit.get('actionable_out_props') or 0) == 0, audit
          assert audit.get('phase2_best_bets_fallback_enabled') is False, audit
          assert int(audit.get('player_prop_predictions') or 0) > 0, audit
          assert audit.get('player_props_with_model_projection') == audit.get('player_prop_predictions'), audit
          assert int(audit.get('off_slate_prop_rows_rejected') or 0) == 0, audit
          assert audit.get('all_rendered_props_exact_current_slate') is True, audit

          if injury.get('injury_source_verified') is not True:
              bets=[row for row in m02.get('player_props',[]) if str(row.get('final_action') or '').upper()=='BET']
              if bets or (m02.get('best_bets') or []) or (m02.get('portfolio') or []):
                  raise SystemExit('Unverified injury coverage must never publish BET/portfolio rows')

          print({
              'status':'NEW_DAY_DOWNSTREAM_READY',
              'target':target,
              'phase2_games':len(phase2.get('games') or []),
              'player_prop_predictions':audit.get('player_prop_predictions'),
              'best_bets':len(m02.get('best_bets') or []),
              'injury_source_verified':injury.get('injury_source_verified'),
          })
          PY

          if ! git diff --quiet -- \
            data/dashboard/wnba_master.json \
            data/dashboard/wnba_player_props.json \
            data/dashboard/wnba_daily_canonical_manifest.json \
            data/dashboard/wnba_team_ratings.json \
            data/dashboard/wnba_sprint2_predictions.json \
            data/dashboard/wnba_injury_intelligence.json \
            data/warehouse/wnba_injury_intelligence.json; then
            echo 'Downstream prediction sync mutated a source-owned artifact; refusing publish.' >&2
            git diff -- \
              data/dashboard/wnba_master.json \
              data/dashboard/wnba_player_props.json \
              data/dashboard/wnba_daily_canonical_manifest.json \
              data/dashboard/wnba_team_ratings.json \
              data/dashboard/wnba_sprint2_predictions.json \
              data/dashboard/wnba_injury_intelligence.json \
              data/warehouse/wnba_injury_intelligence.json
            exit 1
          fi

      - name: Publish downstream prediction artifacts only
        run: |
          git config user.name 'WNBA New Day Prediction Sync Bot'
          git config user.email 'actions@github.com'
          bash scripts/atomic_generated_push.sh \
            "Refresh WNBA downstream prediction stack for ${TARGET}" \
            'data/dashboard/wnba_sprint2_phase2.json' \
            'data/history/wnba_game_predictions.jsonl' \
            'data/dashboard/wnba_game_predictions_ledger.json' \
            'data/warehouse/wnba_game_predictions_ledger.json' \
            'data/dashboard/wnba_s19_m01_game_injury_audit.json' \
            'data/dashboard/wnba_s19_m02_prop_source_audit.json' \
            'data/dashboard/wnba_s19_m02_predictions.json' \
            'data/dashboard/wnba_s19_m02_prediction_audit.json' \
            'data/raw/props_today.csv' \
            "data/raw/props_raw_${TARGET}.csv" \
            'data/raw/player_points_today.csv' \
            "data/raw/player_points_${TARGET}.csv"

      - name: Verify published downstream stack
        run: |
          git fetch origin main
          git show origin/main:data/dashboard/wnba_s19_m02_predictions.json > /tmp/m02.json
          git show origin/main:data/dashboard/wnba_sprint2_phase2.json > /tmp/phase2.json
          python - <<'PY'
          import json, os
          target=os.environ['TARGET']
          m02=json.load(open('/tmp/m02.json'))
          phase2=json.load(open('/tmp/phase2.json'))
          assert m02.get('status')=='READY' and str(m02.get('target_date') or '')[:10]==target, m02
          assert phase2.get('status')=='PASS' and str(phase2.get('target_date') or '')[:10]==target, phase2
          print({'published_m02_target':m02.get('target_date'),'phase2_target':phase2.get('target_date'),'phase2_games':len(phase2.get('games') or [])})
          PY

      - name: Deploy dashboard after standalone prediction sync
        if: ${{ inputs.deploy_dashboard }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy_wnba_dashboard.yml --ref main
          echo 'Verified downstream game/prop stack and dispatched dashboard deployment.'
