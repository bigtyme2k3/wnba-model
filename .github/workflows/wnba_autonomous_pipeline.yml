name: WNBA Autonomous Pipeline (Sprint 11)

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: Optional slate date YYYY-MM-DD
        required: false
        type: string
      readiness_only:
        description: Run readiness and QA without live models
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '20 15 * * *'

concurrency:
  group: wnba-autonomous-pipeline
  cancel-in-progress: false

jobs:
  autonomous-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest repository
        run: git pull --ff-only origin main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime dependencies
        run: pip install pandas numpy
      - name: Compile Sprint 11 and model stages
        run: |
          python -m py_compile \
            wnba_readiness_engine.py \
            wnba_data_lineage.py \
            wnba_final_qa.py \
            wnba_autonomous_pipeline.py \
            patch_dashboard_v4_pipeline_status.py \
            wnba_daily_edge_engine.py \
            wnba_adaptive_confidence_engine.py \
            wnba_ensemble_intelligence_engine.py \
            wnba_monte_carlo_scenario_engine.py
      - name: Resolve target date
        id: target
        shell: bash
        run: |
          INPUT_DATE="${{ inputs.target_date }}"
          if [ -n "$INPUT_DATE" ]; then
            TARGET="$INPUT_DATE"
          else
            TARGET=$(python active_slate_date.py --date "")
          fi
          echo "date=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Target date: $TARGET"
      - name: Run autonomous pipeline
        shell: bash
        run: |
          ARGS=(--date "${{ steps.target.outputs.date }}")
          if [ "${{ inputs.readiness_only }}" = "true" ]; then
            ARGS+=(--readiness-only)
          fi
          python wnba_autonomous_pipeline.py "${ARGS[@]}"
      - name: Reapply persistent dashboard features
        run: |
          python patch_dashboard_v4_alt_streaks_display.py || true
          python patch_dashboard_v4_daily_edges.py || true
          python patch_dashboard_v4_ensemble_intelligence.py || true
          python patch_dashboard_v4_monte_carlo_scenarios.py || true
          python patch_dashboard_v4_pipeline_status.py
          python patch_dashboard_v4_consolidated_navigation.py || true
          python patch_dashboard_v4_pipeline_status.py
      - name: Verify Sprint 11 outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          required=[
            'data/dashboard/wnba_pipeline_readiness.json',
            'data/dashboard/wnba_autonomous_pipeline.json',
            'data/dashboard/wnba_data_lineage.json',
            'data/dashboard/wnba_final_qa.json',
            'docs/index.html',
          ]
          for name in required:
            assert Path(name).exists(), f'missing {name}'
          readiness=json.load(open(required[0]))
          pipeline=json.load(open(required[1]))
          qa=json.load(open(required[3]))
          html=Path('docs/index.html').read_text(encoding='utf-8')
          assert readiness.get('status') in {'READY','WAIT','BLOCKED'}
          assert pipeline.get('status') in {'READY','WAIT','FAIL'}
          assert qa.get('status') in {'PASS','ATTENTION','FAIL'}
          for marker in ('v4-pipeline-status-data','v4-pipeline-status-script','v4-pipeline-status-style'):
            assert marker in html, f'missing dashboard marker {marker}'
          print(json.dumps({'readiness':readiness.get('status'),'pipeline':pipeline.get('status'),'qa':qa.get('status'),'green_light':qa.get('green_light')},indent=2))
          PY
      - name: Commit Sprint 11 outputs
        run: |
          git config user.name "WNBA Autonomous Pipeline Bot"
          git config user.email "actions@github.com"
          bash scripts/atomic_generated_push.sh \
            "Run Sprint 11 autonomous pipeline" \
            'data/dashboard/wnba_pipeline_readiness.json' \
            'data/warehouse/wnba_pipeline_readiness.json' \
            'data/dashboard/wnba_autonomous_pipeline.json' \
            'data/warehouse/wnba_autonomous_pipeline.json' \
            'data/dashboard/wnba_data_lineage.json' \
            'data/warehouse/wnba_data_lineage.json' \
            'data/dashboard/wnba_final_qa.json' \
            'data/warehouse/wnba_final_qa.json' \
            'data/dashboard/wnba_daily_edges.json' \
            'data/dashboard/wnba_adaptive_confidence.json' \
            'data/dashboard/wnba_ensemble_intelligence.json' \
            'data/dashboard/wnba_monte_carlo_scenarios.json' \
            'docs/index.html'
      - name: Upload Sprint 11 control reports
        uses: actions/upload-artifact@v4
        with:
          name: wnba-sprint-11-autonomous-pipeline
          path: |
            data/dashboard/wnba_pipeline_readiness.json
            data/dashboard/wnba_autonomous_pipeline.json
            data/dashboard/wnba_data_lineage.json
            data/dashboard/wnba_final_qa.json
