name: WNBA Intelligence Foundation

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Target date (YYYY-MM-DD), leave blank for active Eastern slate'
        required: false
        default: ''
      refresh_odds_api:
        description: 'Fetch current game odds and player props from The Odds API?'
        required: false
        default: 'true'
  schedule:
    - cron: '15 13 * * *'

concurrency:
  group: wnba-intelligence-foundation
  cancel-in-progress: false

jobs:
  build-intelligence-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest repo
        run: git pull --rebase origin main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install required dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install optional providers
        id: optional_providers
        shell: bash
        run: |
          set -u
          mkdir -p data/health
          status=available
          detail='sports-skills installed'
          if ! pip install sports-skills==0.27.0; then
            if ! pip install git+https://github.com/machina-sports/sports-skills.git; then
              status=unavailable
              detail='sports-skills installation failed; committed and cached sources remain available'
            fi
          fi
          python - <<PY
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          Path('data/health').mkdir(parents=True, exist_ok=True)
          Path('data/health/wnba_foundation_optional_providers.json').write_text(json.dumps({
              'checked_at_utc': datetime.now(timezone.utc).isoformat(),
              'sports_skills': {'status': '${status}', 'detail': '${detail}'},
          }, indent=2) + '\n')
          PY

      - name: Resolve active Eastern slate date
        run: |
          set -euo pipefail
          TARGET=$(python active_slate_date.py --date "${{ github.event.inputs.date }}")
          YEAR=$(python active_slate_date.py --year)
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "YEAR=$YEAR" >> "$GITHUB_ENV"
          echo "Using active WNBA slate date: $TARGET"

      - name: Validate intelligence scripts
        run: |
          python -m py_compile \
            active_slate_date.py scrape_odds.py scrape_odds_props.py line_shopping.py \
            wnba_stats_fallback_from_boxscores.py sports_skills_core_provider.py \
            wnba_data_warehouse.py wnba_player_intelligence.py wnba_stats_quality.py \
            odds_source_manager.py wnba_live_odds_layer.py wnba_odds_health.py \
            wnba_sportsbook_consensus.py player_points.py wnba_matchup_intelligence.py \
            wnba_consensus_engine.py wnba_monte_carlo_engine.py wnba_projection_ai.py \
            wnba_market_engine.py wnba_portfolio_optimizer_v2.py \
            wnba_decision_engine_final.py wnba_risk_allocation.py \
            wnba_reasoning_layer.py wnba_portfolio_dashboard.py wnba_ai_coach.py \
            wnba_source_health.py wnba_historical_database.py wnba_master_database.py \
            wnba_master_source_builder.py wnba_results_grader.py \
            wnba_closing_line_tracker.py wnba_betting_ledger.py wnba_self_learning.py \
            wnba_terminal_ui.py build_dashboard.py patch_terminal_ui.py \
            patch_dashboard_navigation_v2.py patch_prop_box_colors.py \
            build_dashboard_v4.py wnba_v4_props_guard.py wnba_v4_prop_context.py \
            patch_dashboard_v4_team_context.py patch_dashboard_v4_layout_and_slate.py \
            patch_dashboard_v4_prop_header.py patch_dashboard_v4_game_filter.py \
            patch_dashboard_v4_player_props_polish.py wnba_v4_player_props_audit.py

      - name: Refresh optional market sources
        if: ${{ github.event_name == 'schedule' || github.event.inputs.refresh_odds_api != 'false' }}
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -u
          mkdir -p data/health
          game_odds=ok
          player_props=ok
          line_shopping=ok
          python scrape_odds.py --date "${TARGET}" --out data/raw || game_odds=degraded
          python scrape_odds_props.py --date "${TARGET}" --out data/raw || player_props=degraded
          python line_shopping.py --date "${TARGET}" --out data/raw || line_shopping=degraded
          python - <<PY
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          Path('data/health/wnba_foundation_market_refresh.json').write_text(json.dumps({
              'checked_at_utc': datetime.now(timezone.utc).isoformat(),
              'target_date': '${TARGET}',
              'game_odds': '${game_odds}',
              'player_props': '${player_props}',
              'line_shopping': '${line_shopping}',
          }, indent=2) + '\n')
          PY

      - name: Ensure primary player data
        run: |
          set -euo pipefail
          if [ -s data/raw/wnba_players_live.json ] && [ -s data/raw/boxscores_wehoop.csv ]; then
            echo 'Primary wehoop player stats and boxscores are available.'
          else
            python wnba_stats_fallback_from_boxscores.py --out data/raw
          fi
          test -s data/raw/wnba_players_live.json
          test -s data/raw/boxscores_wehoop.csv

      - name: Refresh optional sports-skills provider
        run: |
          set -u
          if command -v sports-skills >/dev/null 2>&1; then
            python sports_skills_core_provider.py --season "${YEAR}" --out data/wnba --warehouse data/warehouse || \
              echo 'sports-skills provider refresh degraded; continuing with primary sources.'
          else
            echo 'sports-skills unavailable; continuing with primary sources.'
          fi

      - name: Build required data foundation
        run: |
          set -euo pipefail
          python wnba_data_warehouse.py --date "${TARGET}"
          python wnba_player_intelligence.py --date "${TARGET}"
          python wnba_stats_quality.py --date "${TARGET}"
          python odds_source_manager.py --date "${TARGET}" --raw data/raw --manual data/manual/wnba_manual_odds.csv
          python wnba_live_odds_layer.py --date "${TARGET}"
          python player_points.py --date "${TARGET}" --out data/raw
          python wnba_odds_health.py --date "${TARGET}"
          python wnba_sportsbook_consensus.py --date "${TARGET}"
          python wnba_matchup_intelligence.py --date "${TARGET}"

      - name: Build required modeling stack
        run: |
          set -euo pipefail
          python wnba_consensus_engine.py --date "${TARGET}"
          python wnba_monte_carlo_engine.py --date "${TARGET}" --sims 10000
          python wnba_projection_ai.py --date "${TARGET}"
          python wnba_closing_line_tracker.py --date "${TARGET}" --stage snapshot
          python wnba_market_engine.py --date "${TARGET}"
          python wnba_portfolio_optimizer_v2.py --date "${TARGET}" --bankroll 500
          python wnba_decision_engine_final.py --date "${TARGET}"
          python wnba_risk_allocation.py --date "${TARGET}" --capital 500
          python wnba_reasoning_layer.py --date "${TARGET}"
          python wnba_portfolio_dashboard.py --date "${TARGET}"
          python wnba_ai_coach.py --date "${TARGET}"

      - name: Build required source and props artifacts
        run: |
          set -euo pipefail
          python wnba_source_health.py --date "${TARGET}"
          python wnba_master_source_builder.py --date "${TARGET}"
          python wnba_v4_props_guard.py
          python wnba_v4_prop_context.py
          python wnba_v4_player_props_audit.py

      - name: Build required history and learning artifacts
        run: |
          set -euo pipefail
          python wnba_historical_database.py --date "${TARGET}"
          python wnba_betting_ledger.py --date "${TARGET}" --unit 20
          python wnba_results_grader.py --date "${TARGET}"
          python wnba_self_learning.py --date "${TARGET}"
          python wnba_master_database.py --date "${TARGET}"

      - name: Build and patch Dashboard V4
        run: |
          set -euo pipefail
          python build_dashboard.py
          python wnba_terminal_ui.py --date "${TARGET}"
          python patch_terminal_ui.py
          python patch_dashboard_navigation_v2.py
          python patch_prop_box_colors.py
          python build_dashboard_v4.py
          python patch_dashboard_v4_team_context.py
          python patch_dashboard_v4_layout_and_slate.py
          python patch_dashboard_v4_prop_header.py
          python patch_dashboard_v4_game_filter.py
          python patch_dashboard_v4_player_props_polish.py

      - name: Verify production outputs
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          required = [
              Path('data/dashboard/wnba_master.json'),
              Path('data/warehouse/wnba_master_source.json'),
              Path('docs/index.html'),
          ]
          missing = [str(path) for path in required if not path.exists() or path.stat().st_size == 0]
          assert not missing, f'Missing or empty production outputs: {missing}'

          data = json.loads(Path('data/dashboard/wnba_master.json').read_text())
          allowed = {'DraftKings', 'FanDuel', 'Fanatics'}
          for prop in data.get('props', []):
              for key in ('best_over_book', 'best_under_book', 'book', 'best_book'):
                  value = prop.get(key)
                  if value:
                      assert value in allowed, (key, value)
          diagnostics = data.get('prop_history_diagnostics', {})
          assert diagnostics.get('game_rows', 0) > 0, diagnostics
          print('Production output verification passed.')
          PY

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name 'WNBA Model Bot'
          git config user.email 'actions@github.com'
          git status --short
          git add config/*.json docs/*.md data/master/*.json data/wnba/*.json data/warehouse/*.json data/dashboard/*.json data/raw/*.csv data/raw/*.json data/history/*.jsonl data/health/*.json docs/index.html
          git diff --cached --quiet && echo 'No intelligence foundation changes' && exit 0
          git commit -m "Update WNBA intelligence foundation - ${TARGET}"
          git push || (git pull --rebase origin main && git push)
