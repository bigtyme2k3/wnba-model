name: WNBA V5 S3 M06 Autonomous Evidence Cycle
# Maintenance mode: autonomous hourly execution is paused. M06 is now a
# terminal evidence aggregator: upstream modules own and publish their artifacts.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wnba_v5_s3_m06_autonomous_evidence_cycle.py'
      - 'data/dashboard/wnba_v5_s3_m01_freshness.json'
      - 'data/dashboard/wnba_v5_s3_m02_report.json'
      - 'data/dashboard/wnba_v5_m11_report.json'
      - 'data/dashboard/wnba_v5_s3_m03_forward_grade.json'
      - 'data/dashboard/wnba_v5_s3_m04_report.json'
      - 'data/dashboard/wnba_v5_s3_m05_report.json'
      - '.github/workflows/wnba-v5-s3-m06-autonomous-evidence-cycle.yml'
concurrency:
  group: wnba-v5-s3-m06
  cancel-in-progress: true
jobs:
  v5-s3-m06:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Sprint 3 M06 aggregator
        run: python -m py_compile wnba_v5_s3_m06_autonomous_evidence_cycle.py
      - name: Aggregate independently owned evidence
        run: python wnba_v5_s3_m06_autonomous_evidence_cycle.py
      - name: Verify Sprint 3 M06
        run: |
          python - <<'PY'
          import json
          p=json.load(open('data/dashboard/wnba_v5_s3_m06_autonomous_cycle.json'))
          s=json.load(open('data/dashboard/wnba_v5_sprint3_status.json'))
          print(p)
          print(s)
          assert p['module']=='S3-M06'
          assert p['consumer_only'] is True
          assert p['canonical_forward_ledger_owner']=='V5-M12'
          assert p['api_policy']['m06_api_calls']==0
          assert p['api_policy']['closing_capture_owner']=='S3-M02 dedicated pre-tip watcher'
          assert p['safety']['inferred_closes_allowed'] is False
          assert p['safety']['issued_predictions_mutable'] is False
          assert p['safety']['upstream_artifacts_republished'] is False
          assert all(p['module_outputs_present'].values())
          assert s['sprint']=='OPERATIONS_SPRINT_3'
          assert s['consumer_only'] is True
          PY
      - name: Publish Sprint 3 M06 aggregate safely
        run: |
          set -euo pipefail
          git config user.name "WNBA V5 S3 M06 Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/dashboard/wnba_v5_s3_m06_autonomous_cycle.json \
                  data/dashboard/wnba_v5_sprint3_status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh WNBA V5 Sprint 3 evidence aggregate"
          git pull --rebase origin main
          git push origin HEAD:main
