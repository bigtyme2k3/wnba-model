name: WNBA ALT Strict Completed-Game Regrade

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wnba_alt_strict_regrade.yml'
      - 'wnba_alt_strict_regrade.py'
      - 'wnba_alt_performance_tracker.py'
      - 'active_slate_date.py'
      - 'scripts/check_production_architecture.py'
      - 'data/warehouse/wnba_player_game_logs.json'

permissions:
  contents: write

concurrency:
  group: wnba-main-writer
  cancel-in-progress: false

jobs:
  strict-regrade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest repository
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify production architecture invariants
        run: python scripts/check_production_architecture.py

      - name: Compile strict grader
        run: |
          python -m py_compile \
            active_slate_date.py \
            wnba_alt_strict_regrade.py \
            wnba_alt_performance_tracker.py \
            wnba_alt_pending_diagnostics.py \
            wnba_alt_schedule_audit.py \
            wnba_alt_phase2_diagnostics.py

      - name: Strictly regrade against completed player-games
        run: |
          python wnba_alt_strict_regrade.py
          TARGET=$(python active_slate_date.py)
          test -n "$TARGET"
          python wnba_alt_performance_tracker.py --date "$TARGET" --analyze
          python wnba_alt_pending_diagnostics.py
          python wnba_alt_schedule_audit.py
          python wnba_alt_phase2_diagnostics.py

      - name: Publish blocked strict diagnostic
        if: failure()
        run: |
          git config user.name "WNBA Strict Regrade Bot"
          git config user.email "actions@github.com"
          bash scripts/atomic_generated_push.sh \
            "Publish blocked ALT strict-regrade diagnostics" \
            'data/dashboard/wnba_alt_strict_regrade.json' \
            'data/warehouse/wnba_alt_strict_regrade.json'

      - name: Verify strict game anchoring
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          ET=ZoneInfo('America/New_York')
          def game_date(value):
              try:
                  text=str(value or '').replace('Z','+00:00')
                  if not text: return ''
                  dt=datetime.fromisoformat(text)
                  if dt.tzinfo is None: dt=dt.replace(tzinfo=timezone.utc)
                  return dt.astimezone(ET).date().isoformat()
              except Exception:
                  return ''

          history=[]
          for line in open('data/history/wnba_alt_streak_history.jsonl'):
              try: history.append(json.loads(line))
              except Exception: pass

          bad=[]
          strict_rows=0
          modes=Counter()
          for r in history:
              if r.get('actual_source') != 'player_game_log_warehouse_strict_match':
                  continue
              strict_rows += 1
              mode=str(r.get('grading_match_mode') or 'legacy_strict')
              modes[mode] += 1
              actual_date=str(r.get('actual_game_date') or '')[:10]
              if not actual_date or not str(r.get('actual_record_id') or '').strip():
                  bad.append(r.get('candidate_id'))
                  continue
              if mode == 'same_date_exact' and actual_date != str(r.get('date') or '')[:10]:
                  bad.append(r.get('candidate_id'))
              elif mode == 'frozen_game_time_exact' and actual_date != game_date(r.get('game_time')):
                  bad.append(r.get('candidate_id'))
              elif mode not in {'same_date_exact','frozen_game_time_exact','unique_matchup_date_shift','unique_player_date_fallback','legacy_strict'}:
                  bad.append(r.get('candidate_id'))

          perf=json.load(open('data/dashboard/wnba_alt_performance.json'))
          phase2=json.load(open('data/dashboard/wnba_alt_phase2_diagnostics.json'))
          strict=json.load(open('data/dashboard/wnba_alt_strict_regrade.json'))
          s=perf.get('summary') or {}
          sources=Counter(str(r.get('actual_source') or 'pending') for r in history)
          stats=strict.get('stats') or {}
          print({
              'archived':s.get('archived_candidates'),
              'graded':s.get('graded'),
              'pending':s.get('pending'),
              'actual_sources':dict(sources),
              'strict_rows':strict_rows,
              'strict_match_modes':dict(modes),
              'invalid_strict_anchors':len(bad),
              'strict_match_stats':stats,
              'phase2_failure_reasons':phase2.get('failure_reason_counts') or {},
          })
          assert strict.get('safe_to_apply') is True, strict
          assert int(stats.get('proposed_final') or 0) >= int(stats.get('baseline_final') or 0), stats
          assert not bad, bad[:10]
          PY

      - name: Publish strict regrade outputs
        run: |
          git config user.name "WNBA Strict Regrade Bot"
          git config user.email "actions@github.com"
          bash scripts/atomic_generated_push.sh \
            "Strictly anchor ALT grading to completed official player-games" \
            'data/history/wnba_alt_streak_history.jsonl' \
            'data/dashboard/wnba_alt_performance.json' \
            'data/warehouse/wnba_alt_performance.json' \
            'data/dashboard/wnba_alt_pending_diagnostics.json' \
            'data/warehouse/wnba_alt_pending_diagnostics.json' \
            'data/dashboard/wnba_alt_schedule_audit.json' \
            'data/warehouse/wnba_alt_schedule_audit.json' \
            'data/dashboard/wnba_alt_phase2_diagnostics.json' \
            'data/dashboard/wnba_alt_phase2_diagnostics.csv' \
            'data/warehouse/wnba_alt_phase2_diagnostics.json' \
            'data/dashboard/wnba_alt_strict_regrade.json' \
            'data/warehouse/wnba_alt_strict_regrade.json'
