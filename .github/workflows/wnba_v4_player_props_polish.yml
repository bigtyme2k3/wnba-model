name: WNBA V4 Player Props Polish

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["WNBA Intelligence Foundation"]
    types: [completed]

concurrency:
  group: wnba-main-writer
  cancel-in-progress: false

jobs:
  polish-player-props:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest repository
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Player Props build
        run: |
          python -m py_compile \
            wnba_v4_prop_context.py \
            build_dashboard_v4.py \
            patch_dashboard_v4_team_context.py \
            patch_dashboard_v4_layout_and_slate.py \
            patch_dashboard_v4_prop_header.py \
            patch_dashboard_v4_game_filter.py \
            patch_dashboard_v4_player_props_polish.py \
            patch_dashboard_v4_filter_events.py

      - name: Enrich props with actual player game history
        run: python wnba_v4_prop_context.py

      - name: Rebuild V4 dashboard
        run: python build_dashboard_v4.py

      - name: Reapply V4 team context
        run: python patch_dashboard_v4_team_context.py

      - name: Reapply V4 responsive layout
        run: python patch_dashboard_v4_layout_and_slate.py

      - name: Reapply prop header fix
        run: python patch_dashboard_v4_prop_header.py

      - name: Reapply single-game filtering
        run: python patch_dashboard_v4_game_filter.py

      - name: Apply Player Props polish and actual history rendering
        run: python patch_dashboard_v4_player_props_polish.py

      - name: Wire Player Props filter controls
        run: python patch_dashboard_v4_filter_events.py

      - name: Verify generated dashboard
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/index.html")
          if not path.exists():
              raise SystemExit("FAIL: docs/index.html was not generated")

          html = path.read_text(encoding="utf-8")
          checks = {
              "actual player history renderer": "function actualHistory",
              "opponent history labels": "opponent_abbr",
              "prop deduplication function": "function propsRaw(){let map=new Map()",
              "filter event wiring": "function wirePropFilters",
              "sortable column controls": "setPropSort",
          }

          failed = []
          for label, marker in checks.items():
              if marker in html:
                  print(f"PASS: {label} [{marker}]")
              else:
                  print(f"FAIL: {label} missing [{marker}]")
                  failed.append(label)

          print(f"Dashboard bytes: {len(html):,}")
          if failed:
              raise SystemExit("Dashboard verification failed: " + ", ".join(failed))
          print("PASS: Player Props dashboard verification complete")
          PY

      - name: Commit actual history and polished dashboard
        run: |
          chmod +x scripts/atomic_generated_push.sh
          scripts/atomic_generated_push.sh \
            "Display actual last game stats and working filters in V4 props" \
            data/dashboard/wnba_master.json \
            data/master/wnba_master.json \
            docs/index.html
