name: WNBA V4 Player Props Polish

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "WNBA Intelligence Foundation"
      - "WNBA Injury Refresh"
      - "WNBA Player Props History Repair"
      - "WNBA Version 4 Status"
      - "WNBA Postgame Learning Pipeline"
    types: [completed]

concurrency:
  group: wnba-main-writer
  cancel-in-progress: false

jobs:
  polish-player-props:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest repository
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Player Props build
        run: |
          python -m py_compile \
            wnba_v4_prop_context.py \
            build_dashboard_v4.py \
            patch_dashboard_v4_team_context.py \
            patch_dashboard_v4_layout_and_slate.py \
            patch_dashboard_v4_prop_header.py \
            patch_dashboard_v4_game_filter.py \
            patch_dashboard_v4_player_props_polish.py \
            patch_dashboard_v4_filter_events.py \
            patch_dashboard_v4_games_markets.py \
            patch_dashboard_v4_sportsbook_board.py \
            patch_dashboard_v4_results_board.py \
            patch_dashboard_v4_best_bets_cleanup.py \
            patch_dashboard_v4_best_bets_correlation.py \
            patch_dashboard_v4_best_bets_evidence_fix.py \
            patch_dashboard_v4_live_slate.py \
            patch_dashboard_v4_consistency.py \
            patch_dashboard_v4_stabilization.py \
            patch_dashboard_v4_games_kpis.py \
            archive_best_bets.py \
            grade_best_bets.py

      - name: Collect Data
        run: python wnba_v4_prop_context.py

      - name: Generate Predictions
        run: python build_dashboard_v4.py

      - name: Reapply V4 team context
        run: python patch_dashboard_v4_team_context.py

      - name: Reapply V4 responsive layout
        run: python patch_dashboard_v4_layout_and_slate.py

      - name: Reapply prop header fix
        run: python patch_dashboard_v4_prop_header.py

      - name: Reapply single-game filtering
        run: python patch_dashboard_v4_game_filter.py

      - name: Apply Player Props polish and actual history rendering
        run: python patch_dashboard_v4_player_props_polish.py

      - name: Wire Player Props filter controls
        run: python patch_dashboard_v4_filter_events.py

      - name: Build Games and Game Props views
        run: python patch_dashboard_v4_games_markets.py

      - name: Build Sportsbook line-shopping board
        run: python patch_dashboard_v4_sportsbook_board.py

      - name: Build Results grading board
        run: python patch_dashboard_v4_results_board.py

      - name: Generate Best Bets
        run: python patch_dashboard_v4_best_bets_cleanup.py

      - name: Apply Correlation Filter
        run: python patch_dashboard_v4_best_bets_correlation.py

      - name: Apply evidence scoring and hard deduplication
        run: python patch_dashboard_v4_best_bets_evidence_fix.py

      - name: Apply Live Slate Intelligence
        run: python patch_dashboard_v4_live_slate.py

      - name: Apply Dashboard Consistency Recovery
        run: python patch_dashboard_v4_consistency.py

      - name: Apply Dashboard Stabilization Pass 2
        run: python patch_dashboard_v4_stabilization.py

      - name: Apply Games Tab KPI Fix
        run: python patch_dashboard_v4_games_kpis.py

      - name: Archive Best Bets Ledger
        run: python archive_best_bets.py

      - name: Grade Best Bets Performance
        run: python grade_best_bets.py

      - name: QA Validation
        run: |
          python archive_best_bets.py --validate-only
          python grade_best_bets.py --validate-only
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/index.html")
          if not path.exists():
              raise SystemExit("FAIL: docs/index.html was not generated")
          html = path.read_text(encoding="utf-8")
          checks = {
              "actual player history renderer": "function actualHistory",
              "opponent history labels": "opponent_abbr",
              "prop deduplication function": "function propsRaw(){let map=new Map()",
              "filter event wiring": "function wirePropFilters",
              "sortable column controls": "setPropSort",
              "named Games candidates": "namedCandidates",
              "Game Props market table": "window.marketsV25",
              "period market reservation": "Period markets:",
              "Sportsbook line-shopping board": "window.wireSportsbookBoard",
              "Sportsbook best-price columns": "Best over",
              "Results grading board": "Results & Grading",
              "Results status renderer": "uniqueMissing",
              "Best Bets deduplication": "const key=r=>",
              "Best Bets bounded scoring": "Math.round(clamp(s,0,92))",
              "Best Bets shortlist": "Best Bets Shortlist",
              "correlation-aware Best Bets": "sprint25-best-bets-correlation-script",
              "player exposure cap": "pc>=2",
              "matchup exposure cap": "gc>=3",
              "overlap-family reduction": "overlapKey",
              "evidence-gated tiers": "const tierFor=r=>",
              "raw evidence scoring": "const rawScore=r=>",
              "missing probability penalty": "else s-=7",
              "missing recent penalty": "else s-=6",
              "hard final dedup": "finalKeys.has(k)",
              "updatable evidence patch": "sprint25-best-bets-evidence-fix-script",
              "live slate intelligence": "sprint25-phase8-live-slate-script",
              "started-game removal": "isClosed=(r,map,now)",
              "remaining game counter": "Remaining games",
              "remaining prop counter": "Remaining props",
              "late slate threshold": "late-slate threshold active",
              "dashboard consistency recovery": "dashboard-consistency-recovery-script",
              "active Best Bets KPI": "active ranked plays",
              "summary mismatch notice": "Raw summary",
              "dashboard stabilization v2": "dashboard-stabilization-v2-script",
              "team opponent repair": "Opponent unavailable",
              "projection repair": "projectionFor=r=>",
              "allocated unit reconciliation": "Allocated units",
              "Games KPI patch": "dashboard-games-kpi-fix-script",
              "Games Today KPI": "Games Today",
              "Active Recommendations KPI": "Active Recommendations",
          }
          failed = []
          for label, marker in checks.items():
              if marker in html:
                  print(f"PASS: {label} [{marker}]")
              else:
                  print(f"FAIL: {label} missing [{marker}]")
                  failed.append(label)
          print(f"Dashboard bytes: {len(html):,}")
          if failed:
              raise SystemExit("Dashboard verification failed: " + ", ".join(failed))
          print("PASS: Games tab KPI stabilization complete")
          PY

      - name: Publish Dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          chmod +x scripts/atomic_generated_push.sh
          scripts/atomic_generated_push.sh \
            "Stabilize Games tab KPI metrics" \
            data/dashboard/wnba_master.json \
            data/master/wnba_master.json \
            data/history/best_bets_ledger.csv \
            data/history/best_bets_summary.json \
            data/history/best_bets_performance.csv \
            data/history/best_bets_performance_summary.json \
            docs/index.html