name: WNBA ALT Late Market Refresh

# Maintenance mode: this is now only a controlled entry point to the single
# canonical ALT market writer. It owns no market artifacts itself.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/alt_late_refresh_request.txt'

permissions:
  contents: write

jobs:
  refresh-alt:
    uses: ./.github/workflows/wnba_alt_pregame_snapshot.yml
    secrets: inherit
