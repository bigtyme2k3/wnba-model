name: WNBA Model Validation and Learning

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Target date (YYYY-MM-DD); blank uses active Eastern slate'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'wnba_alt_performance_tracker.py'
      - 'wnba_alt_pending_diagnostics.py'
      - 'wnba_game_performance.py'
      - 'wnba_terminal_ui.py'
      - 'patch_terminal_ui.py'
      - 'patch_dashboard_alt_grading_status.py'
      - '.github/workflows/wnba_model_validation_learning.yml'
  schedule:
    - cron: '15 3,4,5 * * *'

concurrency:
  group: wnba-main-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate-and-grade:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest repository
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Resolve grading dates
        run: |
          TARGET=$(python active_slate_date.py --date "${{ github.event.inputs.date }}")
          python - <<PY >> "$GITHUB_ENV"
          from datetime import date,timedelta
          target=date.fromisoformat('$TARGET')
          print(f'TARGET={target}')
          for i in range(1,4):
              print(f'GRADE_DATE_{i}={target-timedelta(days=i)}')
          PY
      - name: Validate analytics code
        run: python -m py_compile wnba_alt_performance_tracker.py wnba_alt_pending_diagnostics.py wnba_game_predictions_ledger.py wnba_game_performance.py wnba_terminal_ui.py patch_terminal_ui.py patch_dashboard_alt_grading_status.py
      - name: Refresh official finals and player logs
        run: |
          python collect_wehoop.py --current --out data/raw
          for DAY in "$GRADE_DATE_1" "$GRADE_DATE_2" "$GRADE_DATE_3"; do
            python wnba_play_by_play_layer.py --date "$DAY" || true
            python wnba_player_game_log_warehouse.py --date "$DAY" || true
          done
          python wnba_player_game_log_archive.py merge || true
          python wnba_player_game_log_backfill.py --season "${TARGET:0:4}" || true
      - name: Grade rolling completed slates
        run: |
          for DAY in "$GRADE_DATE_3" "$GRADE_DATE_2" "$GRADE_DATE_1"; do
            echo "Grading ALT and game predictions for $DAY"
            python wnba_alt_performance_tracker.py --date "$DAY" --grade
            python wnba_game_predictions_ledger.py grade --date "$DAY" || true
          done
          python wnba_alt_performance_tracker.py --date "$TARGET" --analyze
          python wnba_game_predictions_ledger.py report --date "$TARGET"
          python wnba_game_performance.py
      - name: Archive today's game card
        run: python wnba_game_predictions_ledger.py archive --date "$TARGET"
      - name: Refresh dashboard source and visible reports
        run: |
          python wnba_master_source_builder.py --date "$TARGET" || true
          python wnba_terminal_ui.py --date "$TARGET"
          python patch_terminal_ui.py
          python patch_dashboard_alt_grading_status.py
          python wnba_alt_pending_diagnostics.py
      - name: Verify grading outputs
        run: |
          python - <<'PY'
          import json
          alt=json.load(open('data/dashboard/wnba_alt_performance.json'))
          diag=json.load(open('data/dashboard/wnba_alt_pending_diagnostics.json'))
          games=json.load(open('data/dashboard/wnba_game_performance.json'))
          ledger=json.load(open('data/dashboard/wnba_game_predictions_ledger.json'))
          terminal=json.load(open('data/dashboard/terminal_ui.json'))
          summary=alt.get('summary',{})
          assert summary.get('graded',0)>0, alt
          assert summary.get('pending',0)>=0, summary
          assert diag.get('status')=='ok', diag
          assert diag.get('summary',{}).get('pending_rows',-1)>=0, diag
          assert games.get('summary',{}).get('graded_games',0)>=0, games
          assert 'spread' in games and 'total' in games, games
          assert ledger.get('status')=='ok', ledger
          assert terminal.get('alt_performance'), terminal.keys()
          assert terminal.get('game_performance'), terminal.keys()
          html=open('docs/index.html',encoding='utf-8').read()
          assert 'Game Performance' in html and 'ALT Performance' in html
          assert 'WNBA_ALT_GRADING_STATUS_START' in html
          assert 'ALT Grading Checkpoint' in html
          assert 'WNBA_ALT_PENDING_DIAGNOSTICS_START' in html
          assert 'Pending ALT Diagnostics' in html
          print('MODEL VALIDATION VERIFIED',summary,diag['summary'],games['summary'])
          PY
      - name: Publish grading and performance outputs
        run: |
          git config user.name "WNBA Validation Bot"
          git config user.email "actions@github.com"
          bash scripts/atomic_generated_push.sh \
            "Refresh rolling WNBA ALT and game performance - $TARGET" \
            'data/history/wnba_alt_streak_history.jsonl' \
            'data/history/wnba_game_predictions.jsonl' \
            'data/dashboard/wnba_alt_performance.json' \
            'data/warehouse/wnba_alt_performance.json' \
            'data/dashboard/wnba_alt_pending_diagnostics.json' \
            'data/warehouse/wnba_alt_pending_diagnostics.json' \
            'data/dashboard/wnba_game_predictions_ledger.json' \
            'data/warehouse/wnba_game_predictions_ledger.json' \
            'data/dashboard/wnba_game_performance.json' \
            'data/warehouse/wnba_game_performance.json' \
            'data/dashboard/terminal_ui.json' \
            'data/master/wnba_master.json' \
            'docs/index.html'
