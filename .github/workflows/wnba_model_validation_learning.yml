name: WNBA Model Validation and Learning

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Target date (YYYY-MM-DD); blank uses active Eastern slate'
        required: false
        default: ''
  schedule:
    - cron: '15 3,4,5 * * *'

concurrency:
  group: wnba-main-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate-and-grade:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest repository
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Resolve grading dates
        run: |
          TARGET=$(python active_slate_date.py --date "${{ github.event.inputs.date }}")
          PREVIOUS=$(python - <<PY
          from datetime import date,timedelta
          print((date.fromisoformat('$TARGET')-timedelta(days=1)).isoformat())
          PY
          )
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "PREVIOUS=$PREVIOUS" >> "$GITHUB_ENV"
      - name: Validate analytics code
        run: python -m py_compile wnba_alt_performance_tracker.py wnba_game_predictions_ledger.py wnba_game_performance.py
      - name: Refresh official finals and player logs
        run: |
          python collect_wehoop.py --current --out data/raw
          python wnba_play_by_play_layer.py --date "$PREVIOUS" || true
          python wnba_player_game_log_warehouse.py --date "$PREVIOUS" || true
          python wnba_player_game_log_backfill.py --season "${TARGET:0:4}" || true
      - name: Grade ALT archive and game predictions
        run: |
          python wnba_alt_performance_tracker.py --date "$TARGET" --grade
          python wnba_alt_performance_tracker.py --date "$TARGET" --analyze
          python wnba_game_predictions_ledger.py grade --date "$PREVIOUS"
          python wnba_game_predictions_ledger.py report --date "$TARGET"
          python wnba_game_performance.py
      - name: Archive today's game card
        run: python wnba_game_predictions_ledger.py archive --date "$TARGET"
      - name: Refresh dashboard source
        run: |
          python wnba_master_source_builder.py --date "$TARGET" || true
          python wnba_terminal_ui.py --date "$TARGET" || true
          python patch_terminal_ui.py || true
      - name: Verify grading outputs
        run: |
          python - <<'PY'
          import json
          alt=json.load(open('data/dashboard/wnba_alt_performance.json'))
          games=json.load(open('data/dashboard/wnba_game_performance.json'))
          ledger=json.load(open('data/dashboard/wnba_game_predictions_ledger.json'))
          assert alt.get('summary',{}).get('graded',0)>0, alt
          assert games.get('summary',{}).get('graded_games',0)>=0, games
          assert 'spread' in games and 'total' in games, games
          assert ledger.get('status')=='ok', ledger
          print('MODEL VALIDATION VERIFIED',alt['summary'],games['summary'])
          PY
      - name: Publish grading and performance outputs
        run: |
          git config user.name "WNBA Validation Bot"
          git config user.email "actions@github.com"
          bash scripts/atomic_generated_push.sh \
            "Refresh WNBA ALT and game performance - $TARGET" \
            'data/history/wnba_alt_streak_history.jsonl' \
            'data/history/wnba_game_predictions.jsonl' \
            'data/dashboard/wnba_alt_performance.json' \
            'data/warehouse/wnba_alt_performance.json' \
            'data/dashboard/wnba_game_predictions_ledger.json' \
            'data/warehouse/wnba_game_predictions_ledger.json' \
            'data/dashboard/wnba_game_performance.json' \
            'data/warehouse/wnba_game_performance.json' \
            'data/master/wnba_master.json' \
            'docs/index.html'
