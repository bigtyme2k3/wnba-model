name: WNBA V5 Player Prop Action Audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wnba_v5_player_prop_action_audit.py'
      - 'data/history/wnba_model_history.jsonl'
      - '.github/workflows/wnba-v5-player-prop-action-audit.yml'
concurrency:
  group: wnba-v5-player-prop-action-audit
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync latest repository
        run: git pull --rebase origin main
      - name: Compile audit
        run: python -m py_compile wnba_v5_player_prop_action_audit.py
      - name: Run audit
        run: python wnba_v5_player_prop_action_audit.py
      - name: Verify contract
        run: |
          python - <<'PY'
          import json
          p=json.load(open('data/dashboard/wnba_v5_player_prop_action_audit.json'))
          print(p)
          assert p['module']=='PLAYER_PROP_ACTION_AUDIT'
          assert p['research_only'] is True
          assert p['production_mutation'] is False
          assert isinstance(p['by_action'],list)
          PY
      - name: Publish safely
        run: |
          set -euo pipefail
          git config user.name "WNBA V5 Action Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/dashboard/wnba_v5_player_prop_action_audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh WNBA V5 player prop action audit"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
