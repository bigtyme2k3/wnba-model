name: "WNBA Sprint 22 Phase 2.2 Historical Player Backfill"

on:
  workflow_dispatch:
    inputs:
      start_season:
        description: "First historical season"
        required: true
        default: "2015"
      end_season:
        description: "Last Sportsdataverse season"
        required: true
        default: "2025"
      collect_current:
        description: "Also collect the current season from ESPN"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: sprint-22-phase-2-2-historical-player-backfill
  cancel-in-progress: false

jobs:
  historical-player-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pandas requests pyreadr
      - name: Compile backfill code
        run: python -m py_compile collect_wehoop.py normalize_sprint22_phase2_1_player_data.py build_sprint22_phase2_player_warehouse.py build_sprint22_phase2_2_historical_player_backfill.py qa_sprint22_phase2_2_historical_player_backfill.py
      - name: Collect historical player boxes
        run: python collect_wehoop.py --start "${{ inputs.start_season }}" --end "${{ inputs.end_season }}"
      - name: Collect current player boxes
        if: ${{ inputs.collect_current }}
        run: python collect_wehoop.py --current
      - name: Normalize player inputs
        run: python normalize_sprint22_phase2_1_player_data.py
      - name: Rebuild player intelligence warehouse
        run: python build_sprint22_phase2_player_warehouse.py
      - name: Audit historical backfill
        run: |
          minimum=$(( ${{ inputs.end_season }} - ${{ inputs.start_season }} + 1 ))
          python build_sprint22_phase2_2_historical_player_backfill.py --minimum-seasons "$minimum"
      - name: Run Phase 2.2 QA
        run: python qa_sprint22_phase2_2_historical_player_backfill.py
      - name: Verify populated backfill
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('data/warehouse/sprint22/player')
          report = json.loads((root/'historical_backfill_catalog.json').read_text())
          catalog = json.loads((root/'player_catalog.json').read_text())
          assert report['status'] == 'PASS', report
          assert report['duplicate_player_game_keys'] == 0
          assert report['total_game_logs'] > 0
          assert catalog['tables']['player_profile']['rows'] > 0
          assert catalog['tables']['player_game_logs']['rows'] > 0
          assert catalog['tables']['player_rolling_metrics']['rows'] > 0
          print('Historical player backfill verified:', {
              'seasons': report['season_count'],
              'logs': report['total_game_logs'],
              'players': report['unique_players'],
              'warehouse': report['warehouse_tables'],
          })
          PY
      - name: Commit backfill artifacts
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/raw/wehoop_player_box_*.csv data/raw/player_game_logs_*.csv data/raw/player_profiles_*.csv data/raw/player_ingestion_catalog.json data/warehouse/sprint22/player/
          git diff --cached --quiet && exit 0
          git commit -m "Update Sprint 22 historical player backfill"
          git pull --rebase origin main
          git push origin HEAD:main
