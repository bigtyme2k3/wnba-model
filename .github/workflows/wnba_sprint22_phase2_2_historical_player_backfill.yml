name: "WNBA Sprint 22 Phase 2.2 Verified Player Backfill"

on:
  workflow_dispatch:
    inputs:
      start_season:
        description: "First verified SportsDataverse season"
        required: true
        default: "2024"
      end_season:
        description: "Last verified SportsDataverse season"
        required: true
        default: "2025"
      collect_current:
        description: "Also collect the current season from ESPN"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: sprint-22-phase-2-2-verified-player-backfill
  cancel-in-progress: false

jobs:
  verified-player-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pandas requests pyreadr
      - name: Enforce verified production range
        run: |
          test "${{ inputs.start_season }}" -ge 2024 || { echo "Production backfill supports verified seasons 2024+ only. Use the Legacy Player Recovery workflow for 2015-2023."; exit 1; }
      - name: Compile backfill code
        run: python -m py_compile collect_wehoop.py collect_wehoop_compatible.py collect_sprint22_historical_player_only.py validate_sprint22_legacy_player_collection.py normalize_sprint22_phase2_1_player_data.py build_sprint22_phase2_player_warehouse.py build_sprint22_phase2_player_warehouse_numeric.py build_sprint22_phase2_2_historical_player_backfill.py build_sprint22_player_coverage_manifest.py qa_sprint22_phase2_2_historical_player_backfill.py
      - name: Remove stale requested-season artifacts
        run: |
          for season in $(seq "${{ inputs.start_season }}" "${{ inputs.end_season }}"); do
            rm -f "data/raw/wehoop_player_box_${season}.csv"
            rm -f "data/raw/player_game_logs_${season}.csv"
            rm -f "data/raw/player_profiles_${season}.csv"
          done
      - name: Collect verified historical player boxes
        run: python collect_sprint22_historical_player_only.py --start "${{ inputs.start_season }}" --end "${{ inputs.end_season }}"
      - name: Validate requested verified seasons
        run: python validate_sprint22_legacy_player_collection.py --start "${{ inputs.start_season }}" --end "${{ inputs.end_season }}"
      - name: Collect current player boxes
        if: ${{ inputs.collect_current }}
        run: python collect_wehoop_compatible.py --current
      - name: Normalize player inputs
        run: python normalize_sprint22_phase2_1_player_data.py
      - name: Rebuild player intelligence warehouse
        run: python build_sprint22_phase2_player_warehouse_numeric.py
      - name: Audit verified backfill
        run: |
          minimum=$(( ${{ inputs.end_season }} - ${{ inputs.start_season }} + 1 ))
          python build_sprint22_phase2_2_historical_player_backfill.py --minimum-seasons "$minimum"
      - name: Build player coverage manifest
        run: python build_sprint22_player_coverage_manifest.py
      - name: Run Phase 2.2 QA
        run: python qa_sprint22_phase2_2_historical_player_backfill.py
      - name: Verify production warehouse
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('data/warehouse/sprint22/player')
          report = json.loads((root/'historical_backfill_catalog.json').read_text())
          catalog = json.loads((root/'player_catalog.json').read_text())
          coverage = json.loads((root/'player_coverage_manifest.json').read_text())
          assert report['status'] == 'PASS', report
          assert report['duplicate_player_game_keys'] == 0
          assert coverage['production_status'] == 'PASS', coverage
          assert all(season >= 2024 for season in coverage['verified_seasons'])
          assert catalog['tables']['player_profile']['rows'] > 0
          assert catalog['tables']['player_game_logs']['rows'] > 0
          assert catalog['tables']['player_rolling_metrics']['rows'] > 0
          print('Verified player warehouse:', coverage)
          PY
      - name: Commit verified backfill artifacts
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/raw/wehoop_player_box_*.csv data/raw/player_game_logs_*.csv data/raw/player_profiles_*.csv data/raw/player_ingestion_catalog.json data/warehouse/sprint22/player/
          git diff --cached --quiet && exit 0
          git commit -m "Update Sprint 22 verified player backfill"
          git pull --rebase origin main
          git push origin HEAD:main
