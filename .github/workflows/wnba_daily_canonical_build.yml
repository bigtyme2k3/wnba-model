name: WNBA Daily Canonical Build

# Maintenance mode: scheduled execution remains paused during the FIBA break.
# This workflow owns the canonical slate, standard props, team ratings, and
# base Sprint 2 predictions only. Production execution is explicit: reusable
# workflow_call from the V5 orchestrator or operator workflow_dispatch only.
on:
  workflow_call:
    inputs:
      target_date:
        description: Optional Eastern slate date (YYYY-MM-DD)
        required: false
        type: string
    secrets:
      ODDS_API_KEY:
        required: false
  workflow_dispatch:
    inputs:
      target_date:
        description: Optional Eastern slate date (YYYY-MM-DD)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: wnba-main-writer
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: America/New_York
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: python -m pip install requests

      - name: Resolve Eastern target date
        run: |
          MANUAL='${{ inputs.target_date }}'
          if [ -n "$MANUAL" ]; then
            TARGET="$MANUAL"
          else
            TARGET=$(python active_slate_date.py)
          fi
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "Canonical target date: $TARGET"

      - name: Build canonical slate and player props
        run: python scripts/build_daily_canonical_slate.py --date "$TARGET"

      - name: Build Sprint 2 team ratings and base game projections
        run: python wnba_sprint2_prediction_engine.py --date "$TARGET"

      - name: Validate canonical base outputs
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          target=os.environ['TARGET']
          manifest=json.loads(Path('data/dashboard/wnba_daily_canonical_manifest.json').read_text())
          assert manifest['target_date']==target
          assert manifest['status']=='PASS', manifest.get('failures')

          props=json.loads(Path('data/dashboard/wnba_player_props.json').read_text())
          assert props.get('target_date')==target
          games=set(manifest.get('games') or [])
          for row in props.get('rows') or []:
            assert row.get('target_date')==target
            assert row.get('team')
            assert row.get('team') in {row.get('away_team'), row.get('home_team')}
            assert not games or row.get('game') in games
          unresolved=props.get('unresolved_rows') or []
          assert all(not row.get('team') for row in unresolved)

          ratings=json.loads(Path('data/dashboard/wnba_team_ratings.json').read_text())
          predictions=json.loads(Path('data/dashboard/wnba_sprint2_predictions.json').read_text())
          assert ratings.get('target_date')==target
          assert predictions.get('target_date')==target and predictions.get('status')=='PASS'
          predicted_games={g.get('game') for g in predictions.get('games') or []}
          assert predicted_games==games, {'canonical':sorted(games),'predicted':sorted(predicted_games)}
          print({
              'target':target,
              'games':manifest['game_count'],
              'props':manifest['player_prop_rows'],
              'unresolved_props':len(unresolved),
              'rated_teams':len(ratings.get('teams') or []),
              'ownership':'CANONICAL_BASE_ONLY',
          })
          PY

          if ! git diff --quiet -- \
            data/dashboard/wnba_injury_intelligence.json \
            data/warehouse/wnba_injury_intelligence.json \
            data/dashboard/wnba_sprint2_phase2.json \
            data/dashboard/wnba_s19_m02_predictions.json \
            data/dashboard/wnba_s19_m02_prediction_audit.json \
            data/history/wnba_game_predictions.jsonl; then
            echo 'Canonical base build mutated a downstream-owned artifact; refusing publish.' >&2
            git diff -- \
              data/dashboard/wnba_injury_intelligence.json \
              data/warehouse/wnba_injury_intelligence.json \
              data/dashboard/wnba_sprint2_phase2.json \
              data/dashboard/wnba_s19_m02_predictions.json \
              data/dashboard/wnba_s19_m02_prediction_audit.json \
              data/history/wnba_game_predictions.jsonl
            exit 1
          fi

      - name: Publish canonical base sources
        run: |
          git config user.name 'WNBA Canonical Daily Build Bot'
          git config user.email 'actions@github.com'
          git add data/wnba/scores.json \
                  data/dashboard/wnba_master.json \
                  data/dashboard/wnba_player_props.json \
                  data/dashboard/wnba_daily_canonical_manifest.json \
                  data/dashboard/wnba_team_ratings.json \
                  data/dashboard/wnba_sprint2_predictions.json \
                  data/raw/wnba_player_props_${TARGET}.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No canonical base source changes to publish'
            exit 0
          fi
          git commit -m "Refresh canonical WNBA base sources for ${TARGET}"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep $((attempt*3))
          done
          exit 1
