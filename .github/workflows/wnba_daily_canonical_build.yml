name: WNBA Daily Canonical Build

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: Optional Eastern slate date (YYYY-MM-DD)
        required: false
        type: string
  schedule:
    - cron: '15 10 * * *'
    - cron: '15 16 * * *'
  push:
    paths:
      - 'data/daily_canonical_build_request.txt'
      - 'scripts/build_daily_canonical_slate.py'
      - '.github/workflows/wnba_daily_canonical_build.yml'

permissions:
  contents: write

concurrency:
  group: wnba-main-writer
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: America/New_York
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requests
        run: python -m pip install requests
      - name: Resolve Eastern target date
        run: |
          MANUAL='${{ inputs.target_date }}'
          if [ -n "$MANUAL" ]; then
            TARGET="$MANUAL"
          else
            TARGET=$(python active_slate_date.py)
          fi
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "Canonical target date: $TARGET"
      - name: Build canonical slate and player props
        run: python scripts/build_daily_canonical_slate.py --date "$TARGET"
      - name: Validate manifest and stale-row guardrails
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          target=os.environ['TARGET']
          p=Path('data/dashboard/wnba_daily_canonical_manifest.json')
          d=json.loads(p.read_text())
          assert d['target_date']==target
          assert d['status']=='PASS', d.get('failures')
          props=json.loads(Path('data/dashboard/wnba_player_props.json').read_text())
          assert props.get('target_date')==target
          games=set(d.get('games') or [])
          for row in props.get('rows') or []:
            assert row.get('target_date')==target
            assert row.get('team')
            assert not games or row.get('game') in games
          print({'target':target,'games':d['game_count'],'props':d['player_prop_rows']})
          PY
      - name: Publish canonical daily sources
        run: |
          git config user.name 'WNBA Canonical Daily Build Bot'
          git config user.email 'actions@github.com'
          git add data/wnba/scores.json \
                  data/dashboard/wnba_master.json \
                  data/dashboard/wnba_player_props.json \
                  data/dashboard/wnba_daily_canonical_manifest.json \
                  data/raw/wnba_player_props_${TARGET}.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No canonical daily source changes to publish'
            exit 0
          fi
          git commit -m "Refresh canonical WNBA sources for ${TARGET}"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep $((attempt*3))
          done
          exit 1
