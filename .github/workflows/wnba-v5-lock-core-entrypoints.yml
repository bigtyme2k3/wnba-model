name: WNBA V5 Lock Core Entrypoints

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/lock_v5_core_entrypoints.py'
      - '.github/workflows/wnba-v5-lock-core-entrypoints.yml'

permissions:
  contents: write

concurrency:
  group: wnba-v5-lock-core-entrypoints
  cancel-in-progress: true

jobs:
  lock-core-entrypoints:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Compile surgical locker
        run: python -m py_compile scripts/lock_v5_core_entrypoints.py

      - name: Remove legacy push entry points
        run: python scripts/lock_v5_core_entrypoints.py

      - name: Verify only trigger surfaces changed
        run: |
          set -euo pipefail
          ALLOWED='^(\.github/workflows/wnba_daily_canonical_build\.yml|\.github/workflows/wnba_v5_injury_dashboard\.yml|\.github/workflows/wnba-new-day-prediction-sync\.yml|\.github/workflows/wnba_daily_slate_rollover\.yml)$'
          BAD=$(git diff --name-only | grep -Ev "$ALLOWED" || true)
          if [ -n "$BAD" ]; then
            echo 'Unexpected files changed:' >&2
            echo "$BAD" >&2
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          files = [
              '.github/workflows/wnba_daily_canonical_build.yml',
              '.github/workflows/wnba_v5_injury_dashboard.yml',
              '.github/workflows/wnba-new-day-prediction-sync.yml',
              '.github/workflows/wnba_daily_slate_rollover.yml',
          ]
          for item in files:
              text = Path(item).read_text(encoding='utf-8')
              header = text.split('\npermissions:', 1)[0]
              assert '\n  workflow_call:' in header, item
              assert '\n  workflow_dispatch:' in header, item
              assert '\n  push:' not in header, item
              assert '\n  schedule:' not in header, item
          print({'status':'PASS','core_workflows':len(files),'push_entrypoints':0,'scheduled_entrypoints':0})
          PY

      - name: Publish trigger-only lock
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Core entrypoints already locked.'
            exit 0
          fi
          git config user.name 'WNBA V5 Architecture Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            .github/workflows/wnba_daily_canonical_build.yml \
            .github/workflows/wnba_v5_injury_dashboard.yml \
            .github/workflows/wnba-new-day-prediction-sync.yml \
            .github/workflows/wnba_daily_slate_rollover.yml
          git commit -m 'Lock V5 core production entrypoints'
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; }
            sleep $((attempt*3))
          done
          exit 1
