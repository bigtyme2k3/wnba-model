name: "WNBA Legacy Player Schema Inspector"

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Legacy SportsDataverse season to inspect"
        required: true
        default: "2023"

permissions:
  contents: read

jobs:
  inspect-legacy-player-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true
      - name: Install dependencies
        run: |
          pip install requests
          Rscript -e 'install.packages("jsonlite", repos="https://cloud.r-project.org")'
      - name: Compile inspector
        run: python -m py_compile inspect_legacy_wehoop_schema.py
      - name: Inspect legacy player RDS
        run: python inspect_legacy_wehoop_schema.py --season "${{ inputs.season }}"
      - name: Show full schema report
        run: cat "data/diagnostics/legacy_player_schema_${{ inputs.season }}.json"
      - name: Upload schema report
        uses: actions/upload-artifact@v4
        with:
          name: "legacy-player-schema-${{ inputs.season }}"
          path: "data/diagnostics/legacy_player_schema_${{ inputs.season }}.json"
          if-no-files-found: error
