name: WNBA V5 Adaptive Challenger V2
# Maintenance mode: no new forward evidence arrives during the WNBA/FIBA
# break, so hourly research recomputation is paused. Manual dispatch and
# forward-ledger/code change triggers remain available for controlled QA.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wnba_v5_adaptive_challenger_v2.py'
      - 'data/history/wnba_v5_forward_predictions.jsonl'
      - '.github/workflows/wnba-v5-adaptive-challenger-v2.yml'
concurrency:
  group: v5-adaptive-challenger-v2
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync latest repository
        run: git pull --rebase origin main
      - name: Compile evaluator
        run: python -m py_compile wnba_v5_adaptive_challenger_v2.py
      - name: Run prospective contextual ablation
        run: python wnba_v5_adaptive_challenger_v2.py
      - name: Verify research-only contract
        run: |
          python - <<'PY'
          import json
          p=json.load(open('data/dashboard/wnba_v5_adaptive_challenger_v2.json'))
          print(p)
          assert p['module']=='ADAPTIVE_CHALLENGER_V2'
          assert p['research_only'] is True
          assert p['production_ready'] is False
          assert p['status'] in {'WAITING_FOR_RESOLVED_CONTEXT_ROWS','READY_CONTEXTUAL_SHADOW'}
          assert p['minimum_context_train_rows']==60
          assert p['resolved_context_rows'] <= p['rows_with_any_frozen_context']
          assert p['pending_context_rows'] == p['rows_with_any_frozen_context'] - p['resolved_context_rows']
          PY
      - name: Publish challenger report safely
        run: |
          set -euo pipefail
          git config user.name "WNBA V5 Adaptive Challenger Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/dashboard/wnba_v5_adaptive_challenger_v2.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh V5 adaptive challenger v2 report"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            echo "retry $attempt"; sleep $((attempt*3))
          done
          exit 1
