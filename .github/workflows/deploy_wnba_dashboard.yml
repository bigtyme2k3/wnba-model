name: Deploy WNBA Dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'data/dashboard/**'
      - 'wnba_terminal_ui.py'
      - 'patch_terminal_ui.py'
      - 'patch_dashboard_build_verification.py'
      - 'patch_dashboard_alt_grading_status.py'
      - 'wnba_alt_pending_diagnostics.py'
      - 'patch_dashboard_v5_injury_intelligence.py'
      - 'patch_dashboard_v5_player_prop_injury_context.py'
      - 'patch_dashboard_v4_consolidated_navigation.py'
      - '.github/workflows/deploy_wnba_dashboard.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve dashboard date
        run: |
          TARGET=$(python active_slate_date.py 2>/dev/null || date -u +%F)
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "Dashboard target date: $TARGET"

      - name: Compile complete dashboard build chain
        run: |
          test -f docs/index.html
          python -m py_compile \
            wnba_terminal_ui.py \
            patch_terminal_ui.py \
            patch_dashboard_build_verification.py \
            patch_dashboard_alt_grading_status.py \
            wnba_alt_pending_diagnostics.py \
            patch_dashboard_v5_injury_intelligence.py \
            patch_dashboard_v5_player_prop_injury_context.py

      - name: Build complete dashboard artifact
        run: |
          python wnba_terminal_ui.py --date "$TARGET"
          python patch_terminal_ui.py

          if [ -f data/dashboard/wnba_injury_intelligence.json ]; then
            python patch_dashboard_v5_injury_intelligence.py
            python patch_dashboard_v5_player_prop_injury_context.py
          else
            echo "Injury payload unavailable; preserving the committed dashboard artifact."
          fi

          python patch_terminal_ui.py
          python patch_dashboard_alt_grading_status.py
          python wnba_alt_pending_diagnostics.py
          python patch_dashboard_build_verification.py

      - name: Verify complete dashboard artifact
        run: |
          python - <<'PY'
          from pathlib import Path
          h = Path('docs/index.html').read_text(encoding='utf-8')
          required = [
              'WNBA_TERMINAL_UI_PATCH_START',
              'WNBA Intelligence Terminal',
              'ALT Performance',
              'Game Performance',
              'WNBA_ALT_GRADING_STATUS_START',
              'ALT Grading Checkpoint',
              'Screenshot-verifiable grading freshness',
              'WNBA_ALT_PENDING_DIAGNOSTICS_START',
              'Pending ALT Diagnostics',
              'Pending rows',
              'WNBA_BUILD_BEACON_START',
              'Games QA Beacon',
              'screenshot-verifiable deployment marker',
          ]
          injury_payload = Path('data/dashboard/wnba_injury_intelligence.json')
          if injury_payload.exists():
              required.extend([
                  'v5-injury-intelligence-data',
                  'v5-injury-intelligence-script',
                  "['injuries','Injuries']",
                  "view==='injuries'",
                  'window.injuryIntelligence',
                  'v5-player-prop-injury-style',
                  'v5-player-prop-injury-script',
                  'window.WNBA_PLAYER_PROP_INJURY_CONTEXT',
                  'Injury-adjusted',
              ])
          missing = [marker for marker in required if marker not in h]
          if missing:
              raise SystemExit(f'Deployment blocked; missing dashboard markers: {missing}')
          print('Complete dashboard, ALT diagnostics and QA beacons verified.')
          PY
          find docs -maxdepth 2 -type f | sort | head -100

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
