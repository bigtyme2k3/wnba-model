name: Deploy WNBA Dashboard
# Direct edits to this workflow also provide a safe manual rollover trigger.
# Aug 13 canonical refresh trigger

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'data/dashboard/**'
      - 'wnba_terminal_ui.py'
      - 'patch_terminal_ui.py'
      - 'scrape_odds_props.py'
      - 'scrape_scores.py'
      - 'player_points.py'
      - 'wnba_game_predictions_ledger.py'
      - 'wnba_game_performance.py'
      - 'wnba_player_props_ingestion.py'
      - 'wnba_alt_market_warehouse.py'
      - 'wnba_alt_streaks.py'
      - 'active_slate_date.py'
      - 'patch_dashboard_break_state.py'
      - 'patch_dashboard_canonical_runtime.py'
      - 'patch_dashboard_games_focus.py'
      - 'patch_dashboard_v4_ui_freeze.py'
      - 'patch_dashboard_v4_ui_freeze_safe.py'
      - 'patch_dashboard_s19_m02.py'
      - 'patch_dashboard_s19_m03.py'
      - 'patch_dashboard_s19_m06.py'
      - 'scripts/build_daily_canonical_slate.py'
      - 'scripts/wnba_dashboard_slate_context.py'
      - 'scripts/scrape_odds_props_consensus.py'
      - 'scripts/wnba_game_archive_backfill.py'
      - 'scripts/atomic_generated_push.sh'
      - 'scripts/check_production_architecture.py'
      - 'scripts/wnba_s19_m02_prop_source.py'
      - 'scripts/wnba_s19_m02_predictions.py'
      - 'scripts/wnba_s19_m03_dashboard_consumer.py'
      - 'scripts/wnba_s19_m06_results_lifecycle.py'
      - 'patch_dashboard_alt_props_table.py'
      - 'patch_dashboard_alt_props_scores.py'
      - 'patch_dashboard_alt_props_performance_panel.py'
      - 'wnba_alt_streak_confidence.py'
      - 'wnba_alt_performance_tracker.py'
      - 'patch_dashboard_sprint2_phase2.py'
      - 'patch_dashboard_build_verification.py'
      - 'patch_dashboard_alt_grading_status.py'
      - 'wnba_alt_pending_diagnostics.py'
      - 'patch_dashboard_alt_recovery_progress.py'
      - 'patch_dashboard_game_performance.py'
      - 'patch_dashboard_v5_injury_intelligence.py'
      - 'patch_dashboard_v5_player_prop_injury_context.py'
      - 'patch_dashboard_v4_remaining_season.py'
      - 'patch_dashboard_v4_alt_streaks_display.py'
      - 'patch_dashboard_v4_alt_ladders.py'
      - 'wnba_results_grader.py'
      - 'wnba_edge_database.py'
      - '.github/workflows/deploy_wnba_dashboard.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify production architecture invariants
        run: python scripts/check_production_architecture.py

      - name: Resolve dashboard slate context
        run: |
          CURRENT_DATE=$(python active_slate_date.py --field current_date)
          SLATE_MODE=$(python active_slate_date.py --field mode)
          NEXT_SLATE_DATE=$(python active_slate_date.py --field next_slate_date)
          DAYS_UNTIL_SLATE=$(python active_slate_date.py --field days_until_slate)
          SCHEDULE_SOURCE=$(python active_slate_date.py --field schedule_source)
          DASHBOARD_CONTEXT=$(python scripts/wnba_dashboard_slate_context.py --context)
          TARGET=$(python scripts/wnba_dashboard_slate_context.py --field target_date)
          DASHBOARD_MODE=$(python scripts/wnba_dashboard_slate_context.py --field deployment_mode)
          PREPARED_UPCOMING=$(python scripts/wnba_dashboard_slate_context.py --field prepared_upcoming)
          MAINTENANCE_BREAK=$(python scripts/wnba_dashboard_slate_context.py --field maintenance_break)
          ALT_CURRENT_SOURCE=$(python scripts/wnba_dashboard_slate_context.py --field alt_current_source)
          test -n "$TARGET"
          test -n "$CURRENT_DATE"
          test -n "$SLATE_MODE"
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "CURRENT_DATE=$CURRENT_DATE" >> "$GITHUB_ENV"
          echo "SLATE_MODE=$SLATE_MODE" >> "$GITHUB_ENV"
          echo "DASHBOARD_MODE=$DASHBOARD_MODE" >> "$GITHUB_ENV"
          echo "NEXT_SLATE_DATE=$NEXT_SLATE_DATE" >> "$GITHUB_ENV"
          echo "DAYS_UNTIL_SLATE=$DAYS_UNTIL_SLATE" >> "$GITHUB_ENV"
          echo "SCHEDULE_SOURCE=$SCHEDULE_SOURCE" >> "$GITHUB_ENV"
          echo "MAINTENANCE_BREAK=$MAINTENANCE_BREAK" >> "$GITHUB_ENV"
          echo "PREPARED_UPCOMING=$PREPARED_UPCOMING" >> "$GITHUB_ENV"
          echo "ALT_CURRENT_SOURCE=$ALT_CURRENT_SOURCE" >> "$GITHUB_ENV"
          echo "Dashboard observation date: $TARGET"
          echo "Slate mode: $SLATE_MODE; dashboard mode: $DASHBOARD_MODE; next slate: ${NEXT_SLATE_DATE:-not scheduled}"
          echo "Dashboard slate context: $DASHBOARD_CONTEXT"

      - name: Install ALT pipeline dependencies
        if: env.MAINTENANCE_BREAK != 'true'
        run: python -m pip install --disable-pip-version-check pandas requests

      - name: Compile dashboard build chain
        run: |
          test -f docs/index.html
          python -m py_compile \
            wnba_terminal_ui.py patch_terminal_ui.py scrape_odds_props.py scrape_scores.py player_points.py wnba_game_predictions_ledger.py wnba_game_performance.py wnba_player_props_ingestion.py wnba_alt_market_warehouse.py wnba_alt_streaks.py \
            patch_dashboard_canonical_runtime.py patch_dashboard_games_focus.py patch_dashboard_v4_ui_freeze.py patch_dashboard_v4_ui_freeze_safe.py \
            patch_dashboard_s19_m02.py patch_dashboard_s19_m03.py patch_dashboard_s19_m06.py scripts/build_daily_canonical_slate.py \
            scripts/scrape_odds_props_consensus.py scripts/wnba_game_archive_backfill.py scripts/wnba_s19_m02_prop_source.py scripts/wnba_s19_m02_predictions.py scripts/wnba_s19_m03_dashboard_consumer.py scripts/wnba_s19_m06_results_lifecycle.py \
            scripts/wnba_dashboard_slate_context.py \
            patch_dashboard_alt_props_table.py patch_dashboard_alt_props_scores.py patch_dashboard_alt_props_performance_panel.py wnba_alt_streak_confidence.py wnba_alt_performance_tracker.py \
            patch_dashboard_sprint2_phase2.py patch_dashboard_build_verification.py patch_dashboard_alt_grading_status.py wnba_alt_pending_diagnostics.py \
            patch_dashboard_alt_recovery_progress.py patch_dashboard_game_performance.py patch_dashboard_v4_alt_streaks_display.py patch_dashboard_v4_alt_ladders.py \
            wnba_results_grader.py wnba_edge_database.py
          python -m py_compile active_slate_date.py patch_dashboard_break_state.py

      - name: Compile optional data renderers
        continue-on-error: true
        run: |
          for file in patch_dashboard_v5_injury_intelligence.py patch_dashboard_v5_player_prop_injury_context.py patch_dashboard_v4_remaining_season.py; do
            if [ -f "$file" ]; then python -m py_compile "$file" || echo "Optional renderer compile warning: $file"; fi
          done

      - name: Validate persisted current ALT market and streak sources
        run: |
          set -e
          python - <<'PY'
          import json,os
          from pathlib import Path
          target=os.environ['TARGET']
          w=json.loads(Path('data/dashboard/wnba_alt_market_warehouse.json').read_text())
          s=json.loads(Path('data/dashboard/wnba_alt_streaks.json').read_text())
          if os.environ.get('MAINTENANCE_BREAK') == 'true':
              print({
                  'status':'BREAK_MODE_DEPLOY_SAFE',
                  'mode':os.environ.get('SLATE_MODE'),
                  'observation_date':target,
                  'next_slate_date':os.environ.get('NEXT_SLATE_DATE') or None,
                  'warehouse_target':w.get('target_date'),
                  'streaks_target':s.get('target_date'),
                  'stale_alt_actionable':False,
                  'paid_api_called':False,
              })
              raise SystemExit(0)
          current = w.get('target_date')==target and s.get('target_date')==target
          # ALT is an independently owned optional market surface.  Never let a
          # stale ALT snapshot block a verified current standard slate from
          # deploying.  Fail closed for ALT itself and expose that state to all
          # later steps; standard Games/Matchups/Props continue normally.
          alt_state='CURRENT' if current else 'PAUSED_STALE_SOURCE'
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as env:
              env.write(f"ALT_CURRENT_SOURCE={'true' if current else 'false'}\\n")
              env.write(f"ALT_SOURCE_STATE={alt_state}\\n")
          print({
              'status':'PASS' if current else 'ALT_PAUSED_STANDARD_SLATE_CONTINUES',
              'mode':'persisted-read-only',
              'target':target,
              'warehouse_target':w.get('target_date'),
              'streaks_target':s.get('target_date'),
              'alt_current_source':current,
              'alt_source_state':alt_state,
              'stale_alt_actionable':False,
              'alt_markets':int((w.get('summary') or {}).get('markets') or 0) if current else 0,
              'active_alt_streak_rows':int((s.get('summary') or {}).get('alternate_rows') or 0) if current else 0,
          })
          PY

      - name: Score current ALT props
        if: env.MAINTENANCE_BREAK != 'true' && env.ALT_CURRENT_SOURCE == 'true'
        run: |
          python wnba_alt_streak_confidence.py --date "$TARGET"
          python wnba_alt_performance_tracker.py --date "$TARGET" --analyze
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/dashboard/wnba_alt_performance.json').read_text())
          assert 'live_performance' in p and 'research_archive' in p and 'calibration_training_set' in p
          assert p['live_performance']['n'] == sum(int(r.get('decisions') or 0) for r in p.get('by_action',[]) if str(r.get('group') or '').upper() == 'BET')
          assert [r.get('group') for r in p['research_archive']['tiers']] == ['LEAN','WATCH','PASS']
          print({'status':'PASS','alt_performance_views':3,'live_bet_n':p['live_performance']['n']})
          PY

      - name: Build complete dashboard artifact
        run: |
          set -e
          if [ "${MAINTENANCE_BREAK:-false}" = 'true' ]; then
            python patch_dashboard_game_performance.py --render-only
            BREAK_ARGS=(
              --mode "$SLATE_MODE"
              --current-date "$CURRENT_DATE"
              --schedule-source "$SCHEDULE_SOURCE"
            )
            if [ -n "${NEXT_SLATE_DATE:-}" ]; then
              BREAK_ARGS+=(--next-slate-date "$NEXT_SLATE_DATE")
            fi
            if [ -n "${DAYS_UNTIL_SLATE:-}" ]; then
              BREAK_ARGS+=(--days-until-slate "$DAYS_UNTIL_SLATE")
            fi
            python patch_dashboard_break_state.py "${BREAK_ARGS[@]}"
            echo 'BREAK_MODE_DEPLOY_SAFE: current betting views are paused; archive and health views remain available.'
            exit 0
          fi
          python wnba_terminal_ui.py --date "$TARGET"
          python patch_terminal_ui.py
          if [ -f data/dashboard/wnba_injury_intelligence.json ]; then python patch_dashboard_v5_injury_intelligence.py || true; python patch_dashboard_v5_player_prop_injury_context.py || true; fi
          if [ -f data/dashboard/wnba_remaining_season_intelligence.json ]; then python patch_dashboard_v4_remaining_season.py || true; fi
          python patch_dashboard_alt_grading_status.py || true
          python wnba_alt_pending_diagnostics.py || true
          if [ -f data/dashboard/wnba_alt_recovery_progress.json ]; then python patch_dashboard_alt_recovery_progress.py || true; fi
          python patch_dashboard_game_performance.py --render-only
          python patch_dashboard_build_verification.py || true
          python - <<'PY'
          import re
          from pathlib import Path
          p=Path('docs/index.html'); h=p.read_text(encoding='utf-8')
          for eid in ('v4-alt-streaks-display-script','v4-alt-ladders-script'): h=re.sub(rf'<script id="{re.escape(eid)}">.*?</script>','',h,flags=re.S)
          p.write_text(h,encoding='utf-8')
          PY
          python patch_dashboard_v4_alt_streaks_display.py
          python patch_dashboard_v4_alt_ladders.py
          echo 'Using persisted canonical slate; deploy performs no sportsbook ingestion.'
          python - <<'PY'
          import json,os
          from pathlib import Path
          target=os.environ['TARGET']
          manifest=json.loads(Path('data/dashboard/wnba_daily_canonical_manifest.json').read_text())
          props=json.loads(Path('data/dashboard/wnba_player_props.json').read_text())
          if manifest.get('status')!='PASS' or manifest.get('target_date')!=target: raise SystemExit(f"Canonical manifest mismatch after rebuild: {manifest.get('target_date')} status={manifest.get('status')} target={target}")
          if props.get('target_date')!=target: raise SystemExit(f"Canonical player props target mismatch after rebuild: {props.get('target_date')} != {target}")
          print({'status':'PASS','target':target,'canonical_manifest':manifest.get('target_date'),'canonical_player_props':props.get('row_count',len(props.get('rows') or []))})
          PY
          if ! grep -qi '<body' docs/index.html; then
            echo 'Legacy overlay consumed dashboard shell; restoring committed shell.'
            git show HEAD:docs/index.html > docs/index.html
          fi
          python patch_dashboard_canonical_runtime.py
          python patch_dashboard_games_focus.py
          python patch_dashboard_sprint2_phase2.py
          python patch_dashboard_v4_ui_freeze_safe.py
          if python scripts/wnba_s19_m02_prop_source.py --date "$TARGET"; then
            export CLOSED_SLATE=false
            echo 'CLOSED_SLATE=false' >> "$GITHUB_ENV"
            python player_points.py --date "$TARGET" --out data/raw
            python scripts/wnba_s19_m02_predictions.py --date "$TARGET"
            python patch_dashboard_s19_m02.py
            python scripts/wnba_s19_m03_dashboard_consumer.py --date "$TARGET"
            python patch_dashboard_s19_m03.py
            if python scripts/wnba_s19_m04_decision_contract.py --date "$TARGET"; then
              python scripts/wnba_s19_m06_results_lifecycle.py --date "$TARGET" || echo 'M06 prediction archive failed for this run; will retry on the next deploy run today.'
            else
              echo 'M04 decision contract not READY for this slate; skipping prediction archive for today (will retry on the next deploy run).'
            fi
          else
            echo 'No open current-slate props after finals; rendering verified archived results only.'
            export CLOSED_SLATE=true
            echo 'CLOSED_SLATE=true' >> "$GITHUB_ENV"
            python scripts/wnba_s19_m06_results_lifecycle.py --date "$TARGET" --results-only
            python patch_dashboard_s19_m06.py
          fi
          python patch_dashboard_alt_props_table.py
          python patch_dashboard_alt_props_scores.py
          python patch_dashboard_alt_props_performance_panel.py
          python patch_dashboard_v4_alt_streaks_display.py
          if [ "${CLOSED_SLATE:-false}" = 'true' ]; then
            python scripts/wnba_s19_m06_results_lifecycle.py --date "$TARGET" --results-only
            python patch_dashboard_s19_m06.py
          fi

      - name: Verify maintenance break artifact
        if: env.MAINTENANCE_BREAK == 'true'
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          html=Path('docs/index.html').read_text(encoding='utf-8')
          required=[
              'id="wnba-break-state-script"',
              'WNBA_SLATE_CONTEXT',
              '"maintenance_deploy_safe":true',
              '"current_market_data_allowed":false',
              '"paid_api_called":false',
              '"stale_predictions_actionable":false',
              'Results, Game Performance, Remaining Season, and Data Health',
              'id="game-performance-route-script"',
          ]
          missing=[marker for marker in required if marker not in html]
          if missing: raise SystemExit(f'BREAK_MODE_DEPLOY_UNSAFE: missing {missing}')
          if html.count('id="wnba-break-state-script"') != 1:
              raise SystemExit('BREAK_MODE_DEPLOY_UNSAFE: break runtime duplicated')
          print({
              'status':'BREAK_MODE_DEPLOY_SAFE',
              'observation_date':os.environ['CURRENT_DATE'],
              'next_slate_date':os.environ.get('NEXT_SLATE_DATE') or None,
              'paid_api_called':False,
              'stale_predictions_actionable':False,
              'archive_views_available':True,
          })
          PY

      - name: Verify Sprint 19 M02-M06 dashboard routing and current slate artifact
        if: env.MAINTENANCE_BREAK != 'true'
        run: |
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          h=Path('docs/index.html').read_text(encoding='utf-8'); target=os.environ['TARGET']
          alt=json.loads(Path('data/dashboard/wnba_alt_streaks.json').read_text())
          alt_stamp=str(alt.get('generated_at_utc') or '')
          if not alt_stamp or f'"generated_at_utc":"{alt_stamp}"' not in h: raise SystemExit(f'ALT embedded payload is stale: expected generated_at_utc={alt_stamp}')
          alt_current=str(alt.get('target_date') or '') == target
          # ALT freshness is independently fail-closed earlier in this job.
          # A stale ALT source pauses ALT only; it must not block a verified
          # current standard slate at the final Sprint 19 deployment gate.
          if not alt_current and os.environ.get('ALT_CURRENT_SOURCE','false').lower() == 'true':
              raise SystemExit(f'ALT source contract contradiction: env says current but artifact={alt.get("target_date")} target={target}')
          eligible=[r for r in alt.get('rows',[]) if alt_current and r.get('line_type')=='alternate' and int(r.get('streak') or 0)>=5 and str(r.get('best_book') or '').lower() in {'fanduel','draftkings','fanatics'}]
          if alt_current and alt.get('rows') and not eligible: raise SystemExit('ALT source is nonempty but has zero renderer-eligible rows')
          if eligible and "row_gate:'target-date-artifact'" not in h: raise SystemExit('ALT renderer is not using the stable target-date artifact gate')
          build_marker=f'<!-- canonical-build-target-v1:{target} -->'
          if build_marker not in h: raise SystemExit(f'REFUSE DEPLOY: canonical build target marker missing for {target}')
          visible=set(re.findall(r'Slate\s+(\d{4}-\d{2}-\d{2})',h)); stale=sorted(visible-{target})
          if stale: raise SystemExit(f'REFUSE DEPLOY: stale slate labels {stale}; target={target}')
          if f'"target_date": "{target}"' not in h and f'"target_date":"{target}"' not in h: raise SystemExit(f'REFUSE DEPLOY: canonical payload target {target} missing')
          required=['id="tabs"','canonical-daily-runtime-v1','v4-ui-freeze-script','s19-m02-script','WNBA_S19_M02','s19-m03-script','WNBA_S19_M03','s19-m04-contract-script','WNBA_CANONICAL_DASHBOARD_CONTRACT','s19-m05-health-script','WNBA_DASHBOARD_HEALTH','s19-m06-results-script','WNBA_RESULTS_LIFECYCLE','Player Props Results','alt-props-performance-panel-data']
          missing=[x for x in required if x not in h]
          if missing: raise SystemExit(f'Sprint 19 M02-M06 verification failed; missing markers: {missing}')
          for marker in ('canonical-daily-runtime-script','v4-ui-freeze-script','s19-m02-script','s19-m03-script','s19-m04-contract-script','s19-m05-health-script','s19-m06-results-script','alt-props-performance-panel-data'):
              if h.count(f'id="{marker}"')!=1: raise SystemExit(f'{marker} duplicated or missing')
          if h.count('id="root"')>1 or h.count('id="tabs"')!=1: raise SystemExit('Dashboard root/navigation duplication')
          def j(name): return json.loads(Path('data/dashboard/'+name).read_text())
          closed=os.environ.get('CLOSED_SLATE','false').lower()=='true'
          a6=j('wnba_s19_m06_results_lifecycle_audit.json')
          if not closed:
              a2=j('wnba_s19_m02_prediction_audit.json'); a3=j('wnba_s19_m03_dashboard_consumer_audit.json'); a4=j('wnba_s19_m04_decision_contract_audit.json'); a5=j('wnba_s19_m05_dashboard_health_audit.json')
              assert a2.get('status')=='READY' and a2.get('target_date')==target and a2.get('actionable_out_props')==0 and a2.get('player_prop_predictions',0)>0 and a2.get('all_rendered_props_exact_current_slate') is True, a2
              if a2.get('injury_source_verified') is not True:
                  assert a2.get('recommendations_actionable') is False and a2.get('actionable_injury_unverified_props')==0 and a2.get('best_bets_current_rows')==0 and a2.get('portfolio_current_rows')==0, a2
              assert a3.get('status')=='READY' and a3.get('target_date')==target and a3.get('all_consumers_single_source') is True and a3.get('phase2_best_bets_fallback_enabled') is False and a3.get('phase2_portfolio_fallback_enabled') is False, a3
              assert a4.get('status')=='READY' and a4.get('target_date')==target and a4.get('all_rows_current_slate') is True and a4.get('actionable_unavailable_props')==0 and a4.get('legacy_fallback_enabled') is False and a4.get('single_dashboard_contract') is True, a4
              assert a5.get('status')=='READY' and a5.get('target_date')==target and a5.get('all_health_checks_pass') is True and a5.get('healthy_checks')==a5.get('total_checks') and float(a5.get('contract_age_minutes',9999))<=90 and a5.get('legacy_fallback_enabled') is False and a5.get('single_dashboard_contract') is True, a5
              assert a6.get('target_history_records',0)>0, a6
          else:
              # A closed/no-open-props slate is deployable while completed actuals
              # are still pending. Do not invent history rows or falsely require
              # ALL_FINAL_RESULTS_GRADED before games have produced gradeable data.
              assert a6.get('results_only') is True, a6
              assert a6.get('results_state') in {'ALL_FINAL_RESULTS_GRADED','ARCHIVED_WAITING_FOR_COMPLETED_ACTUALS'}, a6
              if a6.get('results_state')=='ALL_FINAL_RESULTS_GRADED':
                  assert a6.get('target_history_records',0)>0, a6
              else:
                  assert a6.get('target_history_records',0)==0 and a6.get('history_persistence_required') is False, a6
          assert a6.get('status')=='READY' and a6.get('target_date')==target and a6.get('duplicate_history_keys')==0 and a6.get('same_day_final_results_inferred') is False and a6.get('existing_grader_reused') is True and a6.get('existing_edge_database_reused') is True, a6
          if os.environ.get('PREPARED_UPCOMING') == 'true':
              assert os.environ.get('DASHBOARD_MODE') == 'upcoming'
              assert 'id="wnba-break-state-script"' not in h
          print({'status':'PASS','sprint':19,'mode':'results-only' if closed else 'live','dashboard_mode':os.environ.get('DASHBOARD_MODE'),'target':target,'visible_slate_dates':sorted(visible),'stale_slate_dates':stale,'deployment_safe':True,'alt_source_current':alt_current,'alt_source_rows':len(alt.get('rows') or []) if alt_current else 0,'alt_renderer_eligible_rows':len(eligible),'results_state':a6.get('results_state'),'target_history_records':a6.get('target_history_records'),'target_edge_records':a6.get('target_edge_records')})
          PY

      - name: Persist grading and Sprint 19 history
        if: env.MAINTENANCE_BREAK != 'true'
        run: |
          set -e
          GRADING_OUTPUTS=(
            data/history/wnba_game_predictions.jsonl
            data/dashboard/wnba_game_predictions_ledger.json
            data/warehouse/wnba_game_predictions_ledger.json
            data/dashboard/wnba_game_performance.json
            data/warehouse/wnba_game_performance.json
            data/dashboard/wnba_game_archive_backfill_audit.json
          )
          CHANGED=false
          if ! git diff --quiet -- data/history; then CHANGED=true; fi
          for file in "${GRADING_OUTPUTS[@]}"; do
            if [ -f "$file" ] && ! git diff --quiet -- "$file"; then CHANGED=true; fi
          done
          if [ "$CHANGED" != 'true' ]; then echo 'Prediction history and grading artifacts already persisted; no commit needed.'; exit 0; fi
          git config user.name 'WNBA Results Grading Bot'
          git config user.email 'actions@github.com'
          bash scripts/atomic_generated_push.sh "Persist WNBA results grading for ${TARGET}" data/history "${GRADING_OUTPUTS[@]}"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
