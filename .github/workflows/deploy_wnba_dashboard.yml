name: Deploy WNBA Dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'data/dashboard/**'
      - 'wnba_terminal_ui.py'
      - 'patch_terminal_ui.py'
      - 'patch_dashboard_canonical_runtime.py'
      - 'patch_dashboard_games_focus.py'
      - 'patch_dashboard_v4_ui_freeze.py'
      - 'patch_dashboard_build_verification.py'
      - 'patch_dashboard_alt_grading_status.py'
      - 'wnba_alt_pending_diagnostics.py'
      - 'patch_dashboard_alt_recovery_progress.py'
      - 'patch_dashboard_game_performance.py'
      - 'patch_dashboard_v5_injury_intelligence.py'
      - 'patch_dashboard_v5_player_prop_injury_context.py'
      - 'patch_dashboard_v4_remaining_season.py'
      - 'patch_dashboard_v4_alt_streaks_display.py'
      - 'patch_dashboard_v4_alt_ladders.py'
      - '.github/workflows/deploy_wnba_dashboard.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve dashboard date
        run: |
          TARGET=$(python active_slate_date.py 2>/dev/null || date -u +%F)
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "Dashboard target date: $TARGET"

      - name: Compile dashboard build chain
        run: |
          test -f docs/index.html
          python -m py_compile \
            wnba_terminal_ui.py \
            patch_terminal_ui.py \
            patch_dashboard_canonical_runtime.py \
            patch_dashboard_games_focus.py \
            patch_dashboard_v4_ui_freeze.py \
            patch_dashboard_build_verification.py \
            patch_dashboard_alt_grading_status.py \
            wnba_alt_pending_diagnostics.py \
            patch_dashboard_alt_recovery_progress.py \
            patch_dashboard_game_performance.py \
            patch_dashboard_v4_alt_streaks_display.py \
            patch_dashboard_v4_alt_ladders.py

      - name: Compile optional data renderers
        continue-on-error: true
        run: |
          for file in \
            patch_dashboard_v5_injury_intelligence.py \
            patch_dashboard_v5_player_prop_injury_context.py \
            patch_dashboard_v4_remaining_season.py
          do
            if [ -f "$file" ]; then
              python -m py_compile "$file" || echo "Optional renderer compile warning: $file"
            fi
          done

      - name: Build complete dashboard artifact
        run: |
          python wnba_terminal_ui.py --date "$TARGET"
          python patch_terminal_ui.py

          # Keep injury data/rendering available, but Sprint 1 places injury
          # intelligence inside Games rather than exposing a standalone tab.
          if [ -f data/dashboard/wnba_injury_intelligence.json ]; then
            python patch_dashboard_v5_injury_intelligence.py || echo "Optional injury renderer skipped."
            python patch_dashboard_v5_player_prop_injury_context.py || echo "Optional Player Props injury context skipped."
          fi

          if [ -f data/dashboard/wnba_remaining_season_intelligence.json ]; then
            python patch_dashboard_v4_remaining_season.py || echo "Optional Remaining Season renderer skipped."
          fi

          # Legacy diagnostics may still generate their data/HTML here; the
          # Games-focus cleanup removes those panels from the Games experience.
          python patch_dashboard_alt_grading_status.py || true
          python wnba_alt_pending_diagnostics.py || true
          if [ -f data/dashboard/wnba_alt_recovery_progress.json ]; then
            python patch_dashboard_alt_recovery_progress.py || true
          fi
          python patch_dashboard_game_performance.py
          python patch_dashboard_build_verification.py || true

          # Final current-slate ALT renderers.
          python - <<'PY'
          import re
          from pathlib import Path
          path = Path('docs/index.html')
          html = path.read_text(encoding='utf-8')
          for element_id in ('v4-alt-streaks-display-script','v4-alt-ladders-script'):
              html = re.sub(rf'<script id="{re.escape(element_id)}">.*?</script>','',html,flags=re.S)
          path.write_text(html, encoding='utf-8')
          PY
          python patch_dashboard_v4_alt_streaks_display.py
          python patch_dashboard_v4_alt_ladders.py

          # Canonical date/current-slate Games + Player Props only.
          python patch_dashboard_canonical_runtime.py

          # Remove Intelligence Terminal/final decisions/diagnostic panels from
          # Games without deleting their underlying data.
          python patch_dashboard_games_focus.py

          # UI Freeze runs last: exact 13-tab navigation, ALT Props standalone,
          # no standalone Injuries tab, injury summary integrated into Games.
          python patch_dashboard_v4_ui_freeze.py

      - name: Verify Sprint 1 UI freeze
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          h = Path('docs/index.html').read_text(encoding='utf-8')
          required = [
              'canonical-daily-runtime-v1','canonical-daily-runtime-script','WNBA_CANONICAL_DAILY',
              'v4-ui-freeze-script','WNBA_V4_UI_FREEZE','games-injury-intelligence',
              "['alt-props','ALT Props']", "['game-performance','Game Performance']",
              "['remaining','Remaining Season']", "['health','Data Health']",
              'ALT Streak Board','Sportsbook ALT Ladders','v4-alt-streaks-display-script','v4-alt-ladders-script',
              'Game Performance','WNBA_GAME_PERFORMANCE_START',
              'WNBA_GAMES_FOCUS_CLEANUP',
          ]
          missing=[x for x in required if x not in h]
          if missing:
              raise SystemExit(f'Sprint 1 verification failed; missing markers: {missing}')
          if h.count('id="canonical-daily-runtime-script"') != 1:
              raise SystemExit('Canonical runtime duplicated or missing.')
          if h.count('id="v4-ui-freeze-script"') != 1:
              raise SystemExit('V4 UI Freeze runtime duplicated or missing.')
          if h.count('id="v4-alt-streaks-display-script"') != 1 or h.count('id="v4-alt-ladders-script"') != 1:
              raise SystemExit('ALT renderer duplicated or missing.')

          # The locked NAV must not expose a standalone injuries tab.
          freeze_start=h.find('id="v4-ui-freeze-script"')
          freeze_end=h.find('</script>',freeze_start)
          freeze=h[freeze_start:freeze_end]
          if "['injuries','Injuries']" in freeze:
              raise SystemExit('Standalone Injuries tab is still present in locked navigation.')
          if "injuries:'games'" not in freeze:
              raise SystemExit('Injuries alias does not route back to Games.')

          # Games-focus cleanup must remove terminal/diagnostic visible blocks.
          for marker in ('<!-- WNBA_TERMINAL_UI_PATCH_START -->','<!-- WNBA_ALT_PENDING_DIAGNOSTICS_START -->','<!-- WNBA_BUILD_BEACON_START -->'):
              if marker in h:
                  raise SystemExit(f'Games cleanup failed; visible legacy block remains: {marker}')

          target=os.environ['TARGET']
          manifest=json.loads(Path('data/dashboard/wnba_daily_canonical_manifest.json').read_text())
          props=json.loads(Path('data/dashboard/wnba_player_props.json').read_text())
          assert manifest.get('status')=='PASS', manifest.get('failures')
          assert manifest.get('target_date')==target
          assert props.get('target_date')==target
          print({'status':'PASS','sprint':'V4 UI Freeze Sprint 1','target':target,'tabs':13,'alt_props':True,'injuries_in_games':True})
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
