name: Deploy WNBA Dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'data/dashboard/**'
      - 'wnba_terminal_ui.py'
      - 'patch_terminal_ui.py'
      - 'patch_dashboard_canonical_runtime.py'
      - 'patch_dashboard_games_focus.py'
      - 'patch_dashboard_v4_ui_freeze.py'
      - 'patch_dashboard_v4_ui_freeze_safe.py'
      - 'patch_dashboard_sprint2_phase2.py'
      - 'patch_dashboard_build_verification.py'
      - 'patch_dashboard_alt_grading_status.py'
      - 'wnba_alt_pending_diagnostics.py'
      - 'patch_dashboard_alt_recovery_progress.py'
      - 'patch_dashboard_game_performance.py'
      - 'patch_dashboard_v5_injury_intelligence.py'
      - 'patch_dashboard_v5_player_prop_injury_context.py'
      - 'patch_dashboard_v4_remaining_season.py'
      - 'patch_dashboard_v4_alt_streaks_display.py'
      - 'patch_dashboard_v4_alt_ladders.py'
      - '.github/workflows/deploy_wnba_dashboard.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve dashboard date
        run: |
          TARGET=$(python active_slate_date.py 2>/dev/null || date -u +%F)
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "Dashboard target date: $TARGET"

      - name: Compile dashboard build chain
        run: |
          test -f docs/index.html
          python -m py_compile \
            wnba_terminal_ui.py \
            patch_terminal_ui.py \
            patch_dashboard_canonical_runtime.py \
            patch_dashboard_games_focus.py \
            patch_dashboard_v4_ui_freeze.py \
            patch_dashboard_v4_ui_freeze_safe.py \
            patch_dashboard_sprint2_phase2.py \
            patch_dashboard_build_verification.py \
            patch_dashboard_alt_grading_status.py \
            wnba_alt_pending_diagnostics.py \
            patch_dashboard_alt_recovery_progress.py \
            patch_dashboard_game_performance.py \
            patch_dashboard_v4_alt_streaks_display.py \
            patch_dashboard_v4_alt_ladders.py

      - name: Compile optional data renderers
        continue-on-error: true
        run: |
          for file in \
            patch_dashboard_v5_injury_intelligence.py \
            patch_dashboard_v5_player_prop_injury_context.py \
            patch_dashboard_v4_remaining_season.py
          do
            if [ -f "$file" ]; then
              python -m py_compile "$file" || echo "Optional renderer compile warning: $file"
            fi
          done

      - name: Build complete dashboard artifact
        run: |
          python wnba_terminal_ui.py --date "$TARGET"
          python patch_terminal_ui.py

          if [ -f data/dashboard/wnba_injury_intelligence.json ]; then
            python patch_dashboard_v5_injury_intelligence.py || echo "Optional injury renderer skipped."
            python patch_dashboard_v5_player_prop_injury_context.py || echo "Optional Player Props injury context skipped."
          fi

          if [ -f data/dashboard/wnba_remaining_season_intelligence.json ]; then
            python patch_dashboard_v4_remaining_season.py || echo "Optional Remaining Season renderer skipped."
          fi

          python patch_dashboard_alt_grading_status.py || true
          python wnba_alt_pending_diagnostics.py || true
          if [ -f data/dashboard/wnba_alt_recovery_progress.json ]; then
            python patch_dashboard_alt_recovery_progress.py || true
          fi

          python patch_dashboard_game_performance.py
          python patch_dashboard_build_verification.py || true

          python - <<'PY'
          import re
          from pathlib import Path
          path = Path('docs/index.html')
          html = path.read_text(encoding='utf-8')
          for element_id in ('v4-alt-streaks-display-script','v4-alt-ladders-script'):
              html = re.sub(rf'<script id="{re.escape(element_id)}">.*?</script>','',html,flags=re.S)
          path.write_text(html, encoding='utf-8')
          PY
          python patch_dashboard_v4_alt_streaks_display.py
          python patch_dashboard_v4_alt_ladders.py

          # Canonical runtime owns data only; it must never replace routed DOM.
          python patch_dashboard_canonical_runtime.py
          python patch_dashboard_games_focus.py

          # Dedicated view renderers register before the final router.
          python patch_dashboard_sprint2_phase2.py

          # UI Freeze is the FINAL and only navigation/router owner.
          # Run through the safe wrapper so JavaScript regex escapes are inserted verbatim.
          python patch_dashboard_v4_ui_freeze_safe.py

      - name: Verify single-owner Sprint 2 dashboard
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          h = Path('docs/index.html').read_text(encoding='utf-8')
          required = [
              'id="tabs"',
              'canonical-daily-runtime-v1','canonical-daily-runtime-script','WNBA_CANONICAL_DAILY','WNBA_CANONICAL_PROPS',
              'v4-ui-freeze-script','WNBA_V4_UI_FREEZE','games-injury-intelligence','ensureRoot','data-v4-router-root',
              "['alt-props','ALT Props']", "['game-performance','Game Performance']",
              "['remaining','Remaining Season']", "['health','Data Health']",
              'canonicalAltProps', "view==='alt-props'", 'html=canonicalAltProps()',
              'game-performance-route-script','fullGamePerformance','WNBA_GAMES_FOCUS_CLEANUP',
              'sprint2-phase2-script','WNBA_SPRINT2_PHASE2','gamesV25','Prediction Intelligence',
          ]
          missing=[x for x in required if x not in h]
          if missing:
              raise SystemExit(f'Sprint 2 verification failed; missing markers: {missing}')
          for marker in ('canonical-daily-runtime-script','v4-ui-freeze-script','sprint2-phase2-script','game-performance-route-script'):
              if h.count(f'id="{marker}"') != 1:
                  raise SystemExit(f'{marker} duplicated or missing')

          root_count = h.count('id="root"')
          tabs_count = h.count('id="tabs"')
          if root_count > 1:
              raise SystemExit(f'Routed #root duplicated: {root_count}')
          if tabs_count != 1:
              raise SystemExit(f'Navigation #tabs duplicated or missing: {tabs_count}')

          cstart=h.find('id="canonical-daily-runtime-script"'); cend=h.find('</script>',cstart); canonical_runtime=h[cstart:cend]
          if 'replacePanel(' in canonical_runtime or 'replaceWith(' in canonical_runtime:
              raise SystemExit('Canonical runtime is attempting to replace routed dashboard DOM.')

          if 'WNBA_GAME_PERFORMANCE_START' in h or 'data-wv4-tab="game-performance"' in h:
              raise SystemExit('Legacy Game Performance injector/nav is still present.')

          freeze_start=h.find('id="v4-ui-freeze-script"'); freeze_end=h.find('</script>',freeze_start); freeze=h[freeze_start:freeze_end]
          if "['injuries','Injuries']" in freeze:
              raise SystemExit('Standalone Injuries tab is still present.')
          if "injuries:'games'" not in freeze:
              raise SystemExit('Injuries alias does not route to Games.')
          if "window.gamesV25,window.games" not in freeze:
              raise SystemExit('Games route does not prefer Sprint 2 gamesV25 renderer.')
          if "window.fullGamePerformance" not in freeze:
              raise SystemExit('Game Performance route does not use fullGamePerformance.')
          if "root.innerHTML=html" not in freeze:
              raise SystemExit('Final router is not replacing routed content on tab changes.')
          if root_count == 0 and "root=document.createElement('div')" not in freeze:
              raise SystemExit('Shell has no static #root and final router does not create one dynamically.')
          if 'function canonicalAltProps()' not in freeze or "view==='alt-props'" not in freeze or 'html=canonicalAltProps()' not in freeze:
              raise SystemExit('ALT Props is not wired to its dedicated canonical renderer.')

          nav=re.search(r'const NAV=\[(.*?)\];',freeze,re.S)
          if not nav:
              raise SystemExit('Locked NAV definition missing.')
          entries=re.findall(r"\['([^']+)','([^']+)'\]",nav.group(1))
          if len(entries)!=13:
              raise SystemExit(f'Expected 13 locked nav entries, found {len(entries)}: {entries}')
          if sum(1 for _,label in entries if label=='Game Performance')!=1:
              raise SystemExit(f'Expected exactly one Game Performance nav entry: {entries}')

          for marker in ('<!-- WNBA_TERMINAL_UI_PATCH_START -->','<!-- WNBA_ALT_PENDING_DIAGNOSTICS_START -->','<!-- WNBA_BUILD_BEACON_START -->'):
              if marker in h:
                  raise SystemExit(f'Games cleanup failed; legacy block remains: {marker}')

          target=os.environ['TARGET']
          manifest=json.loads(Path('data/dashboard/wnba_daily_canonical_manifest.json').read_text())
          phase2=json.loads(Path('data/dashboard/wnba_sprint2_phase2.json').read_text())
          assert manifest.get('status')=='PASS', manifest.get('failures')
          assert manifest.get('target_date')==target
          assert phase2.get('status')=='PASS' and phase2.get('target_date')==target
          canonical=set(manifest.get('games') or [])
          enriched={g.get('game') for g in phase2.get('games') or []}
          assert enriched==canonical, {'canonical':sorted(canonical),'phase2':sorted(enriched)}
          for g in phase2.get('games') or []:
              p=g.get('projection') or {}
              assert p.get('away_score') is not None and p.get('home_score') is not None
              assert g.get('confidence') is not None and g.get('model_grade')
          print({'status':'PASS','sprint':2,'phase':2,'target':target,'tabs':13,'single_owner_routes':True,'dynamic_root':root_count==0,'alt_props_route':'canonical','games':len(enriched)})
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
