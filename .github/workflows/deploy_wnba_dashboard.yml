name: Deploy WNBA Dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'data/dashboard/wnba_injury_intelligence.json'
      - 'patch_dashboard_v5_injury_intelligence.py'
      - 'patch_dashboard_v5_player_prop_injury_context.py'
      - 'patch_dashboard_v4_consolidated_navigation.py'
      - '.github/workflows/deploy_wnba_dashboard.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build required injury intelligence into deployment artifact
        run: |
          test -f docs/index.html
          test -f patch_dashboard_v5_injury_intelligence.py
          test -f patch_dashboard_v5_player_prop_injury_context.py
          test -f data/dashboard/wnba_injury_intelligence.json
          python -m py_compile \
            patch_dashboard_v5_injury_intelligence.py \
            patch_dashboard_v5_player_prop_injury_context.py
          python patch_dashboard_v5_injury_intelligence.py
          python patch_dashboard_v5_player_prop_injury_context.py

      - name: Verify complete dashboard artifact
        run: |
          python - <<'PY'
          from pathlib import Path
          h = Path('docs/index.html').read_text(encoding='utf-8')
          required = [
              'v5-injury-intelligence-data',
              'v5-injury-intelligence-script',
              "['injuries','Injuries']",
              "view==='injuries'",
              'window.injuryIntelligence',
              'v5-player-prop-injury-style',
              'v5-player-prop-injury-script',
              'window.WNBA_PLAYER_PROP_INJURY_CONTEXT',
              'Injury-adjusted',
          ]
          missing = [marker for marker in required if marker not in h]
          if missing:
              raise SystemExit(f'Deployment blocked; missing injury markers: {missing}')
          print('Dashboard artifact includes Injury Intelligence and Player Props injury context.')
          PY
          echo "Dashboard entry point verified."
          find docs -maxdepth 2 -type f | sort | head -100

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
