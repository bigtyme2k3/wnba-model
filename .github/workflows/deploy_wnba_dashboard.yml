name: Deploy WNBA Dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'data/dashboard/**'
      - 'wnba_terminal_ui.py'
      - 'patch_terminal_ui.py'
      - 'patch_dashboard_canonical_runtime.py'
      - 'patch_dashboard_build_verification.py'
      - 'patch_dashboard_alt_grading_status.py'
      - 'wnba_alt_pending_diagnostics.py'
      - 'patch_dashboard_alt_recovery_progress.py'
      - 'patch_dashboard_game_performance.py'
      - 'patch_dashboard_v5_injury_intelligence.py'
      - 'patch_dashboard_v5_injury_navigation_compat.py'
      - 'patch_dashboard_v5_player_prop_injury_context.py'
      - 'patch_dashboard_v4_remaining_season.py'
      - 'patch_dashboard_v4_alt_streaks_display.py'
      - 'patch_dashboard_v4_alt_ladders.py'
      - 'patch_dashboard_v4_consolidated_navigation.py'
      - '.github/workflows/deploy_wnba_dashboard.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve dashboard date
        run: |
          TARGET=$(python active_slate_date.py 2>/dev/null || date -u +%F)
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "Dashboard target date: $TARGET"

      - name: Compile core dashboard build chain
        run: |
          test -f docs/index.html
          python -m py_compile \
            wnba_terminal_ui.py \
            patch_terminal_ui.py \
            patch_dashboard_canonical_runtime.py \
            patch_dashboard_build_verification.py \
            patch_dashboard_alt_grading_status.py \
            wnba_alt_pending_diagnostics.py \
            patch_dashboard_alt_recovery_progress.py \
            patch_dashboard_game_performance.py \
            patch_dashboard_v4_alt_streaks_display.py \
            patch_dashboard_v4_alt_ladders.py

      - name: Compile optional dashboard plugins
        continue-on-error: true
        run: |
          for file in \
            patch_dashboard_v5_injury_intelligence.py \
            patch_dashboard_v5_injury_navigation_compat.py \
            patch_dashboard_v5_player_prop_injury_context.py \
            patch_dashboard_v4_remaining_season.py
          do
            if [ -f "$file" ]; then
              python -m py_compile "$file" || echo "Optional plugin compile warning: $file"
            fi
          done

      - name: Build complete dashboard artifact
        run: |
          python wnba_terminal_ui.py --date "$TARGET"
          python patch_terminal_ui.py

          if [ -f data/dashboard/wnba_injury_intelligence.json ]; then
            python patch_dashboard_v5_injury_intelligence.py || echo "Optional Injury Intelligence renderer skipped."
            python patch_dashboard_v5_player_prop_injury_context.py || echo "Optional Player Props injury context skipped."
            python patch_dashboard_v5_injury_navigation_compat.py || echo "Optional Injuries navigation skipped."
          else
            echo "Injury payload unavailable; continuing without the optional Injuries module."
          fi

          if [ -f data/dashboard/wnba_remaining_season_intelligence.json ]; then
            python patch_dashboard_v4_remaining_season.py || echo "Optional Remaining Season module skipped."
          else
            echo "Remaining-season payload unavailable; continuing without the optional module."
          fi

          python patch_dashboard_alt_grading_status.py
          python wnba_alt_pending_diagnostics.py
          if [ -f data/dashboard/wnba_alt_recovery_progress.json ]; then
            python patch_dashboard_alt_recovery_progress.py
          fi
          python patch_dashboard_game_performance.py
          python patch_dashboard_build_verification.py

          python - <<'PY'
          import re
          from pathlib import Path
          path = Path('docs/index.html')
          html = path.read_text(encoding='utf-8')
          for element_id in ('v4-alt-streaks-display-script','v4-alt-ladders-script'):
              html = re.sub(rf'<script id="{re.escape(element_id)}">.*?</script>','',html,flags=re.S)
          path.write_text(html, encoding='utf-8')
          PY
          python patch_dashboard_v4_alt_streaks_display.py
          python patch_dashboard_v4_alt_ladders.py

          # Install canonical daily data last so no legacy renderer can overwrite
          # the current slate date, Games rows, or Player Props rows.
          python patch_dashboard_canonical_runtime.py

      - name: Verify core dashboard artifact
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          h = Path('docs/index.html').read_text(encoding='utf-8')
          required = [
              'WNBA_TERMINAL_UI_PATCH_START','WNBA Intelligence Terminal','ALT Performance',
              'ALT Streak Board','Sportsbook ALT Ladders','v4-alt-streaks-display-data',
              'v4-alt-streaks-display-script','v4-alt-ladders-data','v4-alt-ladders-script',
              'No active-slate streaks match this filter.','off-slate row','active game',
              'Game Performance','WNBA_GAME_PERFORMANCE_START','game-performance-nav-script',
              'data-wv4-tab="game-performance"','Game Performance results',
              'Frozen pregame spreads, totals and projected scores','Spread record','Total record',
              'WNBA_ALT_GRADING_STATUS_START','ALT Grading Checkpoint',
              'Screenshot-verifiable grading freshness','WNBA_ALT_PENDING_DIAGNOSTICS_START',
              'Pending ALT Diagnostics','Pending rows','WNBA_BUILD_BEACON_START',
              'Games QA Beacon','screenshot-verifiable deployment marker',
              'canonical-daily-runtime-v1','canonical-daily-runtime-script','WNBA_CANONICAL_DAILY',
          ]
          if Path('data/dashboard/wnba_alt_recovery_progress.json').exists():
              required.extend(['WNBA_ALT_RECOVERY_PROGRESS_START','ALT Auto-Fix Progress','Jobs queued','Still missing'])
          missing = [marker for marker in required if marker not in h]
          if missing:
              raise SystemExit(f'Deployment blocked; missing core dashboard markers: {missing}')
          if h.count('id="v4-alt-streaks-display-script"') != 1:
              raise SystemExit('Deployment blocked; ALT streak renderer is duplicated or missing.')
          if h.count('id="v4-alt-ladders-script"') != 1:
              raise SystemExit('Deployment blocked; ALT ladder renderer is duplicated or missing.')
          if h.count('id="canonical-daily-runtime-script"') != 1:
              raise SystemExit('Deployment blocked; canonical runtime is duplicated or missing.')

          target=os.environ['TARGET']
          manifest=json.loads(Path('data/dashboard/wnba_daily_canonical_manifest.json').read_text())
          props=json.loads(Path('data/dashboard/wnba_player_props.json').read_text())
          assert manifest.get('status')=='PASS', manifest.get('failures')
          assert manifest.get('target_date')==target
          assert props.get('target_date')==target
          if f'"target_date": "{target}"' not in h:
              raise SystemExit('Deployment blocked; canonical target date is not embedded in HTML.')
          if 'NaN' in h or 'null%' in h:
              print('Legacy placeholders remain in source HTML but canonical runtime will replace visible values with em dashes.')
          print({'status':'PASS','target':target,'games':manifest.get('game_count'),'props':manifest.get('player_prop_rows')})
          PY

      - name: Report optional plugin status
        run: |
          python - <<'PY'
          from pathlib import Path
          h = Path('docs/index.html').read_text(encoding='utf-8')
          checks = {
              'Injury Intelligence': ['v5-injury-intelligence-data','v5-injury-intelligence-script'],
              'Injuries navigation': ['v5-injury-navigation-runtime','data-injury-runtime-tab'],
              'Player Props injury context': ['v5-player-prop-injury-script','window.WNBA_PLAYER_PROP_INJURY_CONTEXT'],
              'Remaining Season': ['v4-remaining-season-data','v4-remaining-season-script'],
          }
          for name, markers in checks.items():
              present = all(marker in h for marker in markers)
              print(f"{name}: {'ACTIVE' if present else 'SKIPPED'}")
          PY
          find docs -maxdepth 2 -type f | sort | head -100

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
