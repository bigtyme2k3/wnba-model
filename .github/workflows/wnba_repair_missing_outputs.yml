name: WNBA Repair Missing Outputs

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/repair_missing_outputs_request.txt'

permissions:
  contents: write

concurrency:
  group: wnba-main-writer
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve target date
        run: |
          TARGET=$(date +%F)
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"

      - name: Generate missing canonical outputs
        run: |
          python wnba_game_prop_intelligence.py --date "$TARGET"
          python wnba_best_bets.py --date "$TARGET"

      - name: Validate repaired outputs
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          target = os.environ['TARGET']
          checks = [
              Path('data/dashboard/wnba_game_prop_intelligence.json'),
              Path('data/dashboard/wnba_game_props.json'),
              Path('data/dashboard/wnba_best_bets.json'),
          ]
          for path in checks:
              if not path.exists() or path.stat().st_size == 0:
                  raise SystemExit(f'Missing repaired output: {path}')
              payload = json.loads(path.read_text(encoding='utf-8'))
              if str(payload.get('target_date') or '') != target:
                  raise SystemExit(f'Target mismatch for {path}: {payload.get("target_date")} != {target}')
          master = json.loads(Path('data/dashboard/wnba_master.json').read_text(encoding='utf-8'))
          expected = len([g for g in master.get('games', []) if isinstance(g, dict) and str(g.get('bucket','')).lower() == 'today'])
          props = json.loads(checks[0].read_text(encoding='utf-8'))
          if int(props.get('game_count') or 0) != expected:
              raise SystemExit(f'Game props count mismatch: {props.get("game_count")} != {expected}')
          print({'target': target, 'game_props': expected, 'best_bets_status': json.loads(checks[2].read_text()).get('status')})
          PY

      - name: Publish repaired data
        run: |
          git config user.name 'WNBA Output Repair Bot'
          git config user.email 'actions@github.com'
          bash scripts/atomic_generated_push.sh \
            "Repair Game Props and Best Bets outputs for ${TARGET}" \
            'data/dashboard/wnba_game_prop_intelligence.json' \
            'data/dashboard/wnba_game_props.json' \
            'data/dashboard/wnba_best_bets.json'

      - name: Note dashboard deployment handoff
        run: echo 'Dashboard HTML is rebuilt only by Deploy WNBA Dashboard after canonical data reaches main.'
