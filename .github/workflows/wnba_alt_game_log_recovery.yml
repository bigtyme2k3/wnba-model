name: WNBA ALT Game Log Recovery

on:
  workflow_dispatch:
    inputs:
      recovery_date:
        description: 'Optional single completed date (YYYY-MM-DD). Leave blank to recover every pending historical date.'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'wnba_alt_game_log_recovery.py'
      - 'wnba_alt_recovery_handoff.py'
      - 'wnba_alt_date_alias_recovery.py'
      - 'wnba_espn_boxscore_fallback.py'
      - 'wnba_alt_pending_diagnostics.py'
      - 'wnba_alt_strict_regrade.py'
      - 'wnba_player_game_log_archive.py'
      - 'wnba_player_game_log_warehouse.py'
      - 'wnba_alt_performance_tracker.py'
      - 'active_slate_date.py'
      - 'scripts/check_production_architecture.py'
      - '.github/workflows/wnba_alt_game_log_recovery.yml'

permissions:
  contents: write

concurrency:
  group: wnba-main-writer
  cancel-in-progress: false

jobs:
  recover-alt-game-logs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest repository
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify production architecture invariants
        run: python scripts/check_production_architecture.py

      - name: Resolve recovery scope
        run: |
          REQUESTED="${{ github.event.inputs.recovery_date }}"
          if [ -n "$REQUESTED" ]; then
            python - <<PY
          from datetime import date
          value='$REQUESTED'
          date.fromisoformat(value)
          print('ALT recovery scope: single date', value)
          PY
            echo "RECOVERY_REQUEST_DATE=$REQUESTED" >> "$GITHUB_ENV"
            python wnba_alt_game_log_recovery.py --date "$REQUESTED"
            DATES=$(python wnba_alt_game_log_recovery.py --date "$REQUESTED" --print-dates)
          else
            echo "ALT recovery scope: every pending historical date"
            echo "RECOVERY_REQUEST_DATE=" >> "$GITHUB_ENV"
            python wnba_alt_game_log_recovery.py
            DATES=$(python wnba_alt_game_log_recovery.py --print-dates)
          fi
          echo "RECOVERY_DATES=$DATES" >> "$GITHUB_ENV"
          echo "Target dates: ${DATES:-none}"

      - name: Compile recovery and grading tools
        run: |
          python -m py_compile \
            active_slate_date.py \
            wnba_alt_game_log_recovery.py \
            wnba_alt_recovery_handoff.py \
            wnba_alt_date_alias_recovery.py \
            wnba_espn_boxscore_fallback.py \
            wnba_alt_pending_diagnostics.py \
            wnba_alt_performance_tracker.py \
            wnba_alt_strict_regrade.py \
            wnba_player_game_log_archive.py \
            wnba_player_game_log_warehouse.py

      - name: Snapshot cumulative game-log warehouse
        if: env.RECOVERY_DATES != ''
        run: python wnba_player_game_log_archive.py snapshot

      - name: Recover verified game logs for every pending date
        if: env.RECOVERY_DATES != ''
        run: |
          for DAY in $RECOVERY_DATES; do
            echo "=== Recovering $DAY ==="
            python wnba_play_by_play_layer.py --date "$DAY" || true
            python wnba_player_game_log_warehouse.py --date "$DAY" || true
            python wnba_player_game_log_archive.py merge
            python wnba_espn_boxscore_fallback.py --date "$DAY" || true
            python wnba_player_game_log_warehouse.py --date "$DAY" || true
            python wnba_player_game_log_archive.py merge
            python wnba_player_game_log_archive.py snapshot
          done
          python wnba_player_game_log_backfill.py --season 2026 || true
          python wnba_player_game_log_archive.py merge
          python wnba_player_game_log_archive.py snapshot

      - name: Normalize recovered warehouse handoff
        if: env.RECOVERY_DATES != ''
        run: python wnba_alt_recovery_handoff.py

      - name: Resolve historical date aliases
        if: env.RECOVERY_DATES != ''
        run: |
          for DAY in $RECOVERY_DATES; do
            python wnba_alt_date_alias_recovery.py --date "$DAY" || true
          done

      - name: Grade entire ALT archive against recovered actuals
        if: env.RECOVERY_DATES != ''
        run: |
          python wnba_alt_performance_tracker.py --grade
          python wnba_alt_strict_regrade.py
          TARGET=$(python active_slate_date.py)
          test -n "$TARGET"
          python wnba_alt_performance_tracker.py --date "$TARGET" --analyze
          python wnba_alt_pending_diagnostics.py
          python wnba_alt_game_log_recovery.py

      - name: Verify grading accounting
        run: |
          python - <<'PY'
          import json
          diagnostics=json.load(open('data/dashboard/wnba_alt_pending_diagnostics.json'))
          alt=json.load(open('data/dashboard/wnba_alt_performance.json'))
          recovery=json.load(open('data/dashboard/wnba_alt_game_log_recovery.json'))
          s=alt.get('summary') or {}
          pending=int(s.get('pending') or 0)
          graded=int(s.get('graded') or 0)
          archived=int(s.get('archived_candidates') or 0)
          diagnosed=int((diagnostics.get('summary') or {}).get('pending_rows') or 0)
          assert pending == diagnosed, (pending, diagnosed)
          assert graded + pending <= archived, (archived, graded, pending)
          print({
              'archived': archived,
              'graded': graded,
              'pending': pending,
              'recovery_status': recovery.get('status'),
              'remaining_dates': (recovery.get('targets') or {}).get('dates') or [],
          })
          PY

      - name: Publish recovered logs and graded ALT history
        run: |
          git config user.name "WNBA Recovery Bot"
          git config user.email "actions@github.com"
          bash scripts/atomic_generated_push.sh \
            "Recover and grade pending WNBA ALT history" \
            'data/raw/wnba_boxscores_*.json' \
            'data/history/wnba_alt_streak_history.jsonl' \
            'data/history/wnba_player_game_logs_before_build.json' \
            'data/dashboard/wnba_player_game_logs.json' \
            'data/warehouse/wnba_player_game_logs.json' \
            'data/dashboard/wnba_alt_performance.json' \
            'data/warehouse/wnba_alt_performance.json' \
            'data/dashboard/wnba_alt_pending_diagnostics.json' \
            'data/warehouse/wnba_alt_pending_diagnostics.json' \
            'data/dashboard/wnba_alt_game_log_recovery.json' \
            'data/warehouse/wnba_alt_game_log_recovery.json' \
            'data/dashboard/wnba_alt_strict_regrade.json' \
            'data/warehouse/wnba_alt_strict_regrade.json'
