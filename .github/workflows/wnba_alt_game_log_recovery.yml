name: WNBA ALT Game Log Recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wnba_alt_game_log_recovery.py'
      - 'wnba_espn_boxscore_fallback.py'
      - 'wnba_alt_pending_diagnostics.py'
      - 'patch_dashboard_alt_recovery_progress.py'
      - 'wnba_player_game_log_archive.py'
      - 'wnba_player_game_log_warehouse.py'
      - 'wnba_alt_performance_tracker.py'
      - '.github/workflows/wnba_alt_game_log_recovery.yml'

permissions:
  contents: write

concurrency:
  group: wnba-main-writer
  cancel-in-progress: false

jobs:
  recover-alt-game-logs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest repository
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile recovery tools
        run: |
          python -m py_compile \
            wnba_alt_game_log_recovery.py \
            wnba_espn_boxscore_fallback.py \
            wnba_alt_pending_diagnostics.py \
            patch_dashboard_alt_recovery_progress.py \
            wnba_alt_performance_tracker.py \
            wnba_player_game_log_archive.py \
            wnba_player_game_log_warehouse.py

      - name: Build targeted recovery plan
        run: |
          python wnba_alt_game_log_recovery.py
          cp data/dashboard/wnba_alt_game_log_recovery.json /tmp/alt_recovery_before.json
          DATES=$(python wnba_alt_game_log_recovery.py --print-dates)
          echo "RECOVERY_DATES=$DATES" >> "$GITHUB_ENV"
          echo "Target dates: ${DATES:-none}"

      - name: Snapshot cumulative game-log warehouse
        if: env.RECOVERY_DATES != ''
        run: python wnba_player_game_log_archive.py snapshot

      - name: Recover primary verified game logs
        if: env.RECOVERY_DATES != ''
        run: |
          for DAY in $RECOVERY_DATES; do
            echo "Primary recovery for $DAY"
            python wnba_play_by_play_layer.py --date "$DAY" || true
            python wnba_player_game_log_warehouse.py --date "$DAY" || true
            python wnba_player_game_log_archive.py merge
            python wnba_player_game_log_archive.py snapshot
          done
          python wnba_player_game_log_backfill.py --season 2026 || true
          python wnba_player_game_log_archive.py merge
          python wnba_player_game_log_archive.py snapshot

      - name: Recover secondary ESPN box scores
        if: env.RECOVERY_DATES != ''
        run: |
          for DAY in $RECOVERY_DATES; do
            echo "ESPN fallback recovery for $DAY"
            python wnba_espn_boxscore_fallback.py --date "$DAY" || true
            python wnba_player_game_log_warehouse.py --date "$DAY" || true
            python wnba_player_game_log_archive.py merge
            python wnba_player_game_log_archive.py snapshot
          done

      - name: Audit recovered warehouse handoff
        if: env.RECOVERY_DATES != ''
        run: |
          python - <<'PY'
          import json
          import re
          import unicodedata
          from collections import Counter
          from pathlib import Path

          def norm(value):
              text=unicodedata.normalize('NFKD',str(value or '')).encode('ascii','ignore').decode('ascii').lower()
              return ' '.join(re.sub(r"[^a-z0-9]+",' ',text).split())

          warehouse_path=Path('data/warehouse/wnba_player_game_logs.json')
          diagnostics_path=Path('data/dashboard/wnba_alt_pending_diagnostics.json')
          assert warehouse_path.exists(), 'canonical warehouse missing before grading'
          warehouse=json.load(warehouse_path.open())
          diagnostics=json.load(diagnostics_path.open())
          records=[r for r in warehouse.get('records',[]) if isinstance(r,dict)]
          inspector=[]
          for group in diagnostics.get('groups',[]):
              if isinstance(group,dict):
                  inspector.extend(x for x in group.get('records',[]) if isinstance(x,dict))
          if not inspector:
              inspector=[x for x in diagnostics.get('inspector',[]) if isinstance(x,dict)]
          index={(norm(r.get('player')),str(r.get('game_date') or '')[:10]) for r in records}
          matches=sum((norm(row.get('player')),str(row.get('date') or '')[:10]) in index for row in inspector)
          target_dates=Counter(str(r.get('game_date') or '')[:10] for r in records)
          fallback_files=list(Path('data/raw').glob('wnba_boxscores_*.json'))
          print('RECOVERY HANDOFF AUDIT', {
              'canonical_records':len(records),
              'canonical_dates':dict(sorted(target_dates.items())),
              'pending_inspector_rows':len(inspector),
              'player_date_matches_before_grade':matches,
              'fallback_files':len(fallback_files),
              'warehouse_path':str(warehouse_path),
          })
          assert records, 'canonical warehouse is empty before ALT grading'
          if inspector and fallback_files:
              assert matches > 0, 'ESPN data downloaded but zero pending player/date rows reached the canonical warehouse'
          PY

      - name: Regrade only affected dates
        if: env.RECOVERY_DATES != ''
        run: |
          for DAY in $RECOVERY_DATES; do
            python wnba_alt_performance_tracker.py --date "$DAY" --grade
          done
          TARGET=$(python active_slate_date.py 2>/dev/null || date -u +%F)
          python wnba_alt_performance_tracker.py --date "$TARGET" --analyze
          python wnba_alt_pending_diagnostics.py
          python wnba_alt_game_log_recovery.py

      - name: Build visible recovery progress
        run: python patch_dashboard_alt_recovery_progress.py --before /tmp/alt_recovery_before.json

      - name: Verify recovery accounting
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          recovery=json.load(open('data/dashboard/wnba_alt_game_log_recovery.json'))
          progress=json.load(open('data/dashboard/wnba_alt_recovery_progress.json'))
          diagnostics=json.load(open('data/dashboard/wnba_alt_pending_diagnostics.json'))
          alt=json.load(open('data/dashboard/wnba_alt_performance.json'))
          pending=int((alt.get('summary') or {}).get('pending') or 0)
          diagnosed=int((diagnostics.get('summary') or {}).get('pending_rows') or 0)
          assert pending == diagnosed, (pending, diagnosed)
          assert progress.get('summary',{}).get('still_missing') == pending, progress
          assert progress.get('summary',{}).get('queued',0) >= pending, progress
          assert recovery.get('status') in {'ready','nothing_to_recover'}, recovery
          fallback_files=list(Path('data/raw').glob('wnba_boxscores_*.json'))
          print('ESPN fallback files:', len(fallback_files))
          html=open('docs/index.html',encoding='utf-8').read()
          assert 'WNBA_ALT_RECOVERY_PROGRESS_START' in html
          assert 'ALT Auto-Fix Progress' in html
          print('ALT GAME LOG RECOVERY VERIFIED', {'pending': pending, 'progress': progress.get('summary'), 'targets': recovery.get('targets',{})})
          PY

      - name: Publish recovery outputs
        run: |
          git config user.name "WNBA Recovery Bot"
          git config user.email "actions@github.com"
          bash scripts/atomic_generated_push.sh \
            "Recover pending WNBA ALT game logs with cumulative ESPN handoff" \
            'data/raw/wnba_boxscores_*.json' \
            'data/history/wnba_alt_streak_history.jsonl' \
            'data/history/wnba_player_game_logs_before_build.json' \
            'data/dashboard/wnba_player_game_logs.json' \
            'data/warehouse/wnba_player_game_logs.json' \
            'data/dashboard/wnba_alt_performance.json' \
            'data/warehouse/wnba_alt_performance.json' \
            'data/dashboard/wnba_alt_pending_diagnostics.json' \
            'data/warehouse/wnba_alt_pending_diagnostics.json' \
            'data/dashboard/wnba_alt_game_log_recovery.json' \
            'data/warehouse/wnba_alt_game_log_recovery.json' \
            'data/dashboard/wnba_alt_recovery_progress.json' \
            'data/warehouse/wnba_alt_recovery_progress.json' \
            'docs/index.html'
