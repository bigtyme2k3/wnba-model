name: WNBA V5 TeamRankings Historical Reconstruction
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wnba_v5_teamrankings_historical_reconstructor.py'
      - 'wnba_v5_teamrankings_manifest_builder.py'
      - 'data/raw/scores.csv'
      - '.github/workflows/wnba-v5-teamrankings-historical.yml'
permissions:
  contents: write
concurrency:
  group: wnba-v5-teamrankings-historical
  cancel-in-progress: false
jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Sync latest repository
        run: git pull --rebase origin main
      - name: Compile historical stack
        run: python -m py_compile wnba_v5_teamrankings_manifest_builder.py wnba_v5_teamrankings_historical_reconstructor.py
      - name: Build completed-game manifest
        run: python wnba_v5_teamrankings_manifest_builder.py
      - name: Capture historical archive resume-safely
        run: python wnba_v5_teamrankings_historical_reconstructor.py --limit 200 --delay 0.35
      - name: Verify no-lookahead contract and coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('data/warehouse/teamrankings/historical_matchup_manifest.json').read_text())
          p=json.loads(Path('data/dashboard/wnba_v5_teamrankings_historical_reconstruction.json').read_text())
          assert m['research_only'] is True and m['lookahead_safe'] is True
          assert p['research_only'] is True and p['production_ready'] is False
          assert 'Current snapshots may never backfill prior dates' in p['lookahead_policy']
          assert p['manifest_games']==len(m['matchups'])
          assert p['frozen_html_files_total']>=30
          print({'manifest_games':p['manifest_games'],'network_attempts':p['network_attempts_this_run'],'newly_captured':p['newly_captured_this_run'],'reused':p['reused_this_run'],'frozen_total':p['frozen_html_files_total']})
          PY
      - name: Publish research evidence safely
        run: |
          set -euo pipefail
          git config user.name 'WNBA V5 Historical Research Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/warehouse/teamrankings/historical_matchup_manifest.json data/warehouse/teamrankings/historical data/dashboard/wnba_v5_teamrankings_historical_reconstruction.json || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Expand V5 TeamRankings historical point-in-time evidence'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
