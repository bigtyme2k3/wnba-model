name: WNBA V5 TeamRankings Historical Reconstruction
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wnba_v5_teamrankings_historical_reconstructor.py'
      - 'data/warehouse/teamrankings/historical_matchup_manifest.json'
      - '.github/workflows/wnba-v5-teamrankings-historical.yml'
permissions:
  contents: write
concurrency:
  group: wnba-v5-teamrankings-historical
  cancel-in-progress: false
jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Sync latest repository
        run: git pull --rebase origin main
      - name: Compile reconstructor
        run: python -m py_compile wnba_v5_teamrankings_historical_reconstructor.py
      - name: Capture historical point-in-time evidence
        run: python wnba_v5_teamrankings_historical_reconstructor.py --limit 30
      - name: Verify no-lookahead contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/dashboard/wnba_v5_teamrankings_historical_reconstruction.json').read_text())
          assert p['research_only'] is True and p['production_ready'] is False
          assert 'Current snapshots may never backfill prior dates' in p['lookahead_policy']
          print({'requested':p['requested'],'captured':p['captured'],'missing':p['missing']})
          PY
      - name: Publish research evidence safely
        run: |
          set -euo pipefail
          git config user.name 'WNBA V5 Historical Research Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/warehouse/teamrankings/historical data/dashboard/wnba_v5_teamrankings_historical_reconstruction.json || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Freeze V5 TeamRankings historical point-in-time evidence'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
