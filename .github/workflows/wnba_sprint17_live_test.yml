name: WNBA Sprint 17 Live Market Test

on:
  workflow_dispatch:
    inputs:
      horizon_hours:
        description: 'Actionable slate horizon in hours'
        required: true
        default: '48'

concurrency:
  group: wnba-sprint17-live-test
  cancel-in-progress: false

jobs:
  test-live-market-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate live intelligence source
        run: |
          python -m py_compile \
            wnba_live_slate_refresh.py \
            wnba_warehouse_migration_bridge.py \
            wnba_market_timeline.py \
            wnba_line_movement_engine.py \
            wnba_steam_sharp_engine.py \
            wnba_clv_intelligence.py \
            wnba_entry_window_intelligence.py \
            wnba_automated_trend_discovery.py \
            wnba_trend_outcome_validation.py \
            wnba_closing_line_predictor.py \
            wnba_sportsbook_leader_normalization.py \
            wnba_opportunity_scanner.py \
            wnba_active_slate_scanner.py \
            wnba_daily_intelligence_brief.py \
            qa_daily_intelligence_brief.py

      - name: Pull current FanDuel and DraftKings markets
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python wnba_live_slate_refresh.py

      - name: Bridge live snapshot into Warehouse V2
        run: python wnba_warehouse_migration_bridge.py --execute

      - name: Rebuild Sprint 17 intelligence from live data
        env:
          HORIZON_HOURS: ${{ github.event.inputs.horizon_hours || '48' }}
        run: |
          python wnba_market_timeline.py
          python wnba_line_movement_engine.py
          python wnba_steam_sharp_engine.py
          python wnba_clv_intelligence.py
          python wnba_entry_window_intelligence.py
          python wnba_automated_trend_discovery.py
          python wnba_trend_outcome_validation.py
          python wnba_closing_line_predictor.py
          python wnba_sportsbook_leader_normalization.py
          python wnba_opportunity_scanner.py
          python wnba_active_slate_scanner.py
          python wnba_daily_intelligence_brief.py

      - name: Verify live daily brief
        run: |
          python qa_daily_intelligence_brief.py
          python - <<'PY'
          import json
          from pathlib import Path
          live=json.loads(Path('data/dashboard/wnba_live_slate_status.json').read_text())
          scanner=json.loads(Path('data/dashboard/wnba_live_scanner_summary.json').read_text())
          brief=json.loads(Path('data/dashboard/wnba_daily_intelligence_brief.json').read_text())
          print(json.dumps({
            'api_live_status': live.get('status'),
            'upcoming_games_with_odds': live.get('warehouse',{}).get('upcoming_games_with_current_odds'),
            'scanner_status': scanner.get('status'),
            'live_markets': scanner.get('live_markets'),
            'events': scanner.get('events'),
            'brief_status': brief.get('status'),
            'headline': brief.get('headline'),
            'top_opportunities': len(brief.get('top_opportunities',[])),
          }, indent=2))
          PY

      - name: Show live intelligence brief
        run: cat data/forecast/daily_intelligence_brief.md

      - name: Commit live test artifacts
        run: |
          set -euo pipefail
          git config user.name 'WNBA Sprint 17 Live Test Bot'
          git config user.email 'actions@github.com'
          git add data/warehouse data/market data/forecast data/trends data/dashboard
          if git diff --cached --quiet; then
            echo 'No live intelligence changes to commit.'
            exit 0
          fi
          git commit -m 'Refresh Sprint 17 intelligence with live WNBA markets'
          git pull --rebase origin main
          git push origin HEAD:main
