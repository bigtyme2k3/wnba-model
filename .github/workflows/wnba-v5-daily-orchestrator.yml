name: WNBA V5 Daily Orchestrator

# Permanent dependency-order entry point for the live V5 daily pipeline:
# canonical slate/props -> injury context -> phase2/M02 predictions ->
# derived dashboard + rollover + deploy, in strict needs: order.
#
# Scheduled runs (season live, config/v5_artifact_ownership.json mode=live)
# always run the full live chain -- there is no unattended dry-run mode, so
# a schedule firing IS a live_mode=true run. A manual workflow_dispatch still
# requires the operator to opt in explicitly via the live_mode checkbox.
#
# Three UTC fires, chosen against real WNBA tip-off times (earliest observed
# tip is 23:00 UTC / 7pm ET) and how late DraftKings/FanDuel/Fanatics
# actually post standard player props -- the 2026-09-24 16:15 UTC (12:15pm ET)
# fire still found zero props posted even after GitHub's own scheduling delay
# pushed its real start to ~19:58 UTC. Times below assume EDT (UTC-4), true
# for the whole WNBA season through early Nov; bump each cron hour by 1 if a
# playoff run ever lands after the fall DST changeover to EST (UTC-5).
#   10:15 UTC = 6:15am ET  -- overnight schedule/line refresh
#   18:15 UTC = 2:15pm ET  -- shifted later than the original 12:15pm fire so
#                             books have had more of the day to post props
#   21:15 UTC = 5:15pm ET  -- safety net: ~1h45m ahead of the earliest 7pm ET
#                             tip-off, so props are reliably posted by now even
#                             if the 2:15pm fire (plus its own retries in
#                             wnba_player_props_ingestion.py) still came up empty
# Flip config/v5_artifact_ownership.json back to mode=maintenance (and remove
# this schedule) for the off-season.
on:
  push:
    branches: [main]
    paths:
      - 'config/manual_refresh_request.json'
  schedule:
    - cron: '15 10 * * *'
    - cron: '15 18 * * *'
    - cron: '15 21 * * *'
    # 2026-09-27 playoff slate: 45 minutes before the 2, 4, 7, and 9pm ET tips.
    # GitHub cron uses UTC; the final slot falls on September 28 UTC.
    # The schedule gate below prevents these annual expressions from running
    # the pipeline in other years and suppresses today's regular afternoon slots.
    - cron: '15 17 27 9 *'  # 1:15pm ET
    - cron: '15 19 27 9 *'  # 3:15pm ET
    - cron: '15 22 27 9 *'  # 6:15pm ET
    - cron: '15 0 28 9 *'   # 8:15pm ET on September 27
  workflow_dispatch:
    inputs:
      target_date:
        description: Optional Eastern slate date (YYYY-MM-DD); blank uses active slate
        required: false
        type: string
        default: ''
      live_mode:
        description: Explicitly run live source owners and publish production artifacts
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: wnba-v5-daily-orchestrator
  cancel-in-progress: false

jobs:
  schedule-gate:
    name: Allow only intended refresh slots
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - name: Check Eastern date and scheduled cron
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" != schedule ]; then
            echo 'should_run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          eastern_date=$(TZ=America/New_York date +%F)
          if [ "$eastern_date" = '2026-09-27' ]; then
            case "$SCHEDULE_CRON" in
              '15 17 27 9 *'|'15 19 27 9 *'|'15 22 27 9 *'|'15 0 28 9 *') should_run=true ;;
              *) should_run=false ;;
            esac
          else
            case "$SCHEDULE_CRON" in
              '15 10 * * *'|'15 18 * * *'|'15 21 * * *') should_run=true ;;
              *) should_run=false ;;
            esac
          fi
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
          echo "Eastern date: $eastern_date; cron: $SCHEDULE_CRON; run: $should_run"

  ownership-contract:
    name: Verify V5 ownership contract
    needs: schedule-gate
    if: ${{ needs.schedule-gate.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify contract before orchestration
        run: |
          python scripts/wnba_v5_artifact_ownership_audit.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/dashboard/wnba_v5_artifact_ownership_audit.json').read_text())
          assert p['status']=='PASS', p.get('violations')
          assert p['ownership_violation_count']==0, p.get('violations')
          # scheduled_workflow_count==0 is only required during mode=maintenance
          # (the audit script itself enforces that equality whenever the contract
          # says maintenance -- see schedule_violation_count above). Once the
          # contract is mode=live, scheduled workflows are expected and allowed.
          if p['contract_mode'] == 'maintenance':
              assert p['scheduled_workflow_count']==0, p.get('scheduled_workflows')
          assert p['schedule_violation_count']==0, p.get('violations')
          live = '${{ github.event_name }}' in ('schedule', 'push') or '${{ inputs.live_mode }}' == 'true'
          print({
              'contract_status':'PASS',
              'contract_mode':p['contract_mode'],
              'protected_artifacts':p['protected_artifact_count'],
              'scheduled_workflow_count':p['scheduled_workflow_count'],
              'live_mode_requested':'${{ inputs.live_mode }}',
              'event_name':'${{ github.event_name }}',
              'pipeline_will_run':live,
          })
          PY

  dry-run-guard:
    name: DRY RUN - no pipeline stages executed
    needs: ownership-contract
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_mode != true }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail loudly so this can never be mistaken for a completed run
        run: |
          echo "::error::SKIPPED (dry run): live_mode was not checked on this manual dispatch."
          echo "::error::No pipeline stages ran -- canonical build, ALT market, injury context,"
          echo "::error::predictions, rollover, and deploy were all skipped by design (see"
          echo "::error::wnba-v5-daily-orchestrator.yml's live_mode gate). This run is NOT a"
          echo "::error::completed daily update. Re-dispatch with the live_mode box checked to"
          echo "::error::actually run the pipeline."
          exit 1

  canonical-base:
    name: Canonical slate + standard props
    needs: [ownership-contract, schedule-gate]
    if: ${{ (inputs.live_mode == true || github.event_name == 'schedule' || github.event_name == 'push') && needs.schedule-gate.outputs.should_run == 'true' }}
    uses: ./.github/workflows/wnba_daily_canonical_build.yml
    with:
      target_date: ${{ inputs.target_date }}
    secrets: inherit

  alt-market:
    name: Current ALT market
    needs: canonical-base
    # A confirmed empty slate is a healthy terminal state. Do not call the paid
    # ALT owner (or mark the daily run failed) merely because there are no games.
    # On game days, missing ALT eligibility remains a hard failure.
    if: ${{ (inputs.live_mode == true || github.event_name == 'schedule' || github.event_name == 'push') && needs.canonical-base.outputs.has_active_slate == 'true' }}
    uses: ./.github/workflows/wnba_alt_pregame_snapshot.yml
    with:
      deploy_dashboard: false
    secrets: inherit

  no-slate:
    name: Healthy no-slate completion
    needs: canonical-base
    if: ${{ (inputs.live_mode == true || github.event_name == 'schedule' || github.event_name == 'push') && needs.canonical-base.outputs.has_active_slate == 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Record confirmed empty slate
        run: |
          echo "No WNBA games are scheduled for ${{ needs.canonical-base.outputs.target_date }}."
          echo "Canonical game count: ${{ needs.canonical-base.outputs.game_count }}"
          echo "ALT, injuries, predictions, and rollover are correctly skipped."

  injury-context:
    name: Injury context
    needs: alt-market
    if: ${{ inputs.live_mode == true || github.event_name == 'schedule' || github.event_name == 'push' }}
    uses: ./.github/workflows/wnba_v5_injury_dashboard.yml
    with:
      date: ${{ inputs.target_date }}
    secrets: inherit

  downstream-predictions:
    name: Phase 2 + M02 predictions
    needs: injury-context
    if: ${{ inputs.live_mode == true || github.event_name == 'schedule' || github.event_name == 'push' }}
    uses: ./.github/workflows/wnba-new-day-prediction-sync.yml
    with:
      date: ${{ inputs.target_date }}
      deploy_dashboard: false
    secrets: inherit

  jev-shadow:
    name: Jev forward shadow (research only)
    needs: downstream-predictions
    if: ${{ (inputs.live_mode == true || github.event_name == 'schedule' || github.event_name == 'push') && needs.downstream-predictions.result == 'success' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Evaluate frozen production decisions without mutation
        run: |
          TARGET=$(python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/dashboard/wnba_s19_m02_predictions.json').read_text())
          print(str(p.get('target_date') or '')[:10])
          PY
          )
          if [ -z "$TARGET" ]; then
            echo "::warning::Jev skipped: prediction artifact has no target date."
            exit 0
          fi
          if [ -z "$TYPESAFE_API_KEY" ]; then
            echo "::warning::Jev skipped: TYPESAFE_API_KEY is not configured."
            exit 0
          fi
          python jev_shadow.py \
            --league wnba \
            --date "$TARGET" \
            --input data/dashboard/wnba_s19_m02_predictions.json \
            --output data/dashboard/wnba_jev_shadow.json \
            --ledger data/history/wnba_jev_shadow.jsonl \
            --max-candidates 20
      - name: Publish Jev research artifacts
        run: |
          git config user.name 'WNBA Jev Shadow Bot'
          git config user.email 'actions@github.com'
          git add data/dashboard/wnba_jev_shadow.json data/history/wnba_jev_shadow.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No Jev shadow changes to publish.'
            exit 0
          fi
          git commit -m "Jev forward shadow for WNBA"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            git rebase --abort || true
            sleep $((attempt*3))
          done
          exit 1

  derived-dashboard:
    name: Derived intelligence + terminal deploy
    needs: downstream-predictions
    if: ${{ inputs.live_mode == true || github.event_name == 'schedule' || github.event_name == 'push' }}
    uses: ./.github/workflows/wnba_daily_slate_rollover.yml
    with:
      target_date: ${{ inputs.target_date }}
    secrets: inherit
