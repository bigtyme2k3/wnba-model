name: WNBA Sprint 20 Step 5 Exception Recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - build_wnba_alt_exception_packet.py
      - .github/workflows/wnba_sprint20_step5_exception_recovery.yml

permissions:
  contents: write

concurrency:
  group: wnba-main-writer
  cancel-in-progress: false

jobs:
  build-exception-packet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Git publisher identity
        run: |
          git config user.name 'WNBA Sprint 20 Bot'
          git config user.email 'actions@github.com'

      - name: Compile Step 5 packet builder
        run: python -m py_compile build_wnba_alt_exception_packet.py

      - name: Build exception recovery packet
        run: python build_wnba_alt_exception_packet.py

      - name: Verify packet coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('data/warehouse/wnba_alt_exception_packet.json').read_text())
          pending=report['summary']['pending_records']
          assert pending >= 0
          assert len(report['records']) == pending
          print(json.dumps(report['summary'], indent=2))
          PY

      - name: Publish Step 5 artifacts
        run: |
          bash scripts/atomic_generated_push.sh \
            'Publish Sprint 20 Step 5 exception recovery packet' \
            data/warehouse/wnba_alt_exception_packet.json \
            data/dashboard/wnba_alt_exception_packet.json \
            data/warehouse/wnba_alt_exception_packet.csv \
            data/manual/wnba_alt_game_mapping_overrides.csv
