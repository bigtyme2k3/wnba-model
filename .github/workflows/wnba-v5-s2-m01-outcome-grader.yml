name: WNBA V5 S2 M01 Automated Outcome Grader
# Maintenance mode: clock-based grading is paused during the WNBA/FIBA break.
# M12 owns canonical forward-ledger grading; S2-M01 consumes the synchronized
# M12 report and publishes only its operational summary.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wnba_v5_ops_sprint2.py'
      - 'data/dashboard/wnba_v5_m12_report.json'
      - 'data/dashboard/wnba_v5_forward_validation.csv'
      - '.github/workflows/wnba-v5-s2-m01-outcome-grader.yml'
concurrency: {group: wnba-v5-s2, cancel-in-progress: false}
jobs:
  v5-s2-m01:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: git pull --rebase origin main
      - name: Compile
        run: python -m py_compile wnba_v5_ops_sprint2.py
      - name: Build S2 M01 from canonical M12 evidence
        run: python wnba_v5_ops_sprint2.py --module M01
      - name: Verify S2 M01
        run: |
          python - <<'PY'
          import json
          p=json.load(open('data/dashboard/wnba_v5_s2_m01_outcome_grader.json'))
          print(p)
          assert p['module']=='S2-M01'
          assert p['immutable_probabilities'] is True
          assert p['status'] in {'READY','WAITING_FOR_M12'}
          PY
      - name: Publish S2 M01 summary
        run: |
          set -euo pipefail
          git config user.name "WNBA V5 S2 Bot"; git config user.email "actions@users.noreply.github.com"
          git add data/dashboard/wnba_v5_s2_m01_outcome_grader.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh V5 S2 M01 outcome summary"; git pull --rebase origin main; git push origin HEAD:main
