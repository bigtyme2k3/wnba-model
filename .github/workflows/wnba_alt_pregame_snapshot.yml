name: WNBA ALT Canonical Market Writer

# Maintenance mode: paid ALT polling is manual-only during the WNBA/FIBA break.
# This workflow is the sole owner of the current exact ALT market warehouse.
# Other ALT workflows may call it, but they must not publish the warehouse.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: wnba-main-writer
  cancel-in-progress: false

jobs:
  snapshot-alt-pregame:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest repository
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ALT dependencies
        run: python -m pip install --disable-pip-version-check pandas requests

      - name: Resolve active slate
        run: |
          TARGET=$(python active_slate_date.py)
          test -n "$TARGET"
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "Canonical ALT market target: $TARGET"

      - name: Compile canonical ALT market chain
        run: |
          python -m py_compile \
            scripts/scrape_odds_props_consensus.py \
            wnba_alt_market_warehouse.py \
            wnba_alt_streaks.py \
            wnba_alt_streak_confidence.py \
            wnba_alt_calibration.py \
            wnba_alt_apply_calibration.py \
            wnba_alt_performance_tracker.py \
            wnba_alt_parlay_builder.py

      - name: Refresh exact ALT markets and scores
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_MIN_REMAINING: '1500'
        run: |
          set -euo pipefail
          if [ -n "${ODDS_API_KEY:-}" ]; then
            python scripts/scrape_odds_props_consensus.py --date "$TARGET" --out data/raw
          else
            echo "ODDS_API_KEY unavailable; cached exact ALT input required."
          fi
          python wnba_alt_market_warehouse.py --date "$TARGET"
          python wnba_alt_streaks.py --date "$TARGET"
          python wnba_alt_streak_confidence.py --date "$TARGET"
          python wnba_alt_apply_calibration.py --date "$TARGET"
          python wnba_alt_parlay_builder.py --date "$TARGET"

      - name: Verify exact current ALT market coverage
        run: |
          python - <<'PY'
          import json, os
          from collections import Counter
          from pathlib import Path

          target=os.environ['TARGET']
          market=json.loads(Path('data/dashboard/wnba_alt_market_warehouse.json').read_text())
          scores=json.loads(Path('data/dashboard/wnba_alt_streaks.json').read_text())
          calibration=json.loads(Path('data/dashboard/wnba_alt_calibration.json').read_text())
          parlays=json.loads(Path('data/dashboard/wnba_alt_parlays.json').read_text())

          if market.get('target_date') != target or scores.get('target_date') != target or parlays.get('target_date') != target:
              raise SystemExit('Canonical ALT target mismatch')

          summary=market.get('summary') or {}
          raw_rows=int(summary.get('raw_rows') or summary.get('source_raw_rows') or len(market.get('rows') or []))
          markets=int(summary.get('markets') or 0)
          if raw_rows <= 0 or markets <= 0:
              raise SystemExit('NO_CANONICAL_ALT_MARKETS_AVAILABLE')

          market_sides=Counter(str(r.get('side') or 'UNKNOWN').upper() for r in market.get('rows',[]) if isinstance(r,dict))
          score_rows=[r for r in scores.get('rows',[]) if isinstance(r,dict) and r.get('line_type')=='alternate']
          score_sides=Counter(str(r.get('side') or 'UNKNOWN').upper() for r in score_rows)
          action_counts=Counter(str(r.get('calibrated_action') or '').upper() for r in score_rows)
          for side in ('OVER','UNDER'):
              if market_sides.get(side,0) > 0 and score_sides.get(side,0) == 0:
                  raise SystemExit(f'ALT side coverage lost between market warehouse and scoring source: {side}')
          if not score_rows:
              raise SystemExit('Exact ALT markets arrived but zero scoring rows were generated')
          if any(not r.get('calibration_schema_version') for r in score_rows):
              raise SystemExit('Uncalibrated ALT rows detected after calibration step')
          if (calibration.get('policy') or {}).get('cross_side_fallback_allowed') is not False:
              raise SystemExit('ALT calibration must prohibit cross-side evidence fallback')

          print({
              'status':'PASS',
              'target':target,
              'raw_alt_rows':raw_rows,
              'markets':markets,
              'market_sides':dict(market_sides),
              'scored_sides':dict(score_sides),
              'calibrated_actions':dict(action_counts),
              'alt_parlays':(parlays.get('summary') or {}).get('total_parlays',0),
              'cross_side_fallback_allowed':False,
          })
          PY

      - name: Freeze canonical pregame observations
        run: |
          set -euo pipefail
          python wnba_alt_performance_tracker.py --date "$TARGET" --snapshot
          python wnba_alt_performance_tracker.py --grade
          python wnba_alt_performance_tracker.py --date "$TARGET" --analyze
          python - <<'PY'
          import json, os
          from pathlib import Path
          target=os.environ['TARGET']
          report=json.loads(Path('data/dashboard/wnba_alt_performance.json').read_text())
          calibration=json.loads(Path('data/dashboard/wnba_alt_calibration.json').read_text())
          summary=report.get('summary') or {}
          archived=int(summary.get('archived_candidates') or 0)
          graded=int(summary.get('graded') or 0)
          pending=int(summary.get('pending') or 0)
          if report.get('target_date') != target:
              raise SystemExit(f"ALT performance target mismatch: {report.get('target_date')} != {target}")
          if calibration.get('target_date') != target:
              raise SystemExit(f"ALT calibration target mismatch: {calibration.get('target_date')} != {target}")
          if graded + pending != archived:
              raise SystemExit(f'ALT accounting mismatch: {archived} != {graded}+{pending}')
          live=report.get('live_performance') or {}
          research=report.get('research_archive') or {}
          training=report.get('calibration_training_set') or {}
          if int(live.get('n') or 0) != sum(
              int(r.get('decisions') or 0) for r in (report.get('by_action') or [])
              if str(r.get('group') or '').upper() == 'BET'
          ):
              raise SystemExit('ALT live performance must contain BET decisions only')
          if [r.get('group') for r in (research.get('tiers') or [])] != ['LEAN','WATCH','PASS']:
              raise SystemExit('ALT research tier ordering contract missing')
          if bool(training.get('calibration_ready')) != bool(training.get('qualified_segment_count')):
              raise SystemExit('ALT calibration readiness must derive from independently qualified segments')
          print({
              'target':target,'archived':archived,'graded':graded,'pending':pending,
              'live_bet_n':live.get('n'),'research_tier_order_verified':research.get('tier_order_verified'),
              'calibration_training_rows':calibration.get('graded_training_rows'),
              'side_coverage':calibration.get('side_coverage'),
              'qualified_segments':len(calibration.get('qualified_segments') or []),
          })
          PY

      - name: Persist authoritative calibrated ALT state
        run: |
          git config user.name 'WNBA ALT Market Owner Bot'
          git config user.email 'actions@github.com'
          bash scripts/atomic_generated_push.sh \
            "Refresh canonical WNBA ALT market state for ${TARGET}" \
            'data/history/wnba_alt_streak_history.jsonl' \
            'data/dashboard/wnba_alt_market_warehouse.json' \
            'data/warehouse/wnba_alt_market_warehouse.json' \
            'data/dashboard/wnba_alt_streaks.json' \
            'data/warehouse/wnba_alt_streaks.json' \
            'data/dashboard/wnba_alt_performance.json' \
            'data/warehouse/wnba_alt_performance.json' \
            'data/dashboard/wnba_alt_calibration.json' \
            'data/warehouse/wnba_alt_calibration.json' \
            'data/dashboard/wnba_alt_parlays.json'
