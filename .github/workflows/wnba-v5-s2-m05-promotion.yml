name: WNBA V5 S2 M05 Promotion Engine
on:
  workflow_dispatch:
  schedule:
    - cron: '55 6 * * *'
  push:
    branches: [main]
    paths:
      - 'wnba_v5_ops_sprint2.py'
      - 'data/dashboard/wnba_v5_m12_report.json'
      - 'data/dashboard/wnba_v5_m10_report.json'
      - 'data/dashboard/wnba_alt_archive_health.json'
      - '.github/workflows/wnba-v5-s2-m05-promotion.yml'
concurrency: {group: wnba-v5-s2, cancel-in-progress: false}
jobs:
  v5-s2-m05:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: git pull --rebase origin main
      - run: python -m py_compile wnba_v5_ops_sprint2.py
      - run: python wnba_v5_ops_sprint2.py --module M05
      - name: Verify S2 M05
        run: |
          python - <<'PY'
          import json
          p=json.load(open('data/dashboard/wnba_v5_s2_m05_promotion_engine.json'))
          print(p); assert p['module']=='S2-M05'; assert p['automatic_switch_disabled'] is True
          PY
      - name: Publish
        run: |
          set -euo pipefail
          git config user.name "WNBA V5 S2 Bot"; git config user.email "actions@users.noreply.github.com"
          git add data/dashboard/wnba_v5_s2_m05_promotion_engine.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh V5 S2 M05 promotion engine"; git pull --rebase origin main; git push origin HEAD:main
