name: WNBA V5 S2 M04 Performance Dashboard
on:
  workflow_dispatch:
  schedule:
    - cron: '35 6 * * *'
  push:
    branches: [main]
    paths:
      - 'wnba_v5_ops_sprint2.py'
      - 'data/dashboard/wnba_v5_forward_validation.csv'
      - '.github/workflows/wnba-v5-s2-m04-performance-dashboard.yml'
concurrency: {group: wnba-v5-s2, cancel-in-progress: false}
jobs:
  v5-s2-m04:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: git pull --rebase origin main
      - run: python -m py_compile wnba_v5_ops_sprint2.py
      - run: python wnba_v5_ops_sprint2.py --module M04
      - name: Verify S2 M04
        run: |
          python - <<'PY'
          import json
          p=json.load(open('data/dashboard/wnba_v5_s2_m04_performance_dashboard.json'))
          print(p); assert p['module']=='S2-M04'; assert 'lifetime' in p
          PY
      - name: Publish
        run: |
          set -euo pipefail
          git config user.name "WNBA V5 S2 Bot"; git config user.email "actions@users.noreply.github.com"
          git add data/dashboard/wnba_v5_s2_m04_performance_dashboard.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh V5 S2 M04 performance dashboard"; git pull --rebase origin main; git push origin HEAD:main
