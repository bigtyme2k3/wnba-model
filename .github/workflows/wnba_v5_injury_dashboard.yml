name: WNBA V5 Injury Intelligence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/dashboard/wnba_injury_intelligence.json'
      - 'wnba_injury_refresh.py'
      - '.github/workflows/wnba_v5_injury_dashboard.yml'
  workflow_run:
    workflows:
      - "WNBA Injury Refresh"
      - "WNBA V4 Player Props Polish"
      - "WNBA Postgame Learning Pipeline"
    types: [completed]

concurrency:
  group: wnba-main-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  injury-intelligence:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest repository
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refresh injury intelligence when available
        run: |
          TARGET=$(python active_slate_date.py 2>/dev/null || date -u +%F)
          if [ -f wnba_injury_refresh.py ]; then
            python wnba_injury_refresh.py --date "$TARGET"
          else
            echo 'wnba_injury_refresh.py unavailable; validating existing payload.'
          fi

      - name: Verify injury payload
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/dashboard/wnba_injury_intelligence.json')
          if not p.exists():
              raise SystemExit('Injury intelligence payload missing')
          data=json.load(p.open())
          if not isinstance(data,dict):
              raise SystemExit('Injury intelligence payload must be an object')
          print({'injury_payload':str(p),'keys':sorted(data)[:20]})
          PY

      - name: Publish injury data only
        run: |
          git config user.name "WNBA Injury Intelligence Bot"
          git config user.email "actions@github.com"
          bash scripts/atomic_generated_push.sh \
            "Refresh V5 injury intelligence data" \
            'data/dashboard/wnba_injury_intelligence.json' \
            'data/warehouse/wnba_injury_intelligence.json'
