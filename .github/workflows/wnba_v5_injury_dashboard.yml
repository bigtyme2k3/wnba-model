name: WNBA V5 Injury Intelligence

# Maintenance mode: scheduled polling is paused during the FIBA break.
# This workflow owns injury context only; downstream prediction workflows
# consume the published context and own their own artifacts.
on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Target slate date (YYYY-MM-DD); blank uses active slate'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'scrape_official_wnba_injuries.py'
      - 'scrape_injuries.py'
      - 'wnba_injury_intelligence.py'
      - 'wnba_injury_rotation_guard.py'
      - 'scripts/wnba_new_day_injury_refresh.py'
      - 'active_slate_date.py'
      - 'scripts/check_production_architecture.py'
      - '.github/workflows/wnba_v5_injury_dashboard.yml'

concurrency:
  group: wnba-main-writer
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  injury-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install injury dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests pdfplumber

      - name: Verify production architecture invariants
        run: python scripts/check_production_architecture.py

      - name: Resolve target date
        run: |
          REQUESTED="${{ github.event.inputs.date }}"
          if [ -n "$REQUESTED" ]; then
            TARGET="$REQUESTED"
          else
            TARGET=$(python active_slate_date.py)
          fi
          test -n "$TARGET"
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "Injury target: $TARGET"

      - name: Compile source-only injury stack
        run: |
          python -m py_compile \
            active_slate_date.py \
            scrape_injuries.py \
            scrape_official_wnba_injuries.py \
            wnba_injury_intelligence.py \
            wnba_injury_rotation_guard.py \
            scripts/wnba_new_day_injury_refresh.py

      - name: Refresh source-only injury intelligence
        run: python scripts/wnba_new_day_injury_refresh.py --date "$TARGET"

      - name: Verify injury ownership and freshness
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          target=os.environ['TARGET']
          status=json.loads(Path('data/raw/injuries_status.json').read_text(encoding='utf-8'))
          dash=json.loads(Path('data/dashboard/wnba_injury_intelligence.json').read_text(encoding='utf-8'))
          ware=json.loads(Path('data/warehouse/wnba_injury_intelligence.json').read_text(encoding='utf-8'))

          assert str(status.get('target_date') or '')[:10] == target, status
          assert str(dash.get('target_date') or '')[:10] == target, dash.get('target_date')
          assert str(ware.get('target_date') or '')[:10] == target, ware.get('target_date')
          assert dash.get('source_only') is True
          assert dash.get('canonical_master_mutated') is False
          assert dash.get('canonical_player_props_mutated') is False
          assert dash.get('downstream_prediction_artifacts_mutated') is False
          assert dash.get('downstream_decision_artifacts_mutated') is False
          assert ware.get('source_only') is True

          stamp=status.get('completed_at_utc') or status.get('generated_at_utc')
          assert stamp, status
          age=(datetime.now(timezone.utc)-datetime.fromisoformat(str(stamp).replace('Z','+00:00'))).total_seconds()
          assert 0 <= age < 1800, {'age_seconds':age, **status}

          verified=dash.get('injury_source_verified') is True
          coverage=dash.get('source_coverage')
          if verified:
              assert status.get('primary_source') in {'official_wnba_pdf','espn_fallback'}, status
              assert coverage == 'VERIFIED', coverage
          else:
              assert coverage == 'UNVERIFIED_NO_REPORT_YET', coverage

          assert Path('data/raw/minute_projections.csv').exists()
          print({
              'status':'PASS',
              'target':target,
              'source_only':True,
              'injury_source_verified':verified,
              'source_coverage':coverage,
              'adjustments':len(dash.get('adjustments') or []),
          })
          PY

          if ! git diff --quiet -- \
            data/dashboard/wnba_master.json \
            data/master/wnba_master.json \
            data/dashboard/wnba_player_props.json \
            data/dashboard/wnba_sprint2_predictions.json \
            data/dashboard/wnba_sprint2_phase2.json \
            data/dashboard/wnba_s19_m02_predictions.json \
            data/dashboard/wnba_s19_m02_prediction_audit.json \
            data/history/wnba_game_predictions.jsonl; then
            echo 'Injury source workflow mutated a downstream canonical artifact; refusing publish.' >&2
            git diff -- \
              data/dashboard/wnba_master.json \
              data/master/wnba_master.json \
              data/dashboard/wnba_player_props.json \
              data/dashboard/wnba_sprint2_predictions.json \
              data/dashboard/wnba_sprint2_phase2.json \
              data/dashboard/wnba_s19_m02_predictions.json \
              data/dashboard/wnba_s19_m02_prediction_audit.json \
              data/history/wnba_game_predictions.jsonl
            exit 1
          fi

      - name: Publish injury context only
        run: |
          git config user.name "WNBA Injury Intelligence Bot"
          git config user.email "actions@github.com"
          bash scripts/atomic_generated_push.sh \
            "Refresh source-only WNBA injury intelligence for ${TARGET}" \
            'data/raw/injuries_today.csv' \
            "data/raw/injuries_${TARGET}.csv" \
            'data/raw/injuries_status.json' \
            'data/raw/minute_projections.csv' \
            'data/dashboard/wnba_injury_intelligence.json' \
            'data/warehouse/wnba_injury_intelligence.json'
