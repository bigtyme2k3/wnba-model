name: WNBA V5 Injury Intelligence

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Target slate date (YYYY-MM-DD); blank uses active slate'
        required: false
        default: ''
  schedule:
    - cron: '12,42 * * * *'
  push:
    branches: [main]
    paths:
      - 'scrape_official_wnba_injuries.py'
      - 'scrape_injuries.py'
      - 'wnba_injury_intelligence.py'
      - 'wnba_injury_rotation_guard.py'
      - 'scripts/wnba_sprint2_phase2.py'
      - 'scripts/wnba_s19_m02_prop_source.py'
      - 'scripts/wnba_s19_m02_predictions.py'
      - '.github/workflows/wnba_v5_injury_dashboard.yml'
  workflow_run:
    workflows:
      - "WNBA V4 Player Props Polish"
      - "WNBA Postgame Learning Pipeline"
      - "WNBA Consolidated Hourly Intelligence"
    types: [completed]

concurrency:
  group: wnba-main-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  injury-intelligence:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest repository
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install injury dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests pdfplumber

      - name: Resolve target date
        run: |
          REQUESTED="${{ github.event.inputs.date }}"
          if [ -n "$REQUESTED" ]; then
            TARGET="$REQUESTED"
          else
            TARGET=$(python active_slate_date.py 2>/dev/null || date -u +%F)
          fi
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "Injury target: $TARGET"

      - name: Validate Sprint 19 M01-M02 pipelines
        run: |
          python -m py_compile scrape_injuries.py scrape_official_wnba_injuries.py wnba_injury_intelligence.py wnba_injury_rotation_guard.py scripts/wnba_sprint2_phase2.py scripts/wnba_s19_m02_prop_source.py scripts/wnba_s19_m02_predictions.py

      - name: Refresh official WNBA injury report
        run: |
          python scrape_official_wnba_injuries.py --date "$TARGET" --out data/raw

      - name: Verify official injury source freshness
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          import pandas as pd
          status=json.load(open('data/raw/injuries_status.json'))
          assert status.get('target_date') == os.environ['TARGET'], status
          stamp=status.get('completed_at_utc') or status.get('generated_at_utc')
          assert stamp, status
          age=(datetime.now(timezone.utc)-datetime.fromisoformat(stamp.replace('Z','+00:00'))).total_seconds()
          assert 0 <= age < 1800, {'age_seconds':age, **status}
          assert status.get('primary_source') in {'official_wnba_pdf','espn_fallback'}, status
          path=Path('data/raw/injuries_today.csv')
          assert path.exists(), path
          frame=pd.read_csv(path)
          assert {'player','team','severity','source'}.issubset(frame.columns), frame.columns.tolist()
          print('INJURY FEED FRESH', status)
          PY

      - name: Apply injury intelligence to current slate
        run: |
          python wnba_injury_intelligence.py --date "$TARGET"
          python wnba_injury_rotation_guard.py

      - name: Rebuild Sprint 19 M01 injury-aware game projections
        run: |
          python scripts/wnba_sprint2_phase2.py --date "$TARGET"

      - name: Verify Sprint 19 M01 game projection freshness
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          def dt(value):
              return datetime.fromisoformat(str(value).replace('Z','+00:00'))
          target=os.environ['TARGET']
          injury=json.load(open('data/dashboard/wnba_injury_intelligence.json'))
          games=json.load(open('data/dashboard/wnba_sprint2_phase2.json'))
          assert injury.get('target_date') == target, injury.get('target_date')
          assert games.get('target_date') == target, games.get('target_date')
          assert games.get('schema_version') == 'sprint19-m01-injury-aware-games-v1', games.get('schema_version')
          injury_stamp=injury.get('generated_at_utc') or injury.get('generated_at')
          game_stamp=games.get('generated_at_utc')
          assert injury_stamp and game_stamp, {'injury':injury_stamp,'games':game_stamp}
          assert dt(game_stamp) >= dt(injury_stamp), {'injury':injury_stamp,'games':game_stamp}
          rows=games.get('games',[]) or []
          assert rows, 'No current-slate game cards generated'
          assert all((r.get('injury_context') or {}).get('fresh') is True for r in rows), 'A game card is missing fresh injury context'
          assert all((r.get('injury_context') or {}).get('target_date') == target for r in rows), 'Game injury target mismatch'
          summary=games.get('summary',{}) or {}
          audit={
              'generated_at_utc':datetime.now(timezone.utc).isoformat(),
              'target_date':target,
              'status':'READY',
              'module':'SPRINT19-M01',
              'games':len(rows),
              'injury_context_games':summary.get('injury_context_games',0),
              'injury_adjusted_games':summary.get('injury_adjusted_games',0),
              'listed_injuries_on_slate':summary.get('listed_injuries_on_slate',0),
              'injury_generated_at_utc':injury_stamp,
              'game_projection_generated_at_utc':game_stamp,
              'projection_after_injury_refresh':True,
              'source':'existing_phase2_game_engine_plus_current_injury_intelligence'
          }
          Path('data/dashboard/wnba_s19_m01_game_injury_audit.json').write_text(json.dumps(audit,indent=2)+'\n')
          print('SPRINT 19 M01 VERIFIED', audit)
          PY

      - name: Prepare exact current sportsbook prop source
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python scripts/wnba_s19_m02_prop_source.py --date "$TARGET"

      - name: Build Sprint 19 M02 unified predictions
        run: |
          python scripts/wnba_s19_m02_predictions.py --date "$TARGET"

      - name: Verify Sprint 19 M02 prediction synchronization
        run: |
          python - <<'PY'
          import json, os
          target=os.environ['TARGET']
          source=json.load(open('data/dashboard/wnba_s19_m02_prop_source_audit.json'))
          p=json.load(open('data/dashboard/wnba_s19_m02_predictions.json'))
          a=json.load(open('data/dashboard/wnba_s19_m02_prediction_audit.json'))
          assert source.get('status') == 'READY' and source.get('target_date') == target, source
          assert source.get('all_rows_exact_current_slate') is True, source
          assert source.get('rows',0) > 0, source
          assert p.get('status') == 'READY' and p.get('target_date') == target, p
          assert a.get('status') == 'READY' and a.get('target_date') == target, a
          assert a.get('game_projection_after_injury_refresh') is True, a
          assert a.get('actionable_out_props') == 0, a
          assert a.get('phase2_best_bets_fallback_enabled') is False, a
          assert a.get('player_prop_predictions',0) > 0, a
          assert a.get('player_props_with_model_projection') == a.get('player_prop_predictions'), a
          assert a.get('off_slate_prop_rows_rejected') == 0, a
          assert a.get('all_rendered_props_exact_current_slate') is True, a
          print('SPRINT 19 M02 VERIFIED', a)
          PY

      - name: Verify Player Props injury integration
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          target=os.environ['TARGET']
          injury_path=Path('data/dashboard/wnba_injury_intelligence.json')
          master_path=Path('data/dashboard/wnba_master.json')
          assert injury_path.exists(), injury_path
          assert master_path.exists(), master_path
          injury=json.load(injury_path.open())
          master=json.load(master_path.open())
          assert injury.get('target_date') == target, injury.get('target_date')
          assert str(master.get('target_date',''))[:10] == target, master.get('target_date')
          adjustments=injury.get('adjustments',[]) or []
          props=master.get('props',[]) or []
          out_names={str(a.get('player','')).strip().lower() for a in adjustments if a.get('is_out')}
          adjusted=[p for p in props if p.get('injury_adjusted')]
          out_props=[p for p in props if str(p.get('player','')).strip().lower() in out_names]
          actionable_out=[p for p in out_props if p.get('eligible',p.get('eligible_for_bet',True)) and str(p.get('final_action') or p.get('recommendation') or '').upper() not in {'PASS','BLOCK','SKIP'}]
          assert not actionable_out, {'actionable_out_players':[p.get('player') for p in actionable_out]}
          audit={
            'generated_at_utc':datetime.now(timezone.utc).isoformat(),
            'target_date':target,
            'status':'READY',
            'injury_adjustments':len(adjustments),
            'props_total':len(props),
            'props_injury_adjusted':len(adjusted),
            'out_players_on_report':len(out_names),
            'out_player_prop_rows':len(out_props),
            'actionable_out_prop_rows':len(actionable_out),
            'player_props_master_persisted':True,
            'source':'existing_wnba_injury_intelligence_pipeline'
          }
          Path('data/dashboard/wnba_injury_integration_audit.json').write_text(json.dumps(audit,indent=2)+'\n')
          print('PLAYER PROPS INJURY INTEGRATION VERIFIED', audit)
          PY

      - name: Publish Sprint 19 M01-M02 outputs safely
        run: |
          git config user.name "WNBA Injury Intelligence Bot"
          git config user.email "actions@github.com"
          bash scripts/atomic_generated_push.sh \
            "Sprint 19 M02 refresh unified injury-aware predictions" \
            'data/raw/injuries_today.csv' \
            'data/raw/injuries_status.json' \
            'data/raw/minute_projections.csv' \
            'data/raw/props_today.csv' \
            "data/raw/props_raw_${TARGET}.csv" \
            'data/raw/player_points_today.csv' \
            "data/raw/player_points_${TARGET}.csv" \
            'data/dashboard/wnba_injury_intelligence.json' \
            'data/warehouse/wnba_injury_intelligence.json' \
            'data/dashboard/wnba_injury_integration_audit.json' \
            'data/dashboard/wnba_master.json' \
            'data/dashboard/wnba_sprint2_phase2.json' \
            'data/dashboard/wnba_s19_m01_game_injury_audit.json' \
            'data/dashboard/wnba_s19_m02_prop_source_audit.json' \
            'data/dashboard/wnba_s19_m02_predictions.json' \
            'data/dashboard/wnba_s19_m02_prediction_audit.json'
