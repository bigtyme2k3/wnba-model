name: WNBA V5 Player Prop Shadow Monitor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/dashboard/wnba_v5_player_prop_action_policy_v2.json'
      - 'patch_dashboard_v5_player_prop_shadow_monitor.py'

permissions:
  contents: read

concurrency:
  group: wnba-v5-player-prop-shadow-monitor
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify shadow policy source and renderer
        run: |
          python -m py_compile patch_dashboard_v5_player_prop_shadow_monitor.py
          python - <<'PY'
          import json
          from pathlib import Path
          source=Path('data/dashboard/wnba_v5_player_prop_action_policy_v2.json')
          if not source.exists(): raise SystemExit('shadow policy source missing')
          payload=json.loads(source.read_text(encoding='utf-8'))
          renderer=Path('patch_dashboard_v5_player_prop_shadow_monitor.py').read_text(encoding='utf-8')
          required=['minimum_resolved_for_review']
          missing=[x for x in required if x not in renderer and x not in json.dumps(payload)]
          if missing: raise SystemExit(f'shadow monitor contract missing: {missing}')
          print({'status':'PASS','mode':'data-only-audit','dashboard_writer':False})
          PY
      - name: Enforce canonical dashboard ownership
        run: |
          git diff --exit-code -- docs/index.html
          echo 'Shadow monitor does not render or publish docs; canonical Deploy WNBA Dashboard owns presentation.'
