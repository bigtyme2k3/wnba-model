name: WNBA Sprint 20 Phase 4 Opportunity Finder

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Target date (YYYY-MM-DD), blank for active slate'
        required: false
        default: ''
  workflow_run:
    workflows: ['WNBA Sprint 20 Phase 3 Market Movement']
    types: [completed]

concurrency:
  group: wnba-sprint20-phase4-opportunity-finder
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  build-opportunity-finder:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest repository
        run: git pull --rebase origin main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install -r requirements.txt
      - name: Resolve target date
        run: |
          set -euo pipefail
          TARGET=$(python active_slate_date.py --date "${{ github.event.inputs.date }}")
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
      - name: Validate Phase 4 code
        run: |
          set -euo pipefail
          python -m py_compile wnba_opportunity_finder.py qa_sprint20_phase4_opportunity_finder.py
          python qa_sprint20_phase4_opportunity_finder.py
      - name: Build opportunity finder
        run: |
          set -euo pipefail
          python wnba_opportunity_finder.py --date "$TARGET"
      - name: Verify artifacts
        run: |
          set -euo pipefail
          test -s data/warehouse/opportunity_finder.json
          test -s data/dashboard/opportunity_finder.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('data/warehouse/opportunity_finder.json').read_text())
          required={'scanned_opportunities','strong_bets','bets','leans','passes','positive_ev','market_inefficiencies','arbitrage_opportunities','near_arbitrage_opportunities','middle_opportunities','inserted_history_records','updated_history_records'}
          missing=required-set(report.get('summary',{}))
          assert not missing,missing
          rows=report.get('all_opportunities',[])
          assert [r.get('finder_rank') for r in rows]==list(range(1,len(rows)+1))
          order=[(bool(r.get('actionable')),float(r.get('opportunity_index') or 0),float(r.get('expected_value') or -999)) for r in rows]
          assert order==sorted(order,reverse=True),order[:10]
          assert all(r.get('recommendation') in {'STRONG BET','BET','LEAN','PASS'} for r in rows)
          print('Sprint 20 Phase 4 verification passed:',report['summary'])
          PY
      - name: Commit Phase 4 artifacts
        run: |
          set -euo pipefail
          git config user.name 'WNBA Model Bot'
          git config user.email 'actions@github.com'
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git add data/history/opportunity_finder_history.jsonl data/warehouse/opportunity_finder.json data/dashboard/opportunity_finder.json
          if ! git diff --quiet; then git add -u data/history data/warehouse data/dashboard; fi
          git diff --cached --quiet && echo 'No opportunity finder changes' && exit 0
          git commit -m "Update WNBA opportunity finder - ${TARGET}"
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          test -z "$(git status --porcelain)" || { git status --short; exit 1; }
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then echo "Pushed on attempt $attempt"; exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
