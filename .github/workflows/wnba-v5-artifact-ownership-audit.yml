name: WNBA V5 Artifact Ownership Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/wnba_v5_artifact_ownership_audit.py'
      - 'docs/V5_ARTIFACT_OWNERSHIP.md'
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'

permissions:
  contents: write

concurrency:
  group: wnba-v5-artifact-ownership-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile audit
        run: python -m py_compile scripts/wnba_v5_artifact_ownership_audit.py
      - name: Inventory active workflow ownership
        run: python scripts/wnba_v5_artifact_ownership_audit.py
      - name: Show consolidation targets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/dashboard/wnba_v5_artifact_ownership_audit.json').read_text())
          print({'status':p['status'],'multiple_publisher_count':p['multiple_publisher_count'],'active_workflows':p['active_workflow_count']})
          for item in p.get('multiple_publishers') or []:
              print(item['domain'], item['artifact'])
              for wf in item['publish_workflows']:
                  print('  -', wf)
          PY
      - name: Publish inventory report safely
        run: |
          set -euo pipefail
          git config user.name 'WNBA V5 Ownership Audit Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/dashboard/wnba_v5_artifact_ownership_audit.json data/dashboard/wnba_v5_artifact_ownership_audit.csv
          if git diff --cached --quiet; then
            echo 'Artifact ownership inventory already current'
            exit 0
          fi
          git commit -m 'Refresh V5 artifact ownership inventory'
          for attempt in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep $((attempt*3))
          done
          exit 1
