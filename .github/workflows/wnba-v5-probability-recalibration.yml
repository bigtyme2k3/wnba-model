name: WNBA V5 Probability Recalibration
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wnba_v5_probability_recalibration.py'
      - 'data/history/wnba_v5_forward_predictions.jsonl'
      - 'data/dashboard/wnba_v5_live_inference.json'
      - '.github/workflows/wnba-v5-probability-recalibration.yml'
jobs:
  recalibrate-v5:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: v5-probability-recalibration
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync latest repository
        run: git pull --rebase origin main
      - name: Compile recalibration engine
        run: python -m py_compile wnba_v5_probability_recalibration.py
      - name: Build shadow recalibration
        run: python wnba_v5_probability_recalibration.py
      - name: Verify shadow recalibration
        run: |
          python - <<'PY'
          import json
          p=json.load(open('data/dashboard/wnba_v5_probability_recalibration.json'))
          print(p)
          assert p['module']=='PROBABILITY_RECALIBRATION'
          assert p['research_only'] is True
          assert p['production_ready'] is False
          assert p['status'] in {'READY_SHADOW','WAITING_FOR_100_CANONICAL_FORWARD_ROWS'}
          if p['status']=='READY_SHADOW':
              assert p['canonical_resolved_rows'] >= 100
              assert 0.0 <= p['global_alpha'] <= 1.0
          PY
      - name: Publish recalibration outputs safely
        run: |
          set -euo pipefail
          git config user.name "WNBA V5 Recalibration Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/dashboard/wnba_v5_probability_recalibration.json data/dashboard/wnba_v5_live_inference_recalibrated_shadow.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh WNBA V5 shadow probability recalibration"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt*2))
          done
          exit 1
