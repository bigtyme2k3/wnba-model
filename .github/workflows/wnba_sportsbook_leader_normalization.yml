name: WNBA Sportsbook Leader Normalization (Sprint 17 Commit 3.1)

on:
  workflow_dispatch:
  schedule:
    - cron: '25 */3 * * *'

concurrency:
  group: wnba-sportsbook-leader-normalization
  cancel-in-progress: false

jobs:
  normalize-sportsbook-leader:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate source code
        run: python -m py_compile wnba_market_timeline.py wnba_line_movement_engine.py wnba_clv_intelligence.py wnba_sportsbook_leader_normalization.py qa_sportsbook_leader_normalization.py

      - name: Refresh prerequisite market intelligence
        run: |
          python wnba_market_timeline.py
          python wnba_line_movement_engine.py
          python wnba_clv_intelligence.py

      - name: Normalize sportsbook leader timing
        run: python wnba_sportsbook_leader_normalization.py

      - name: Verify normalized sportsbook timing
        run: python qa_sportsbook_leader_normalization.py

      - name: Show normalized sportsbook leader summary
        run: cat data/dashboard/wnba_sportsbook_leader_normalized_summary.json

      - name: Commit normalized sportsbook intelligence
        run: |
          git config user.name 'WNBA Sportsbook Normalization Bot'
          git config user.email 'actions@github.com'
          git add \
            data/market/market_snapshots.json \
            data/market/market_timeline.json \
            data/market/closing_lines.json \
            data/market/line_movements.json \
            data/market/sportsbook_movements.json \
            data/market/market_volatility.json \
            data/market/clv_results.json \
            data/market/sportsbook_clv.json \
            data/market/player_clv.json \
            data/market/team_clv.json \
            data/market/market_clv.json \
            data/market/clv_leaderboard.json \
            data/forecast/sportsbook_leader_normalized.json \
            data/dashboard/wnba_market_timeline_summary.json \
            data/dashboard/wnba_line_movement_summary.json \
            data/dashboard/wnba_clv_summary.json \
            data/dashboard/wnba_sportsbook_leader_normalized_summary.json
          if git diff --cached --quiet; then
            echo 'No normalized sportsbook leader changes to commit.'
            exit 0
          fi
          git commit -m 'Refresh normalized WNBA sportsbook leader intelligence'
          git pull --rebase origin main
          git push origin HEAD:main
