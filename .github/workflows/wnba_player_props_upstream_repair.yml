name: WNBA Player Props Upstream Repair

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/player_props_upstream_repair_request.txt'
      - 'data/player_props_canonical_renderer_request_*.txt'

permissions:
  contents: write

concurrency:
  group: wnba-main-writer
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: America/New_York
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requests
        run: python -m pip install requests
      - name: Resolve target date
        run: echo "TARGET=$(TZ=America/New_York date +%F)" >> "$GITHUB_ENV"
      - name: Ingest current-slate player props
        run: python wnba_player_props_ingestion.py --date "$TARGET"
      - name: Rebuild dashboard and install canonical Player Props renderer
        run: |
          [ ! -f build_dashboard_v4.py ] || python build_dashboard_v4.py
          [ ! -f patch_dashboard_v4_games_markets.py ] || python patch_dashboard_v4_games_markets.py
          [ ! -f patch_dashboard_v4_consistency.py ] || python patch_dashboard_v4_consistency.py
          [ ! -f patch_dashboard_v4_live_slate.py ] || python patch_dashboard_v4_live_slate.py
          [ ! -f patch_dashboard_v4_portfolio_ai.py ] || python patch_dashboard_v4_portfolio_ai.py
          [ ! -f patch_dashboard_navigation_v2.py ] || python patch_dashboard_navigation_v2.py
          python patch_dashboard_v4_player_props_truth.py
          python patch_dashboard_v4_player_props_canonical_runtime.py
      - name: Validate canonical current-slate prop renderer
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          target=os.environ['TARGET']
          ing=json.loads(Path('data/dashboard/wnba_player_props.json').read_text())
          truth=json.loads(Path('data/dashboard/wnba_player_props_current_slate.json').read_text())
          assert ing.get('target_date')==target
          assert truth.get('target_date')==target
          assert truth.get('source_file')=='data/dashboard/wnba_player_props.json'
          assert truth.get('active_count',0)>0, 'No current-slate player props were ingested'
          for row in truth['rows']:
              assert row.get('game') in truth['current_games']
              assert row.get('team') in truth['current_teams']
          html=Path('docs/index.html').read_text()
          assert 'v4-player-props-canonical-runtime' in html
          assert 'window.WNBA_CANONICAL_PLAYER_PROPS' in html
          assert 'function propData(){return A(window.WNBA_CANONICAL_PLAYER_PROPS||[])}' in html
          assert "function playerTeam(r){return String(r.team||r.player_team" in html
          assert 'function playerTeam(r){let g=' not in html
          assert 'function histVals(r,n=5){let base=' not in html
          assert 'Toronto Tempo @ Golden State Valkyries' not in json.dumps(truth['rows'])
          print({'target':target,'events':ing.get('event_count'),'ingested':ing.get('row_count'),'active':truth.get('active_count'),'excluded':truth.get('excluded_count')})
          PY
      - name: Publish repaired player props
        run: |
          git config user.name 'WNBA Player Props Upstream Repair Bot'
          git config user.email 'actions@github.com'
          git add data/dashboard/wnba_player_props.json \
                  data/dashboard/wnba_player_props_current_slate.json \
                  data/raw/wnba_player_props_${TARGET}.json \
                  docs/index.html
          if git diff --cached --quiet; then
            echo 'No player-prop changes to publish'
            exit 0
          fi
          git commit -m "Consolidate Player Props onto canonical Odds API source for ${TARGET}"
          git stash push -u -m player-props-upstream-untracked || true
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep $((attempt*3))
          done
          exit 1
