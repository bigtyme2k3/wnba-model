name: WNBA V5 S3 M02 Explicit Closing Capture
on:
  workflow_dispatch:
  # MAINTENANCE MODE: ten-minute live closing capture paused during the 2026 FIBA break.
  # workflow_dispatch remains available for controlled QA.
  push:
    branches: [main]
    paths:
      - 'wnba_v5_s3_m02_closing_capture.py'
      - 'data/dashboard/wnba_v5_s3_m01_freshness.json'
      - 'data/dashboard/wnba_v5_live_inference.json'
      - 'data/dashboard/wnba_sprint2_phase2.json'
      - '.github/workflows/wnba-v5-s3-m02-closing-capture.yml'

concurrency:
  group: wnba-v5-s3-m02-closing-capture
  cancel-in-progress: false

jobs:
  v5-s3-m02:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      V5_CLOSE_WINDOW_MIN: '15'
      V5_CLOSE_BOOKMAKERS: 'fanduel,draftkings,fanatics'
      ODDS_API_MIN_REMAINING: '1500'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync latest repository
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Compile M02 capture engine
        run: python -m py_compile wnba_v5_s3_m02_closing_capture.py

      - name: Verify current capture inputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          fresh=json.loads(Path('data/dashboard/wnba_v5_s3_m01_freshness.json').read_text())
          inference=json.loads(Path('data/dashboard/wnba_v5_live_inference.json').read_text())
          schedule=json.loads(Path('data/dashboard/wnba_sprint2_phase2.json').read_text())
          target=str(fresh.get('current_date_et') or '')[:10]
          assert target, 'M02 freshness target missing'
          assert fresh.get('status') in {'FRESH','EMPTY_CURRENT_SLATE'}, fresh
          inf_target=str(inference.get('target_date') or '')[:10]
          assert inf_target == target, (inf_target,target)
          games=schedule.get('games') or []
          print({'target':target,'freshness':fresh.get('status'),'scored_rows':len(inference.get('scored') or []),'schedule_games':len(games)})
          PY

      - name: Capture eligible explicit closing observations
        run: python wnba_v5_s3_m02_closing_capture.py

      - name: Verify Sprint 3 M02
        run: |
          python - <<'PY'
          import csv,json
          p=json.load(open('data/dashboard/wnba_v5_s3_m02_report.json'))
          fresh=json.load(open('data/dashboard/wnba_v5_s3_m01_freshness.json'))
          print(p)
          assert p['module']=='S3-M02'
          assert p['status'] in {
            'BLOCKED_STALE_SLATE','WAITING_FOR_M11_SCORES','WAITING_FOR_ODDS_API_KEY',
            'WAITING_FOR_CLOSE_WINDOW','NO_MATCHING_PROP_MARKETS','CAPTURED_EXPLICIT_CLOSES'
          }
          if fresh.get('allow_live_inference'):
            assert p['status'] != 'BLOCKED_STALE_SLATE', (fresh,p)
          rows=list(csv.DictReader(open('data/dashboard/wnba_v5_closing_lines.csv',encoding='utf-8-sig')))
          for r in rows:
            assert r['capture_class']=='EXPLICIT_PRETIP_CLOSE'
            assert r['is_explicit_close'].lower() in {'true','1'}
            assert float(r['minutes_to_tip']) >= 0
            assert float(r['minutes_to_tip']) <= float(p['close_window_minutes'])
          print({'explicit_close_rows':len(rows),'new_close_rows':p.get('new_close_rows'),'api_calls':p.get('api_calls'),'status':p.get('status')})
          PY

      - name: Publish M02 capture outputs atomically
        run: |
          git config user.name "WNBA V5 S3 M02 Bot"
          git config user.email "actions@users.noreply.github.com"
          bash scripts/atomic_generated_push.sh \
            "Refresh WNBA V5 M02 explicit closing capture" \
            data/dashboard/wnba_v5_closing_lines.csv \
            data/dashboard/wnba_v5_closing_snapshot.json \
            data/dashboard/wnba_v5_clv_queue.json \
            data/dashboard/wnba_v5_s3_m02_report.json
