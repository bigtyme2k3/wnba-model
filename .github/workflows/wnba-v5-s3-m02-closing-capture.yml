name: WNBA V5 S3 M02 Explicit Closing Capture
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - 'wnba_v5_current_opportunity_board.py'
      - 'wnba_v5_s3_m01_freshness_guard.py'
      - 'wnba_v5_m11_live_inference.py'
      - 'wnba_v5_m12_postgame_learning.py'
      - 'wnba_v5_adaptive_challenger_v2.py'
      - 'wnba_v5_s3_m02_closing_capture.py'
      - 'data/dashboard/wnba_player_props.json'
      - 'data/dashboard/wnba_v5_s3_m01_freshness.json'
      - 'data/dashboard/wnba_v5_matchup_adjustments.csv'
      - 'data/dashboard/wnba_v5_lineup_adjustments.csv'
      - '.github/workflows/wnba-v5-s3-m02-closing-capture.yml'

concurrency:
  group: wnba-v5-s3-m02-closing-capture
  cancel-in-progress: true

jobs:
  v5-s3-m02:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      V5_CLOSE_WINDOW_MIN: '15'
      V5_CLOSE_BOOKMAKERS: 'fanduel,draftkings,fanatics'
      ODDS_API_MIN_REMAINING: '1500'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync latest repository
        run: git pull --rebase origin main

      - name: Compile Sprint 3 M02 context and capture engines
        run: |
          python -m py_compile wnba_v5_current_opportunity_board.py
          python -m py_compile wnba_v5_s3_m01_freshness_guard.py
          python -m py_compile wnba_v5_m11_live_inference.py
          python -m py_compile wnba_v5_m12_postgame_learning.py
          python -m py_compile wnba_v5_adaptive_challenger_v2.py
          python -m py_compile wnba_v5_s3_m02_closing_capture.py

      - name: Refresh current-slate inference context
        run: |
          set -euo pipefail
          python wnba_v5_current_opportunity_board.py
          python wnba_v5_s3_m01_freshness_guard.py
          python wnba_v5_m11_live_inference.py
          python wnba_v5_m12_postgame_learning.py
          python wnba_v5_adaptive_challenger_v2.py
          python - <<'PY'
          import json
          from pathlib import Path
          board=json.load(open('data/warehouse/wnba_opportunity_rankings.json'))
          fresh=json.load(open('data/dashboard/wnba_v5_s3_m01_freshness.json'))
          props=json.load(open('data/dashboard/wnba_player_props.json'))
          m11=json.load(open('data/dashboard/wnba_v5_m11_report.json'))
          m12=json.load(open('data/dashboard/wnba_v5_m12_report.json'))
          adaptive=json.load(open('data/dashboard/wnba_v5_adaptive_challenger_v2.json'))
          target=str(props.get('target_date') or '')[:10]
          assert target, 'canonical player-prop target date missing'
          assert str(board.get('target_date') or '')[:10] == target, (board.get('target_date'), target)
          assert fresh.get('current_date_et') == target, (fresh.get('current_date_et'), target)
          assert fresh.get('status') in {'FRESH','EMPTY_CURRENT_SLATE'}, fresh
          assert m12.get('module') == 'V5-M12', m12
          assert adaptive.get('module') == 'ADAPTIVE_CHALLENGER_V2', adaptive
          assert adaptive.get('research_only') is True and adaptive.get('production_ready') is False
          assert adaptive.get('status') in {'WAITING_FOR_RESOLVED_CONTEXT_ROWS','READY_CONTEXTUAL_SHADOW'}
          if m11.get('status') == 'READY_SHADOW' and m11.get('scored_rows',0) > 0:
              ledger=Path('data/history/wnba_v5_forward_predictions.jsonl')
              assert ledger.exists() and ledger.stat().st_size > 0
          print({'target':target,'freshness':fresh.get('status'),'ranked_rows':fresh.get('ranked_rows'),'m12_new':m12.get('new_predictions_appended'),'context_rows':(m12.get('context_snapshot') or {}).get('rows_with_frozen_context'),'adaptive_resolved_context':adaptive.get('resolved_context_rows'),'adaptive_pending_context':adaptive.get('pending_context_rows')})
          PY

      - name: Capture eligible explicit closing observations
        run: python wnba_v5_s3_m02_closing_capture.py

      - name: Verify Sprint 3 M02
        run: |
          python - <<'PY'
          import csv,json
          p=json.load(open('data/dashboard/wnba_v5_s3_m02_report.json'))
          fresh=json.load(open('data/dashboard/wnba_v5_s3_m01_freshness.json'))
          print(p)
          assert p['module']=='S3-M02'
          assert p['status'] in {
            'BLOCKED_STALE_SLATE','WAITING_FOR_M11_SCORES','WAITING_FOR_ODDS_API_KEY',
            'WAITING_FOR_CLOSE_WINDOW','NO_MATCHING_PROP_MARKETS','CAPTURED_EXPLICIT_CLOSES'
          }
          if fresh.get('allow_live_inference'):
            assert p['status'] != 'BLOCKED_STALE_SLATE', (fresh,p)
          rows=list(csv.DictReader(open('data/dashboard/wnba_v5_closing_lines.csv',encoding='utf-8-sig')))
          for r in rows:
            assert r['capture_class']=='EXPLICIT_PRETIP_CLOSE'
            assert r['is_explicit_close'].lower() in {'true','1'}
            assert float(r['minutes_to_tip']) >= 0
            assert float(r['minutes_to_tip']) <= float(p['close_window_minutes'])
          if p['status']=='BLOCKED_STALE_SLATE':
            assert p['api_calls']==0
          print('explicit_close_rows',len(rows))
          PY

      - name: Publish Sprint 3 M02 safely
        run: |
          set -euo pipefail
          git config user.name "WNBA V5 S3 M02 Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            data/warehouse/wnba_opportunity_rankings.json \
            data/dashboard/wnba_opportunity_rankings.json \
            data/dashboard/wnba_v5_s3_m01_freshness.json \
            data/dashboard/wnba_v5_current_slate.json \
            data/dashboard/wnba_v5_stale_game_report.json \
            data/dashboard/wnba_v5_slate_validation.json \
            data/dashboard/wnba_v5_schedule_health.json \
            data/dashboard/wnba_v5_live_inference.json \
            data/dashboard/wnba_v5_live_inference.csv \
            data/dashboard/wnba_v5_m11_report.json \
            data/history/wnba_v5_forward_predictions.jsonl \
            data/dashboard/wnba_v5_forward_validation.csv \
            data/dashboard/wnba_v5_forward_metrics.json \
            data/dashboard/wnba_v5_learning_state.json \
            data/dashboard/wnba_v5_m12_report.json \
            data/dashboard/wnba_v5_adaptive_challenger_v2.json \
            data/dashboard/wnba_v5_closing_lines.csv \
            data/dashboard/wnba_v5_closing_snapshot.json \
            data/dashboard/wnba_v5_clv_queue.json \
            data/dashboard/wnba_v5_s3_m02_report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh WNBA V5 Sprint 3 M02 closing capture"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
