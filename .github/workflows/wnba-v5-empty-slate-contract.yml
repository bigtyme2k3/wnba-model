name: WNBA V5 Slate Contract QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tests/test_v5_empty_slate_contract.py'
      - 'tests/test_v5_active_slate_contract.py'
      - 'scripts/wnba_s19_m02_prop_source.py'
      - 'scripts/wnba_s19_m02_predictions.py'
      - '.github/workflows/wnba-v5-empty-slate-contract.yml'

permissions:
  contents: read

concurrency:
  group: wnba-v5-slate-contract-qa
  cancel-in-progress: true

jobs:
  slate-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated test dependencies
        run: python -m pip install --disable-pip-version-check pandas requests
      - name: Compile slate contract paths
        run: |
          python -m py_compile \
            scripts/wnba_s19_m02_prop_source.py \
            scripts/wnba_s19_m02_predictions.py \
            tests/test_v5_empty_slate_contract.py \
            tests/test_v5_active_slate_contract.py
      - name: Prove confirmed empty slate is side-effect safe
        run: python tests/test_v5_empty_slate_contract.py
      - name: Simulate active slate without paid API
        run: python tests/test_v5_active_slate_contract.py
      - name: Enforce repository immutability
        run: |
          if ! git diff --quiet; then
            echo 'V5 slate contract QA mutated repository files.' >&2
            git status --short
            git diff
            exit 1
          fi
          echo 'PASS: empty and active-slate simulations left repository production data untouched.'
