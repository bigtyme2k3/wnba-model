name: WNBA ALT Snapshot Writer

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: Optional Eastern slate date (YYYY-MM-DD)
        required: false
        type: string
  schedule:
    - cron: '30 16 * * *'
    - cron: '30 20 * * *'
  push:
    branches: [main]
    paths:
      - 'wnba_alt_performance_tracker.py'
      - 'wnba_alt_market_warehouse.py'
      - 'wnba_alt_streaks.py'
      - 'wnba_alt_streak_confidence.py'
      - 'scripts/scrape_odds_props_consensus.py'
      - '.github/workflows/wnba_alt_snapshot_writer.yml'

permissions:
  contents: write

concurrency:
  group: wnba-main-writer
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: America/New_York
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas requests

      - name: Resolve Eastern target date
        run: |
          MANUAL='${{ inputs.target_date }}'
          if [ -n "$MANUAL" ]; then TARGET="$MANUAL"; else TARGET=$(python active_slate_date.py); fi
          test -n "$TARGET"
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "ALT snapshot target: $TARGET"

      - name: Compile ALT writer chain
        run: |
          python -m py_compile \
            wnba_alt_market_warehouse.py \
            wnba_alt_streaks.py \
            wnba_alt_streak_confidence.py \
            wnba_alt_performance_tracker.py \
            scripts/scrape_odds_props_consensus.py

      - name: Refresh exact ALT market inputs
        run: |
          set -e
          if [ -n "${ODDS_API_KEY:-}" ]; then
            python scripts/scrape_odds_props_consensus.py --date "$TARGET" --out data/raw
          else
            echo 'ODDS_API_KEY unavailable; cached current input required.'
          fi
          python wnba_alt_market_warehouse.py --date "$TARGET"
          python wnba_alt_streaks.py --date "$TARGET"
          python wnba_alt_streak_confidence.py --date "$TARGET"

      - name: Freeze canonical pregame ALT observations
        run: |
          set -e
          python wnba_alt_performance_tracker.py --date "$TARGET" --snapshot
          python wnba_alt_performance_tracker.py --grade
          python wnba_alt_performance_tracker.py --date "$TARGET" --analyze

      - name: Verify persisted accounting
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('data/dashboard/wnba_alt_performance.json').read_text())
          s=report.get('summary') or {}
          archived=int(s.get('archived_candidates') or 0)
          graded=int(s.get('graded') or 0)
          pending=int(s.get('pending') or 0)
          assert graded + pending == archived, (archived,graded,pending)
          assert report.get('status') == 'ok', report.get('status')
          print({'status':'PASS','archived':archived,'graded':graded,'pending':pending})
          PY

      - name: Publish canonical ALT snapshot and analysis
        run: |
          git config user.name 'WNBA ALT Snapshot Bot'
          git config user.email 'actions@github.com'
          bash scripts/atomic_generated_push.sh \
            "Freeze canonical WNBA ALT snapshot for ${TARGET}" \
            'data/history/wnba_alt_streak_history.jsonl' \
            'data/dashboard/wnba_alt_market_warehouse.json' \
            'data/warehouse/wnba_alt_market_warehouse.json' \
            'data/dashboard/wnba_alt_streaks.json' \
            'data/warehouse/wnba_alt_streaks.json' \
            'data/dashboard/wnba_alt_performance.json' \
            'data/warehouse/wnba_alt_performance.json'
