name: WNBA V5 Current Data Health
# Maintenance mode: hourly audit polling is paused; manual and data-triggered
# audits remain available while the pipeline is repaired.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wnba_v5_current_data_health.py'
      - 'data/master/wnba_master.json'
      - 'data/dashboard/wnba_daily_canonical_manifest.json'
      - 'data/dashboard/wnba_player_props.json'
      - 'data/dashboard/wnba_injury_intelligence.json'
      - 'data/dashboard/wnba_v5_m11_report.json'
      - 'data/dashboard/wnba_v5_m12_report.json'
      - 'data/dashboard/wnba_v5_adaptive_challenger_v2.json'
      - 'data/dashboard/wnba_s19_m06_results_lifecycle.json'
      - 'data/dashboard/wnba_alt_performance.json'
      - 'data/dashboard/wnba_v5_matchup_adjustments.csv'
      - 'data/dashboard/wnba_v5_lineup_adjustments.csv'
      - '.github/workflows/wnba-v5-current-data-health.yml'
concurrency:
  group: wnba-v5-current-data-health
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync latest repository
        run: git pull --rebase origin main
      - name: Compile audit
        run: python -m py_compile wnba_v5_current_data_health.py
      - name: Build current-date health report
        run: python wnba_v5_current_data_health.py
      - name: Verify health artifact
        run: |
          python - <<'PY'
          import json
          p=json.load(open('data/dashboard/wnba_v5_current_data_health.json'))
          props=json.load(open('data/dashboard/wnba_player_props.json'))
          manifest=json.load(open('data/dashboard/wnba_daily_canonical_manifest.json'))
          print(p)
          assert p['status'] in {'GREEN','YELLOW','RED'}
          assert p['summary']['critical_checks'] >= 8
          assert p['target_date']
          assert p['target_date'] == str(props.get('target_date') or '')[:10], (p['target_date'],props.get('target_date'))
          assert p['target_date'] == str(manifest.get('target_date') or '')[:10], (p['target_date'],manifest.get('target_date'))
          assert p['target_resolution']['sources']
          PY
      - name: Publish health report safely
        run: |
          set -euo pipefail
          git config user.name "WNBA V5 Data Health Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/dashboard/wnba_v5_current_data_health.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh current WNBA V5 data health"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
