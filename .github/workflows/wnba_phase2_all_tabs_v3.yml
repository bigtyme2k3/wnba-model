name: WNBA Phase 2 All Tabs V3

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/phase2_v3_refresh_request.txt'

permissions:
  contents: write

concurrency:
  group: wnba-main-writer
  cancel-in-progress: false

jobs:
  phase2:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: America/New_York
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest repository
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Resolve Eastern slate date
        run: |
          TARGET=$(TZ=America/New_York date +%F)
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
      - name: Refresh canonical inputs
        run: |
          run_if_present() { [ -f "$1" ] && python "$@" || echo "Skipping unavailable $1"; }
          run_if_present wnba_live_results.py --date "$TARGET"
          run_if_present wnba_schedule_refresh.py --date "$TARGET"
          run_if_present wnba_current_slate.py --date "$TARGET"
          run_if_present wnba_odds_ingestion.py --date "$TARGET"
          run_if_present wnba_player_props_ingestion.py --date "$TARGET"
          run_if_present wnba_injury_refresh.py --date "$TARGET"
      - name: Rebuild Phase 2 canonical data
        run: |
          run_if_present() { [ -f "$1" ] && python "$@" || echo "Skipping unavailable $1"; }
          run_if_present wnba_minutes_projection.py --date "$TARGET"
          run_if_present wnba_unified_simulation.py --date "$TARGET"
          run_if_present wnba_game_prop_intelligence.py --date "$TARGET"
          run_if_present wnba_player_prop_intelligence.py --date "$TARGET"
          run_if_present wnba_daily_edge_engine.py --date "$TARGET"
          run_if_present wnba_ensemble_intelligence_engine.py --date "$TARGET"
          run_if_present wnba_monte_carlo_scenario_engine.py --date "$TARGET"
          run_if_present wnba_best_bets.py --date "$TARGET"
          run_if_present wnba_portfolio_engine.py --date "$TARGET"
          run_if_present wnba_alt_market_watch.py --date "$TARGET"
          run_if_present wnba_alt_streak_engine.py --date "$TARGET"
          run_if_present wnba_remaining_season_intelligence.py
          run_if_present wnba_forward_validation_engine.py --mode freeze --date "$TARGET"
          run_if_present wnba_readiness_engine.py
          run_if_present wnba_production_readiness.py
          run_if_present wnba_v5_current_data_health.py
      - name: Grade results and performance
        run: |
          YESTERDAY=$(TZ=America/New_York date -d yesterday +%F)
          [ ! -f wnba_results_grader.py ] || python wnba_results_grader.py --date "$YESTERDAY" || true
          [ ! -f wnba_forward_validation_engine.py ] || python wnba_forward_validation_engine.py --mode grade --date "$YESTERDAY" || true
          [ ! -f wnba_game_performance_tracker.py ] || { python wnba_game_performance_tracker.py --date "$YESTERDAY" --grade || true; python wnba_game_performance_tracker.py --analyze; }
          [ ! -f wnba_alt_performance_tracker.py ] || { python wnba_alt_performance_tracker.py --date "$YESTERDAY" --grade || true; python wnba_alt_performance_tracker.py --date "$TARGET" --analyze; }
          [ ! -f wnba_alt_pending_diagnostics.py ] || python wnba_alt_pending_diagnostics.py || true
          [ ! -f grade_best_bets.py ] || python grade_best_bets.py || true
      - name: Reassert authoritative current slate
        run: |
          python wnba_current_slate.py --date "$TARGET"
          python - <<'PY'
          import json, os
          from pathlib import Path
          target=os.environ['TARGET']
          master=json.loads(Path('data/dashboard/wnba_master.json').read_text(encoding='utf-8'))
          actual=str(master.get('target_date') or '')
          if actual != target:
              raise SystemExit(f'Final master target mismatch: {actual} != {target}')
          today=[g for g in master.get('games',[]) if str(g.get('bucket','')).lower()=='today']
          if not today:
              raise SystemExit('No current-slate games after reassertion')
          print({'target':target,'today_games':len(today)})
          PY
      - name: Verify all active dashboard tab sources
        run: |
          python scripts/wnba_v5_tab_freshness.py --date "$TARGET"
          python - <<'PY'
          import json, os
          from pathlib import Path
          target=os.environ['TARGET']; root=Path('data/dashboard')
          master=json.loads((root/'wnba_master.json').read_text(encoding='utf-8'))
          if str(master.get('target_date') or '') != target:
              raise SystemExit('Master target mismatch')
          today=[g for g in master.get('games',[]) if str(g.get('bucket','')).lower()=='today']
          if not today:
              raise SystemExit('No current-slate games after reassertion')
          p=json.loads((root/'wnba_tab_freshness.json').read_text(encoding='utf-8'))
          ui=p.get('ui_tabs') or {}
          expected={'games','game-performance','matchups','props','alt-props','sportsbooks','best','ai','live','remaining','results','portfolio','health'}
          missing=sorted(expected-set(ui))
          inactive={k:v for k,v in ui.items() if v.get('activity') not in {'active','degraded'}}
          print(json.dumps({
              'target':target,
              'today_games':len(today),
              'ui_summary':p.get('ui_summary'),
              'missing_routes':missing,
              'inactive_routes':inactive,
          },indent=2))
          if missing:
              raise SystemExit('Missing UI tab activity entries: '+', '.join(missing))
          if inactive:
              raise SystemExit('Inactive UI tab sources: '+', '.join(sorted(inactive)))
          if not (p.get('ui_summary') or {}).get('all_tabs_active'):
              raise SystemExit('All-tabs activity contract not satisfied')
          PY
      - name: Publish Phase 2 data atomically
        run: |
          git config user.name 'WNBA Phase 2 Bot'
          git config user.email 'actions@github.com'
          bash scripts/atomic_generated_push.sh \
            "Complete Phase 2 data rebuild for ${TARGET}" \
            data/dashboard data/wnba data/warehouse data/market data/forecast data/trends
      - name: Note dashboard deployment handoff
        run: echo 'Deploy WNBA Dashboard is the only workflow responsible for rebuilding docs/index.html.'
