name: WNBA V5 M12 Post-Game Learning
on:
  workflow_dispatch:
  schedule:
    - cron: '37 11 * * *'
  push:
    branches: [main]
    paths:
      - 'wnba_v5_m12_postgame_learning.py'
      - 'data/dashboard/wnba_v5_live_inference.json'
      - 'data/dashboard/wnba_v5_historical_features.csv'
      - '.github/workflows/wnba-v5-m12-postgame-learning.yml'
jobs:
  build-v5-m12:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync latest repository
        run: git pull --rebase origin main
      - name: Compile V5 M12 engine
        run: python -m py_compile wnba_v5_m12_postgame_learning.py
      - name: Capture and grade forward V5 predictions
        run: python wnba_v5_m12_postgame_learning.py
      - name: Verify V5 M12
        run: |
          python - <<'PY'
          import json
          p=json.load(open('data/dashboard/wnba_v5_m12_report.json'))
          print(p)
          assert p['module']=='V5-M12'
          assert p['status'] in {'READY_FORWARD_LEARNING','WAITING_FOR_CERTIFIED_OUTCOMES','WAITING_FOR_M11_PREDICTIONS'}
          assert p['promotion_gate']['minimum_forward_rows']==300
          assert p['promotion_gate']['minimum_explicit_clv_coverage_pct']==60.0
          PY
      - name: Publish V5 M12 safely
        run: |
          set -euo pipefail
          git config user.name "WNBA V5 M12 Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/history/wnba_v5_forward_predictions.jsonl data/dashboard/wnba_v5_forward_validation.csv data/dashboard/wnba_v5_forward_metrics.json data/dashboard/wnba_v5_learning_state.json data/dashboard/wnba_v5_m12_report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh WNBA V5 M12 forward learning outputs"
          git pull --rebase origin main
          git push origin HEAD:main
