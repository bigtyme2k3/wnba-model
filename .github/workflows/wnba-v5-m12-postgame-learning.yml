name: WNBA V5 M12 Post-Game Learning
on:
  workflow_dispatch:
  # MAINTENANCE MODE: hourly learning is paused during the 2026 FIBA break.
  # Manual QA remains available and push-triggered evidence repair is preserved.
  push:
    branches: [main]
    paths:
      - 'wnba_v5_m12_postgame_learning.py'
      - 'data/dashboard/wnba_v5_live_inference.json'
      - 'data/dashboard/wnba_v5_historical_features.csv'
      - 'data/warehouse/wnba_player_game_logs.json'
      - 'data/dashboard/wnba_v5_matchup_adjustments.csv'
      - 'data/dashboard/wnba_v5_lineup_adjustments.csv'
      - 'data/dashboard/wnba_v5_s3_m04_report.json'
      - '.github/workflows/wnba-v5-m12-postgame-learning.yml'
concurrency:
  group: v5-forward-learning-writer
  cancel-in-progress: false
jobs:
  build-v5-m12:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync latest repository
        run: git pull --rebase origin main
      - name: Compile V5 learning chain
        run: |
          python -m py_compile wnba_v5_m12_postgame_learning.py
          python -m py_compile wnba_v5_forward_diagnostics.py
          python -m py_compile wnba_v5_s3_m05_evidence_dashboard.py
      - name: Capture and grade forward V5 predictions
        run: python wnba_v5_m12_postgame_learning.py
      - name: Refresh canonical forward diagnostics
        run: python wnba_v5_forward_diagnostics.py
      - name: Refresh evidence dashboard
        run: python wnba_v5_s3_m05_evidence_dashboard.py
      - name: Verify synchronized V5 evidence
        run: |
          python - <<'PY'
          import json
          m12=json.load(open('data/dashboard/wnba_v5_m12_report.json'))
          diag=json.load(open('data/dashboard/wnba_v5_forward_diagnostics.json'))
          m05=json.load(open('data/dashboard/wnba_v5_s3_m05_report.json'))
          clv=json.load(open('data/dashboard/wnba_v5_s3_m04_report.json'))
          assert m12['module']=='V5-M12'
          assert m12['status'] in {'READY_FORWARD_LEARNING','WAITING_FOR_CERTIFIED_OUTCOMES','WAITING_FOR_M11_PREDICTIONS'}
          assert m12['promotion_gate']['minimum_forward_rows']==300
          assert m12['promotion_gate']['minimum_explicit_clv_coverage_pct']==60.0
          assert abs(float(m12['promotion_gate']['explicit_clv_coverage_pct'])-float(clv.get('explicit_clv_coverage_pct',0))) < 1e-9
          assert diag['module']=='FORWARD_DIAGNOSTICS'
          assert diag['ledger_rows']==m12['metrics']['forward_predictions']
          assert m05['module']=='S3-M05'
          assert m05['progress']['snapshot_ledger_rows_diagnostic_only']==diag['ledger_rows']
          assert m05['progress']['canonical_forward_markets_total']==diag['unique_ranking_keys']
          print('M12 snapshots:',m12['metrics']['forward_predictions'])
          print('Canonical markets:',diag['unique_ranking_keys'])
          print('Canonical graded:',m05['progress']['canonical_graded_forward_markets'])
          print('CLV coverage:',m12['promotion_gate']['explicit_clv_coverage_pct'])
          PY
      - name: Publish synchronized V5 learning outputs
        run: |
          chmod +x scripts/atomic_generated_push.sh
          scripts/atomic_generated_push.sh "Refresh synchronized V5 forward evidence" \
            data/history/wnba_v5_forward_predictions.jsonl \
            data/dashboard/wnba_v5_forward_validation.csv \
            data/dashboard/wnba_v5_forward_metrics.json \
            data/dashboard/wnba_v5_learning_state.json \
            data/dashboard/wnba_v5_m12_report.json \
            data/dashboard/wnba_v5_forward_diagnostics.json \
            data/dashboard/wnba_v5_evidence_dashboard.json \
            data/dashboard/wnba_v5_promotion_meter.json \
            data/dashboard/wnba_v5_evidence_history.csv \
            data/dashboard/wnba_v5_s3_m05_report.json
