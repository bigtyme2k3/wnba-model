name: "WNBA Sprint 22 Legacy Player Recovery"

on:
  workflow_dispatch:
    inputs:
      start_season:
        description: "First legacy season"
        required: true
        default: "2015"
      end_season:
        description: "Last legacy season"
        required: true
        default: "2023"

permissions:
  contents: read

jobs:
  legacy-player-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - name: Install dependencies
        run: pip install pandas requests pyreadr
      - name: Enforce legacy range
        run: |
          test "${{ inputs.end_season }}" -le 2023 || { echo "Legacy recovery is limited to 2015-2023."; exit 1; }
      - name: Attempt isolated legacy recovery
        run: python collect_sprint22_historical_player_native_r.py --start "${{ inputs.start_season }}" --end "${{ inputs.end_season }}" --out data/legacy_recovery
      - name: Inspect recovered files
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          root = Path('data/legacy_recovery')
          for path in sorted(root.glob('wehoop_player_box_*.csv')):
              frame = pd.read_csv(path, dtype=str, low_memory=False)
              print(path.name, {'rows': len(frame), 'columns': list(frame.columns), 'sample': frame.head(2).to_dict('records')})
          PY
      - name: Upload legacy recovery diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint22-legacy-player-recovery-${{ inputs.start_season }}-${{ inputs.end_season }}
          path: |
            data/legacy_recovery/
            data/diagnostics/
          if-no-files-found: warn
          retention-days: 14
