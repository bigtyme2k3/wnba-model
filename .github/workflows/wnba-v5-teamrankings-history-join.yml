name: WNBA V5 TeamRankings History Join
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/dashboard/wnba_v5_teamrankings_historical_features.json'
      - 'data/history/wnba_model_history.jsonl'
      - 'data/raw/scores.csv'
      - 'wnba_v5_teamrankings_history_join.py'
      - '.github/workflows/wnba-v5-teamrankings-history-join.yml'
permissions:
  contents: write
concurrency:
  group: wnba-v5-teamrankings-history-join
  cancel-in-progress: false
jobs:
  join:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Sync latest repository
        run: git pull --rebase origin main
      - name: Compile join
        run: python -m py_compile wnba_v5_teamrankings_history_join.py
      - name: Build audited research join
        run: python wnba_v5_teamrankings_history_join.py
      - name: Verify join contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/dashboard/wnba_v5_teamrankings_history_join.json').read_text())
          assert p['status']=='READY_RESEARCH_JOIN'
          assert p['research_only'] is True and p['production_ready'] is False and p['lookahead_safe'] is True
          assert p['teamrankings_valid_games']==39
          assert p['joined_unique_games']<=39 and p['graded_unique_games']<=p['joined_unique_games']
          assert all(r['graded'] for r in p['graded_rows'])
          print({k:p[k] for k in ('teamrankings_valid_games','history_rows_total','joined_history_rows','graded_join_rows','joined_unique_games','graded_unique_games','challenger_ready')})
          PY
      - name: Publish research join safely
        run: |
          set -euo pipefail
          git config user.name 'WNBA V5 TeamRankings Join Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/dashboard/wnba_v5_teamrankings_history_join.json data/warehouse/teamrankings/joined
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Freeze V5 TeamRankings audited history join'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
