name: WNBA Multi-Source Data Fetch

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Target date (YYYY-MM-DD), leave blank for today'
        required: false
        default: ''
  schedule:
    - cron: '30 12 * * *'

concurrency:
  group: wnba-multi-source-data
  cancel-in-progress: false

jobs:
  fetch-multi-source-wnba-data:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest repository
        run: git pull --rebase origin main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Clone wehoop source
        run: |
          rm -rf /tmp/wehoop
          git clone --depth 1 https://github.com/sportsdataverse/wehoop.git /tmp/wehoop

      - name: Install wehoop dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: /tmp/wehoop
          cache-version: 1
          needs: check
          extra-packages: |
            any::readr
            any::jsonlite

      - name: Install wehoop provider
        run: |
          R CMD INSTALL /tmp/wehoop
          Rscript -e 'stopifnot(requireNamespace("wehoop", quietly=TRUE)); cat("wehoop installed:", as.character(packageVersion("wehoop")), "\n")'

      - name: Resolve active slate date
        run: |
          TARGET="${{ github.event.inputs.date }}"
          if [ -z "$TARGET" ]; then TARGET=$(date -u +%F); fi
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "Using WNBA data target: $TARGET"

      - name: Fetch player stats and boxscores from wehoop
        run: Rscript fetch_wehoop_stats.R --date "${{ env.TARGET }}" --out data/raw

      - name: Install optional sports-skills provider
        id: sports_skills_install
        shell: bash
        run: |
          set +e
          python -m pip install --upgrade pip
          pip install git+https://github.com/machina-sports/sports-skills.git
          rc=$?
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 0 ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "sports-skills installed successfully"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "sports-skills unavailable; primary wehoop data remains valid"
          fi

      - name: Fetch optional supplemental WNBA data
        id: supplemental_fetch
        shell: bash
        env:
          SPORTS_SKILLS_AVAILABLE: ${{ steps.sports_skills_install.outputs.available }}
        run: |
          mkdir -p data/wnba
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          available = os.environ.get('SPORTS_SKILLS_AVAILABLE', 'false').lower() == 'true'
          commands = {
              'scores.json': ['sports-skills', 'wnba', 'get_scoreboard'],
              'injuries.json': ['sports-skills', 'wnba', 'get_injuries'],
              'standings.json': ['sports-skills', 'wnba', 'get_standings', '--season', __import__('datetime').datetime.utcnow().strftime('%Y')],
              'futures.json': ['sports-skills', 'wnba', 'get_futures'],
          }
          results = {}
          out_dir = Path('data/wnba')
          for filename, command in commands.items():
              output_path = out_dir / filename
              if not available:
                  output_path.write_text('{}\n')
                  results[filename] = {'status': 'provider_unavailable', 'exit_code': None}
                  continue
              completed = subprocess.run(command, text=True, capture_output=True, check=False)
              if completed.returncode == 0 and completed.stdout.strip():
                  output_path.write_text(completed.stdout)
                  results[filename] = {'status': 'ok', 'exit_code': 0}
              else:
                  output_path.write_text('{}\n')
                  results[filename] = {
                      'status': 'fetch_failed',
                      'exit_code': completed.returncode,
                      'stderr': completed.stderr.strip()[-500:],
                  }
          Path('data/wnba/supplemental_fetch_status.json').write_text(json.dumps(results, indent=2) + '\n')
          print(json.dumps(results, indent=2))
          PY

      - name: Write source status
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          files = ['scores.json','injuries.json','standings.json','futures.json']
          status = {
            'primary_stats_source': 'sportsdataverse/wehoop',
            'primary_stats_upstream': 'ESPN',
            'supplemental_source': 'sports-skills',
            'supplemental_required': False,
            'checked_at_utc': datetime.now(timezone.utc).isoformat(),
            'files': {}
          }
          for f in files:
            path = os.path.join('data/wnba', f)
            try:
              raw = open(path).read().strip()
              parsed = json.loads(raw or '{}')
              status['files'][f] = {'exists': True, 'bytes': len(raw), 'populated': bool(parsed)}
            except Exception as exc:
              status['files'][f] = {'exists': os.path.exists(path), 'error': str(exc), 'populated': False}
          try:
            status['wehoop'] = json.load(open('data/raw/wehoop_stats_status.json'))
          except Exception as exc:
            status['wehoop'] = {'status': 'error', 'error': str(exc)}
          try:
            status['supplemental_fetch'] = json.load(open('data/wnba/supplemental_fetch_status.json'))
          except Exception as exc:
            status['supplemental_fetch'] = {'status': 'unknown', 'error': str(exc)}
          with open('data/wnba/source_status.json', 'w') as fh:
            json.dump(status, fh, indent=2)
          print(json.dumps(status, indent=2))
          PY

      - name: Validate primary source health
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(Path('data/wnba/source_status.json').read_text())
          wehoop = status.get('wehoop', {})
          if wehoop.get('status') not in {'ok', 'success', 'healthy'}:
              raise SystemExit(f"Primary wehoop source is unhealthy: {wehoop}")
          print('Primary wehoop source is healthy; supplemental source is advisory only.')
          PY

      - name: Commit and push
        run: |
          git config user.name "WNBA Model Bot"
          git config user.email "actions@github.com"
          git add data/wnba/*.json data/raw/wehoop_player_boxscores.csv data/raw/boxscores_wehoop.csv data/raw/boxscores_*.csv data/raw/wnba_players_live.json data/raw/wehoop_stats_status.json
          git diff --cached --quiet && echo "No WNBA source data changes" && exit 0
          git commit -m "Update WNBA stats from wehoop - ${{ env.TARGET }}"
          git pull --rebase origin main
          git push origin main
