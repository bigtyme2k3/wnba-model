name: WNBA V5 Operations Sprint 1
on:
  workflow_dispatch:
  schedule:
    - cron: '20 13 * * *'
    - cron: '10 14 * * 1'
  push:
    branches: [main]
    paths:
      - 'wnba_v5_ops_sprint1.py'
      - 'data/dashboard/wnba_v5_m10_report.json'
      - 'data/dashboard/wnba_v5_m11_report.json'
      - 'data/dashboard/wnba_v5_m12_report.json'
      - 'data/dashboard/wnba_v5_forward_validation.csv'
      - 'data/dashboard/wnba_v5_m06_report.json'
      - 'data/dashboard/wnba_alt_archive_health.json'
      - '.github/workflows/wnba-v5-ops-sprint1.yml'
concurrency:
  group: wnba-v5-ops-sprint1
  cancel-in-progress: false
jobs:
  build-v5-ops-sprint1:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync latest repository
        run: git pull --rebase origin main
      - name: Compile Sprint 1 engine
        run: python -m py_compile wnba_v5_ops_sprint1.py
      - name: Build Sprint 1 operational outputs
        run: python wnba_v5_ops_sprint1.py
      - name: Verify Operations Sprint 1
        run: |
          python - <<'PY'
          import json
          paths=[
            'data/dashboard/wnba_v5_shadow_monitor.json',
            'data/dashboard/wnba_v5_daily_shadow_report.json',
            'data/dashboard/wnba_v5_weekly_research_audit.json',
            'data/dashboard/wnba_v5_promotion_dashboard.json',
            'data/dashboard/wnba_v5_ops_sprint1_status.json',
          ]
          for path in paths:
              obj=json.load(open(path))
              print(path, obj.get('status') or obj.get('promotion_state') or obj.get('report_type'))
          s=json.load(open(paths[-1]))
          assert s['sprint']=='OPERATIONS_SPRINT_1'
          assert s['status']=='COMPLETE'
          assert all(v.startswith('READY') for v in s['deliverables'].values())
          p=json.load(open(paths[3]))
          assert p['promotion_state'] in {'SHADOW','CANDIDATE','PRODUCTION_READY'}
          PY
      - name: Publish Sprint 1 outputs safely
        run: |
          set -euo pipefail
          git config user.name "WNBA V5 Ops Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            data/dashboard/wnba_v5_shadow_monitor.json \
            data/dashboard/wnba_v5_daily_shadow_report.json \
            data/dashboard/wnba_v5_weekly_research_audit.json \
            data/dashboard/wnba_v5_promotion_dashboard.json \
            data/dashboard/wnba_v5_ops_sprint1_status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh WNBA V5 Operations Sprint 1"
          git pull --rebase origin main
          git push origin HEAD:main
