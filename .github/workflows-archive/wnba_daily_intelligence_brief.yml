name: WNBA Daily Intelligence Brief (Sprint 17 Commit 5)

on:
  workflow_dispatch:
  schedule:
    - cron: '30 */3 * * *'

concurrency:
  group: wnba-daily-intelligence-brief
  cancel-in-progress: false

jobs:
  build-daily-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate source code
        run: |
          python -m py_compile \
            wnba_market_timeline.py \
            wnba_line_movement_engine.py \
            wnba_steam_sharp_engine.py \
            wnba_clv_intelligence.py \
            wnba_entry_window_intelligence.py \
            wnba_automated_trend_discovery.py \
            wnba_trend_outcome_validation.py \
            wnba_closing_line_predictor.py \
            wnba_sportsbook_leader_normalization.py \
            wnba_opportunity_scanner.py \
            wnba_active_slate_scanner.py \
            wnba_daily_intelligence_brief.py \
            qa_daily_intelligence_brief.py

      - name: Refresh market intelligence chain
        run: |
          python wnba_market_timeline.py
          python wnba_line_movement_engine.py
          python wnba_steam_sharp_engine.py
          python wnba_clv_intelligence.py
          python wnba_entry_window_intelligence.py
          python wnba_automated_trend_discovery.py
          python wnba_trend_outcome_validation.py
          python wnba_closing_line_predictor.py
          python wnba_sportsbook_leader_normalization.py
          python wnba_opportunity_scanner.py
          python wnba_active_slate_scanner.py

      - name: Build daily intelligence brief
        run: python wnba_daily_intelligence_brief.py

      - name: Verify daily intelligence brief
        run: python qa_daily_intelligence_brief.py

      - name: Show daily intelligence brief
        run: cat data/dashboard/wnba_daily_intelligence_brief.json

      - name: Commit daily intelligence artifacts
        run: |
          git config user.name 'WNBA Daily Intelligence Bot'
          git config user.email 'actions@github.com'
          git add data/market data/forecast data/trends data/dashboard
          if git diff --cached --quiet; then
            echo 'No daily intelligence changes to commit.'
            exit 0
          fi
          git commit -m 'Refresh WNBA daily intelligence brief'
          git pull --rebase origin main
          git push origin HEAD:main
