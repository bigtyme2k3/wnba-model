name: WNBA Live Prediction Tracker (Validation Week Commit 1)

on:
  workflow_dispatch:
  schedule:
    # Runs shortly after the established live-odds refresh checkpoints.
    - cron: '55 11,13,15,17 * * *'

concurrency:
  group: wnba-odds-history-writes
  cancel-in-progress: false

jobs:
  capture-live-predictions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync latest committed live intelligence
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Validate tracker source and inputs
        run: |
          python -m py_compile wnba_live_prediction_tracker.py qa_live_prediction_tracker.py
          test -s data/forecast/live_opportunity_scanner.json
          test -s data/forecast/closing_line_predictions.json
          python - <<'PY'
          import json
          from pathlib import Path
          live=json.loads(Path('data/forecast/live_opportunity_scanner.json').read_text())
          print(json.dumps({
            'scanner_generated_at_utc': live.get('generated_at_utc'),
            'markets_available': len(live.get('markets', [])),
            'status_counts': live.get('status_counts', {})
          }, indent=2))
          PY

      - name: Capture committed live prediction state
        run: python wnba_live_prediction_tracker.py

      - name: Verify prediction tracker
        run: python qa_live_prediction_tracker.py

      - name: Show tracker summary
        run: cat data/dashboard/wnba_live_prediction_tracker_summary.json

      - name: Commit tracker artifacts safely
        run: |
          set -euo pipefail
          git config user.name 'WNBA Validation Tracker Bot'
          git config user.email 'actions@github.com'

          rm -rf /tmp/wnba-validation-generated
          mkdir -p /tmp/wnba-validation-generated/data/validation
          mkdir -p /tmp/wnba-validation-generated/data/dashboard
          cp data/validation/live_prediction_tracker.json /tmp/wnba-validation-generated/data/validation/
          cp data/dashboard/wnba_live_prediction_tracker_summary.json /tmp/wnba-validation-generated/data/dashboard/

          git fetch origin main
          git reset --hard origin/main
          mkdir -p data/validation data/dashboard
          cp /tmp/wnba-validation-generated/data/validation/live_prediction_tracker.json data/validation/
          cp /tmp/wnba-validation-generated/data/dashboard/wnba_live_prediction_tracker_summary.json data/dashboard/

          git add \
            data/validation/live_prediction_tracker.json \
            data/dashboard/wnba_live_prediction_tracker_summary.json
          if git diff --cached --quiet; then
            echo 'No live prediction tracker changes to commit.'
            exit 0
          fi
          git commit -m 'Capture live WNBA prediction validation state'
          git push origin HEAD:main
