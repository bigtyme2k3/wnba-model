name: WNBA Opportunity Scanner (Sprint 17 Commit 4)

on:
  workflow_dispatch:
  schedule:
    - cron: '15 */3 * * *'

concurrency:
  group: wnba-opportunity-scanner
  cancel-in-progress: false

jobs:
  build-opportunity-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate source code
        run: |
          python -m py_compile \
            wnba_market_timeline.py \
            wnba_line_movement_engine.py \
            wnba_steam_sharp_engine.py \
            wnba_clv_intelligence.py \
            wnba_entry_window_intelligence.py \
            wnba_automated_trend_discovery.py \
            wnba_trend_outcome_validation.py \
            wnba_closing_line_predictor.py \
            wnba_sportsbook_leader_normalization.py \
            wnba_opportunity_scanner.py \
            qa_opportunity_scanner.py

      - name: Refresh prerequisite intelligence
        run: |
          python wnba_market_timeline.py
          python wnba_line_movement_engine.py
          python wnba_steam_sharp_engine.py
          python wnba_clv_intelligence.py
          python wnba_entry_window_intelligence.py
          python wnba_automated_trend_discovery.py
          python wnba_trend_outcome_validation.py
          python wnba_closing_line_predictor.py
          python wnba_sportsbook_leader_normalization.py

      - name: Build opportunity scanner
        run: python wnba_opportunity_scanner.py

      - name: Verify opportunity scanner integrity
        run: python qa_opportunity_scanner.py

      - name: Show opportunity scanner summary
        run: cat data/dashboard/wnba_opportunity_scanner_summary.json

      - name: Commit opportunity scanner artifacts
        run: |
          git config user.name 'WNBA Opportunity Scanner Bot'
          git config user.email 'actions@github.com'
          git add data/market data/forecast data/trends data/dashboard
          if git diff --cached --quiet; then
            echo 'No opportunity scanner changes to commit.'
            exit 0
          fi
          git commit -m 'Refresh WNBA opportunity scanner intelligence'
          git pull --rebase origin main
          git push origin HEAD:main
