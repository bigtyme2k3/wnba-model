name: WNBA Phase 2 All Tabs V2

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/phase2_v2_refresh_request.txt'

permissions:
  contents: write

concurrency:
  group: wnba-main-writer
  cancel-in-progress: false

jobs:
  phase2:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: America/New_York
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest repository
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve Eastern slate date
        run: |
          TARGET=$(date +%F)
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "Phase 2 target: $TARGET"

      - name: Refresh canonical slate and inputs
        run: |
          run_if_present() { [ -f "$1" ] && python "$@" || echo "Skipping unavailable $1"; }
          run_if_present wnba_live_results.py --date "$TARGET"
          run_if_present wnba_schedule_refresh.py --date "$TARGET"
          run_if_present wnba_current_slate.py --date "$TARGET"
          run_if_present wnba_odds_ingestion.py --date "$TARGET"
          run_if_present wnba_player_props_ingestion.py --date "$TARGET"
          run_if_present wnba_injury_refresh.py --date "$TARGET"

      - name: Rebuild game and player intelligence
        run: |
          run_if_present() { [ -f "$1" ] && python "$@" || echo "Skipping unavailable $1"; }
          run_if_present wnba_minutes_projection.py --date "$TARGET"
          run_if_present wnba_unified_simulation.py --date "$TARGET"
          run_if_present wnba_game_prop_intelligence.py --date "$TARGET"
          run_if_present wnba_player_prop_intelligence.py --date "$TARGET"
          run_if_present wnba_daily_edge_engine.py --date "$TARGET"
          run_if_present wnba_ensemble_intelligence_engine.py --date "$TARGET"
          run_if_present wnba_monte_carlo_scenario_engine.py --date "$TARGET"
          run_if_present wnba_best_bets.py --date "$TARGET"
          run_if_present wnba_portfolio_engine.py --date "$TARGET"
          run_if_present wnba_alt_market_watch.py --date "$TARGET"
          run_if_present wnba_alt_streak_engine.py --date "$TARGET"
          run_if_present wnba_remaining_season_intelligence.py
          run_if_present wnba_adaptive_confidence_engine.py
          run_if_present wnba_forward_validation_engine.py
          run_if_present wnba_readiness_engine.py
          run_if_present wnba_production_readiness.py
          run_if_present wnba_model_audit.py
          run_if_present wnba_data_lineage.py

      - name: Grade results and performance
        run: |
          YESTERDAY=$(date -d yesterday +%F)
          if [ -f wnba_game_performance_tracker.py ]; then
            python wnba_game_performance_tracker.py --date "$YESTERDAY" --grade || true
            python wnba_game_performance_tracker.py --analyze
          fi
          if [ -f wnba_alt_performance_tracker.py ]; then
            python wnba_alt_performance_tracker.py --date "$YESTERDAY" --grade || true
            python wnba_alt_performance_tracker.py --date "$TARGET" --analyze
          fi
          [ -f wnba_alt_pending_diagnostics.py ] && python wnba_alt_pending_diagnostics.py || true
          [ -f grade_best_bets.py ] && python grade_best_bets.py || true

      - name: Reassert canonical slate and live state
        run: |
          python wnba_current_slate.py --date "$TARGET"
          [ -f wnba_v5_live_state_sync.py ] && python wnba_v5_live_state_sync.py

      - name: Rebuild dashboard HTML from current tab data
        run: |
          [ -f build_dashboard_v4.py ] && python build_dashboard_v4.py
          run_if_present() { [ -f "$1" ] && python "$@" || echo "Skipping unavailable $1"; }
          run_if_present patch_dashboard_v4_games_markets.py
          run_if_present patch_dashboard_v4_consistency.py
          run_if_present patch_dashboard_v4_live_slate.py
          run_if_present patch_dashboard_v4_portfolio_ai.py
          run_if_present patch_dashboard_navigation_v2.py

      - name: Verify Phase 2 outputs
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path

          target = os.environ['TARGET']
          root = Path('data/dashboard')
          master_path = root / 'wnba_master.json'
          if not master_path.exists():
              raise SystemExit('Missing canonical master')
          master = json.loads(master_path.read_text(encoding='utf-8'))
          if str(master.get('target_date') or '') != target:
              raise SystemExit(f'Master target mismatch: {master.get("target_date")} != {target}')
          today = [g for g in master.get('games', []) if str(g.get('bucket','')).lower() == 'today']
          if not today:
              raise SystemExit('No current-slate games in canonical master')

          required = {
              'games': ['wnba_master.json'],
              'game_props': ['wnba_game_props.json','wnba_game_prop_intelligence.json'],
              'player_props': ['wnba_player_props.json','wnba_player_prop_intelligence.json'],
              'alt_streaks': ['wnba_alt_streaks.json','wnba_alt_market_watch.json'],
              'alt_performance': ['wnba_alt_performance.json','wnba_alt_pending_diagnostics.json'],
              'daily_edges': ['wnba_daily_edges.json','wnba_daily_edge_engine.json'],
              'ensemble': ['wnba_ensemble_intelligence.json','wnba_ensemble.json'],
              'simulation': ['wnba_unified_simulation.json','wnba_monte_carlo_scenarios.json'],
              'best_bets': ['wnba_best_bets.json'],
              'portfolio': ['wnba_portfolio.json','wnba_portfolio_intelligence.json','wnba_portfolio_dashboard.json'],
              'results': ['wnba_results.json','wnba_live_results.json','wnba_results_grading.json'],
              'performance': ['wnba_game_performance.json','wnba_model_performance.json','best_bets_performance_summary.json'],
              'ai_center': ['wnba_ai_coach.json','wnba_daily_ai_report.json','wnba_model_audit.json'],
          }

          status = {}
          for tab, candidates in required.items():
              found = next((root / name for name in candidates if (root / name).exists()), None)
              status[tab] = {'status':'fresh' if found else 'missing','file':str(found) if found else None,'target_date':target}

          manifest = {'target_date':target,'today_games':len(today),'tabs':status}
          (root / 'wnba_tab_freshness.json').write_text(json.dumps(manifest, indent=2), encoding='utf-8')

          html = Path('docs/index.html')
          if not html.exists():
              raise SystemExit('Dashboard HTML missing')
          text = html.read_text(encoding='utf-8')
          for g in today:
              matchup = str(g.get('game') or '')
              if matchup and matchup not in text:
                  raise SystemExit(f'Current matchup missing from dashboard HTML: {matchup}')

          match = re.search(r'const EMBEDDED_TODAY=(.*?);\s*const EMBEDDED_RECENT=', text, re.S)
          if not match:
              raise SystemExit('Unable to locate embedded current-slate block')
          current_block = match.group(1)
          if 'Toronto Tempo @ Golden State Valkyries' in current_block:
              raise SystemExit('Stale Toronto matchup remains in current-slate block')

          critical = ['games','game_props','player_props','daily_edges','ensemble','simulation','best_bets','portfolio','results','performance','ai_center']
          missing = [name for name in critical if status[name]['status'] == 'missing']
          print(json.dumps(manifest, indent=2))
          if missing:
              raise SystemExit('Phase 2 missing required tab outputs: ' + ', '.join(missing))
          PY

      - name: Publish Phase 2 outputs atomically
        run: |
          git config user.name 'WNBA Phase 2 Bot'
          git config user.email 'actions@github.com'
          ALLOW_DASHBOARD_WRITE=1 GITHUB_WORKFLOW='WNBA V4 Player Props Polish' \
          bash scripts/atomic_generated_push.sh \
            "Complete Phase 2 all-tab rebuild for ${TARGET}" \
            'data/dashboard' \
            'data/wnba' \
            'data/warehouse' \
            'data/market' \
            'data/forecast' \
            'data/trends' \
            'docs/index.html'
