name: WNBA Validation Dashboard (Validation Week Commit 5)

on:
  workflow_dispatch:
  schedule:
    - cron: '35 12 * * *'

concurrency:
  group: wnba-odds-history-writes
  cancel-in-progress: false

jobs:
  build-validation-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate dashboard source
        run: |
          python -m py_compile \
            wnba_live_result_grader.py \
            wnba_validation_performance_analytics.py \
            wnba_signal_performance_engine.py \
            wnba_validation_dashboard.py \
            qa_validation_dashboard.py

      - name: Refresh validation analytics
        run: |
          python wnba_live_result_grader.py
          python wnba_validation_performance_analytics.py
          python wnba_signal_performance_engine.py

      - name: Build unified validation dashboard
        run: python wnba_validation_dashboard.py

      - name: Verify validation dashboard integrity
        run: python qa_validation_dashboard.py

      - name: Show validation dashboard summary
        run: cat data/dashboard/wnba_validation_dashboard_summary.json

      - name: Commit validation dashboard safely
        run: |
          set -euo pipefail
          git config user.name 'WNBA Validation Dashboard Bot'
          git config user.email 'actions@github.com'

          rm -rf /tmp/wnba-validation-dashboard
          mkdir -p /tmp/wnba-validation-dashboard
          cp -a data /tmp/wnba-validation-dashboard/

          git fetch origin main
          git reset --hard origin/main
          rm -rf data
          cp -a /tmp/wnba-validation-dashboard/data ./data

          git add data/validation data/dashboard
          if git diff --cached --quiet; then
            echo 'No validation dashboard changes to commit.'
            exit 0
          fi
          git commit -m 'Refresh WNBA validation dashboard'
          git push origin HEAD:main
