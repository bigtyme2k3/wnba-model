name: "WNBA Sprint 22 Phase 2 Player Intelligence"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sprint-22-phase-2-player-intelligence
  cancel-in-progress: false

jobs:
  build-player-warehouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pandas
      - name: Compile Phase 2 code
        run: python -m py_compile build_sprint22_phase2_player_warehouse.py qa_sprint22_phase2_player_warehouse.py
      - name: Run Phase 2 QA
        run: python qa_sprint22_phase2_player_warehouse.py
      - name: Build player intelligence warehouse
        run: python build_sprint22_phase2_player_warehouse.py
      - name: Verify player catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('data/warehouse/sprint22/player')
          catalog=json.loads((root/'player_catalog.json').read_text())
          expected={'player_profile','player_game_logs','player_rolling_metrics','player_availability','player_matchups'}
          assert set(catalog['tables'])==expected
          for table in expected:
              assert (root/f'{table}.csv').exists()
          assert catalog['duplicate_game_keys']==0
          assert catalog['rolling_is_pregame_lagged'] is True
          assert catalog['status'] in {'PASS','WARN'}
          print('Sprint 22 Phase 2 verification passed:', {'status':catalog['status'],'tables':{k:v['rows'] for k,v in catalog['tables'].items()}})
          PY
      - name: Commit player warehouse artifacts
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/warehouse/sprint22/player/
          git diff --cached --quiet && exit 0
          git commit -m "Update Sprint 22 Phase 2 player intelligence"
          git pull --rebase origin main
          git push origin HEAD:main
