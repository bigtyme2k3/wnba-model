<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WNBA Market Intelligence</title><style>:root{--bg:#07111f;--panel:#0f1d30;--panel2:#14253b;--text:#eef6ff;--muted:#93a7bd;--accent:#5eead4;--warn:#fbbf24;--danger:#fb7185;--line:#263a52}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07111f,#0b1728);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif}.wrap{max-width:1400px;margin:auto;padding:18px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:18px}.hero h1{margin:0;font-size:clamp(25px,5vw,44px)}.muted{color:var(--muted)}.status{padding:8px 12px;border:1px solid var(--line);border-radius:999px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{background:rgba(15,29,48,.94);border:1px solid var(--line);border-radius:16px;padding:16px;overflow:auto}.kpi{grid-column:span 3}.kpi b{font-size:30px;display:block;margin-top:8px}.wide{grid-column:span 8}.side{grid-column:span 4}.full{grid-column:1/-1}h2{font-size:18px;margin:0 0 12px}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted)}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--panel2);font-size:12px}.good{color:var(--accent)}.warn{color:var(--warn)}.bad{color:var(--danger)}.bars{display:grid;gap:10px}.bar{display:grid;grid-template-columns:110px 1fr 44px;gap:8px;align-items:center}.track{height:9px;background:#091321;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#5eead4,#60a5fa)}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.tabs button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 12px}.alert{padding:11px;border-bottom:1px solid var(--line)}@media(max-width:900px){.kpi{grid-column:span 6}.wide,.side{grid-column:1/-1}.hero{align-items:start;flex-direction:column}}@media(max-width:520px){.kpi{grid-column:1/-1}.wrap{padding:10px}}</style></head><body><main class="wrap"><div class="hero"><div><div class="muted">Sprint 20 · Professional Dashboard</div><h1>WNBA Market Intelligence</h1><div id="date" class="muted">Loading current slate…</div></div><div id="status" class="status">Connecting</div></div><div class="tabs" id="tabs"></div><section class="grid" id="app"><div class="card full">Loading dashboard data…</div></section></main><script>
const money=o=>o==null?'—':(o>0?`+${o}`:`${o}`),pct=v=>v==null?'—':`${Number(v).toFixed(2)}%`,esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function table(rows,cols){if(!rows?.length)return '<div class="muted">No qualifying records.</div>';return `<table><thead><tr>${cols.map(c=>`<th>${c[0]}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${c[1](r)}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
function bars(obj){let entries=Object.entries(obj||{}).sort((a,b)=>b[1]-a[1]),max=Math.max(1,...entries.map(x=>x[1]));return `<div class="bars">${entries.slice(0,10).map(([k,v])=>`<div class="bar"><span>${esc(k)}</span><div class="track"><div class="fill" style="width:${100*v/max}%"></div></div><b>${v}</b></div>`).join('')}</div>`}
function render(d){let s=d.executive_summary||{},c=d.command_center||{};document.querySelector('#date').textContent=`Slate ${d.target_date||'—'} · Updated ${new Date(d.generated_at_utc).toLocaleString()}`;document.querySelector('#status').textContent='Live data loaded';document.querySelector('#status').classList.add('good');document.querySelector('#tabs').innerHTML=(d.navigation||[]).map(x=>`<button onclick="document.getElementById('${x.id}').scrollIntoView({behavior:'smooth'})">${esc(x.label)}</button>`).join('');let kpis=[['Actionable',s.actionable_opportunities],['Average EV',pct(s.average_expected_value_pct)],['Arbitrage',s.arbitrage_opportunities],['Middles',s.middle_opportunities],['Steam alerts',s.steam_alerts],['Tracked markets',s.tracked_markets],['Ranked',s.ranked_opportunities],['Positive CLV',s.positive_clv]];let oppCols=[['Player / Game',r=>`<b>${esc(r.player||r.game)}</b><div class="muted">${esc(r.game)}</div>`],['Market',r=>`${esc(r.market)} ${esc(r.side)}`],['Book',r=>esc(r.best_book)],['Line',r=>esc(r.best_line)],['Odds',r=>money(r.best_odds)],['EV',r=>pct((r.expected_value||0)*100)],['Index',r=>esc(r.opportunity_index)],['Call',r=>`<span class="pill">${esc(r.recommendation)}</span>`]];let arbCols=[['Market',r=>`${esc(r.player||r.game)} ${esc(r.market)}`],['Over',r=>`${esc(r.over_book)} ${money(r.over_odds)}`],['Under',r=>`${esc(r.under_book)} ${money(r.under_odds)}`],['Edge',r=>pct(r.arb_edge_pct)]];let moveCols=[['Market',r=>`${esc(r.player||r.game)} ${esc(r.market)} ${esc(r.side)}`],['Move',r=>esc(r.total_directional_line_move)],['Books',r=>esc(r.book_count)],['Steam',r=>r.steam_detected?'YES':'NO'],['Confidence',r=>esc(r.market_confidence_score)]];document.querySelector('#app').innerHTML=`<div id="overview" class="full grid">${kpis.map(x=>`<div class="card kpi"><span class="muted">${x[0]}</span><b>${x[1]??'—'}</b></div>`).join('')}</div><div id="opportunities" class="card wide"><h2>Top Opportunities</h2>${table(c.top_opportunities,oppCols)}</div><div class="card side"><h2>Recommendation Mix</h2>${bars(d.distribution?.recommendations)}</div><div id="arbitrage" class="card wide"><h2>Arbitrage Opportunities</h2>${table(c.arbitrage,arbCols)}</div><div class="card side"><h2>Best Sportsbooks</h2>${bars(d.distribution?.best_books)}</div><div id="movement" class="card wide"><h2>Market Movement</h2>${table(c.largest_moves,moveCols)}</div><div class="card side"><h2>Market Mix</h2>${bars(d.distribution?.markets)}</div><div id="line-shopping" class="card full"><h2>Intelligence Alerts</h2>${(d.alerts||[]).slice(0,20).map(a=>`<div class="alert"><b>${esc(a.type)} · ${esc(a.title)}</b><div class="muted">${esc(a.detail)}</div></div>`).join('')||'<div class="muted">No alerts.</div>'}</div><div id="clv" class="card full"><h2>Source Health</h2>${table(Object.entries(d.source_health||{}).map(([name,x])=>({name,...x})),[['Source',r=>esc(r.name)],['Available',r=>r.available?'YES':'NO'],['Target date',r=>esc(r.target_date)],['Generated',r=>esc(r.generated_at_utc)]])}</div>`}
fetch('./data/professional_dashboard.json?ts='+Date.now()).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(render).catch(e=>{document.querySelector('#status').textContent='Data unavailable';document.querySelector('#status').classList.add('bad');document.querySelector('#app').innerHTML=`<div class="card full"><h2>Dashboard data has not been generated yet.</h2><div class="muted">Run the Sprint 20 Phase 5 GitHub Actions workflow. ${esc(e.message)}</div></div>`});
</script></body></html>
